<script>
DCRun(window.DAS_COMPONENTS, {"name": "CaptureItem", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Roboto',system-ui,sans-serif; font-size: 14px; line-height: 1.45\">\n<dc-import name=\"Sidebar\" active=\"capture\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"CaptureItem\" crumb=\"Capture / B-2202\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<a href=\"CaptureQueue.html\" style=\"font-weight: 700; font-size: 13px; text-decoration: none\">← Back to queue<\/a>\n<div><div style=\"font-size: 13px; color: #4A6B6C\">Drop-off · B-2202 · not yet a record<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 32px\">Index and declare<\/h1><\/div>\n\n<ol aria-label=\"Capture pipeline\" style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px\">\n<sc-for list=\"{{stages}}\" as=\"s\" hint-placeholder-count=\"7\">\n<li aria-current=\"{{s.cur}}\" style=\"flex: 1 1 120px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: {{s.weight}}; color: {{s.fg}}\"><span style=\"height: 6px; border-radius: 3px; background: {{s.bar}}\"><\/span>{{s.label}}<\/li>\n<\/sc-for>\n<\/ol>\n\n<sc-if value=\"{{editing}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<div style=\"flex: 2 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<section aria-label=\"Preview\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; overflow: hidden\">\n<div style=\"background: #E9E7D8; padding: 24px; display: flex; justify-content: center\">\n<div style=\"width: 100%; max-width: 340px; height: 420px; background: #FFFFFF; box-shadow: 0 3px 10px rgba(0,50,52,.16); padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 9px\">\n<span style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 500\">Information Security Policy<\/span>\n<span style=\"font-size: 11px; color: #4A6B6C\">Issue 4 · 2026/IT/0871<\/span>\n<span style=\"height: 5px; width: 92%; background: #E5E2CB; border-radius: 3px; margin-top: 10px\"><\/span><span style=\"height: 5px; width: 84%; background: #E5E2CB; border-radius: 3px\"><\/span><span style=\"height: 5px; width: 88%; background: #E5E2CB; border-radius: 3px\"><\/span><span style=\"height: 5px; width: 60%; background: #E5E2CB; border-radius: 3px\"><\/span><span style=\"height: 5px; width: 90%; background: #E5E2CB; border-radius: 3px; margin-top: 10px\"><\/span><span style=\"height: 5px; width: 76%; background: #E5E2CB; border-radius: 3px\"><\/span>\n<\/div>\n<\/div>\n<div style=\"padding: 14px 18px; font-size: 13px; display: flex; flex-direction: column; gap: 4px\">\n<span><strong>14 pages<\/strong> · OCR 0.97 · <span style=\"color: #63420F\">low-confidence pages: 9, 12<\/span><\/span>\n<span style=\"color: #4A6B6C\">Extracted: date 2026-09-21 · ref. 2026/IT/0871 · correspondent Emirates Data Centre<\/span>\n<\/div>\n<\/section>\n<section aria-labelledby=\"prop-h\" style=\"background: #003234; color: #FFFFFF; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-size: 12px; color: #8FD9B5; font-weight: 700\">{{propTag}}<\/span>\n<h2 id=\"prop-h\" style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 20px\">Series IT-RE-1 · Sensitive<\/h2>\n<div style=\"display: flex; align-items: center; gap: 10px; font-size: 13px\"><span style=\"flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden\"><span style=\"display: block; height: 100%; width: 92%; background: #269D6A\"><\/span><\/span>Confidence 0.92<\/div>\n<button type=\"button\" onClick=\"{{onAccept}}\" style=\"align-self: flex-start; height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">{{acceptLabel}}<\/button>\n<\/section>\n<\/div>\n\n<form aria-label=\"Index form\" style=\"flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<sc-for list=\"{{groups}}\" as=\"g\" hint-placeholder-count=\"4\">\n<fieldset style=\"margin: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 18px 20px 20px\">\n<legend style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 17px; padding: 0 6px; margin-inline-start: -6px\">{{g.title}}<\/legend>\n<div style=\"font-size: 12px; color: #4A6B6C; margin: -2px 0 12px\">{{g.hint}}<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px\">\n<sc-for list=\"{{g.fields}}\" as=\"f\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"{{f.id}}\" style=\"font-size: 13px; font-weight: 700\">{{f.label}}<sc-if value=\"{{f.req}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color: #B01C01\"> *<\/span><\/sc-if><\/label>\n<input id=\"{{f.id}}\" value=\"{{f.value}}\" readonly=\"{{f.locked}}\" dir=\"{{f.dir}}\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234; background: {{f.bg}}\">\n<\/div>\n<\/sc-for>\n<\/div>\n<\/fieldset>\n<\/sc-for>\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px\"><span style=\"color: #4A6B6C\">Route on submit<\/span><span style=\"padding: 3px 10px; border-radius: 999px; background: #E2F1EA; color: #005F4F; font-weight: 700\">Head of IT<\/span><span aria-hidden=\"true\">→<\/span><span style=\"padding: 3px 10px; border-radius: 999px; background: #E2F1EA; color: #005F4F; font-weight: 700\">Information owner<\/span><\/div>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n<button type=\"button\" onClick=\"{{onReturn}}\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: transparent; color: #005F4F; font: inherit; font-weight: 700; cursor: pointer\">Return to scanner<\/button>\n<button type=\"button\" onClick=\"{{onSave}}\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">Save draft<\/button>\n<button type=\"button\" onClick=\"{{onConfirm}}\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">Confirm index and submit<\/button>\n<\/div>\n<\/div>\n<\/form>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{done}}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"ci-done-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 28px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center\">\n<span style=\"width: 56px; height: 56px; border-radius: 14px; background: #E2F1EA; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#005F4F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg><\/span>\n<div style=\"flex: 1 1 360px; display: flex; flex-direction: column; gap: 4px\">\n<span style=\"align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #FAE3BE; color: #63420F\">Record pending approval<\/span>\n<h2 id=\"ci-done-h\" style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 22px\">Submitted for approval<\/h2>\n<p style=\"margin: 0; color: #4A6B6C\">Code SS-IT-PY-02-R4 reserved · routed to Head of IT, then the Information owner. It becomes a declared record once approved.<\/p>\n<\/div>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<a href=\"CaptureQueue.html\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">Back to queue<\/a>\n<a href=\"Task.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">Open the approval task<\/a>\n<\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { accepted: false, done: false, toast: null }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const cur = st.done ? 6 : 5;\n    let n = 0;\n    const f = (label, value, o) => ({ id: 'ci-' + (++n), label, value, req: !!(o && o.req), locked: !!(o && o.locked), dir: o && o.ar ? 'rtl' : 'ltr', bg: o && o.locked ? '#F4F4EE' : '#FFFFFF' });\n    const names = ['Arrived', 'AV clean', 'OCR · PDF/A-2b', 'Extraction', 'Proposal', 'Human confirmation', 'Code · route · declare'];\n    return {\n      toastOn: !!st.toast, toastText: st.toast || '',\n      editing: !st.done, done: !!st.done,\n      propTag: st.accepted ? 'Proposal accepted · rule R-0214' : 'Proposed index · rule R-0214 matched',\n      acceptLabel: st.accepted ? '✓ Proposal accepted' : 'Accept proposal',\n      onAccept: () => { this.setState({ accepted: true }); this.say('Proposal accepted · series IT-RE-1 · Sensitive'); },\n      onSave: () => this.say('Draft saved'),\n      onReturn: () => this.say('Item #4470 returned to scanner SS-02 for rescan'),\n      onConfirm: () => { this.setState({ done: true }); this.say('Index submitted · approval task sent to Head of IT'); },\n      stages: names.map((label, i) => ({ label, cur: i === cur ? 'step' : 'false', bar: i < cur ? '#269D6A' : i === cur ? '#005F4F' : '#E5E2CB', fg: i <= cur ? '#003234' : '#4A6B6C', weight: i === cur ? 700 : 400 })),\n      groups: [\n        { title: 'Identity', hint: 'What the document is', fields: [\n          f('Title (English)', 'Information Security Policy — Issue 4', { req: true }),\n          f('Title (Arabic)', 'سياسة أمن المعلومات — الإصدار 4', { req: true, ar: true }),\n          f('Document code', 'SS-IT-PY-02-R4 · reserved on declare', { locked: true }),\n          f('Document type', 'Policy', { req: true }), f('Language', 'Bilingual'), f('Date of issue', '2026-09-21', { req: true }) ] },\n        { title: 'Classification', hint: 'Where it sits in the file plan', fields: [\n          f('Sector', 'SS · Support Services', { req: true }), f('Division', 'IT · Information Technology', { req: true }),\n          f('Function › activity › process', 'Support services › IT › Policy'), f('Record series', 'IT-RE-1', { req: true }),\n          f('Confidentiality', 'Sensitive', { req: true }), f('Information owner', 'Khalid Al Mazrouei · Head of IT'),\n          f('Vitality', 'Vital'), f('Media form', 'Electronic'), f('Physical location', '—') ] },\n        { title: 'Retention', hint: 'Bound from series IT-RE-1 · read-only', fields: [\n          f('Active years', '5', { locked: true }), f('Archive years', '10', { locked: true }),\n          f('Final disposition', 'Appraise', { locked: true }), f('Date archived', 'Set on Gate 1', { locked: true }) ] },\n        { title: 'Relations', hint: 'Links to other records and systems', fields: [\n          f('Supersedes', 'SS-IT-PY-02-R3'), f('ERP reference', 'PO-2026-04471 · AED 720,000'),\n          f('Correspondent', 'Emirates Data Centre'), f('Keywords', 'security, access, ISMS'), f('Notes to reviewer', 'Section 6 rewritten after the CISO review') ] },\n      ],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1500}}});
</script>
