<!doctype html>

<div id="dc-root"></div>
<script>
DCRun(window.DAS_COMPONENTS, {"name": "RecordsConsoleAr", "template": "\n<helmet>\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div dir=\"rtl\" style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Neue Frutiger World','Segoe UI',system-ui,sans-serif; font-size: 14px; line-height: 1.6\">\n<dc-import name=\"Sidebar\" active=\"records\" lang=\"ar\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"RecordsConsole\" crumb=\"السجلات\" lang=\"ar\" persona=\"rashed\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n\n<nav aria-labelledby=\"fpa-h\" style=\"flex: 1 1 260px; max-width: 320px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n<h2 id=\"fpa-h\" style=\"margin: 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\">خطة الملفات<\/h2>\n<div style=\"font-size: 12px; color: #4A6B6C\">10 قطاعات · 24 إدارة · 464 سلسلة<\/div>\n<label for=\"fpa-find\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">البحث عن سلسلة<\/label>\n<input id=\"fpa-find\" placeholder=\"البحث عن سلسلة…\" style=\"height: 40px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234\">\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px\">\n<sc-for list=\"{{tree}}\" as=\"n\" hint-placeholder-count=\"12\">\n<li><button type=\"button\" onClick=\"{{n.pick}}\" aria-current=\"{{n.cur}}\" style=\"width: 100%; border: 0; font: inherit; text-align: start; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 10px; padding-inline-start: {{n.pad}}; border-radius: 8px; text-decoration: none; color: {{n.fg}}; background: {{n.bg}}; font-weight: {{n.weight}}\"><span style=\"width: 12px; color: #4A6B6C\">{{n.caret}}<\/span><span style=\"flex: 1\">{{n.label}}<\/span><span style=\"font-size: 12px; color: {{n.countFg}}\">{{n.count}}<\/span><\/button><\/li>\n<\/sc-for>\n<\/ul>\n<\/nav>\n\n<div style=\"flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 24px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end\">\n<div><div style=\"font-size: 13px; color: #4A6B6C\">السلسلة · خط الأساس لسجل السجلات <span dir=\"ltr\">v2026.1<\/span> (موقّع في 2 مارس 2026)<\/div>\n<h1 style=\"margin: 4px 0 6px; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 28px\"><span dir=\"ltr\">{{selCode}}<\/span> · {{selName}}<\/h1>\n<span style=\"padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #E2F1EA; color: #005F4F\">مُحدَّث ومُدار<\/span><\/div>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n<a href=\"SearchAr.html\" style=\"height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">سحب السلسلة كاملة<\/a>\n<a href=\"LegalHoldsAr.html\" style=\"height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #B2C4BE; color: #003234; font-weight: 700; display: inline-flex; align-items: center; text-decoration: none\">تطبيق حجز<\/a>\n<a href=\"AdminAr.html\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">اقتراح تعديل الاستبقاء<\/a>\n<\/div>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n<sc-for list=\"{{stats}}\" as=\"s\" hint-placeholder-count=\"4\">\n<dc-import name=\"StatTile\" label=\"{{s.label}}\" value=\"{{s.n}}\" sub=\"{{s.sub}}\" icon=\"{{s.icon}}\" tone=\"{{s.tone}}\" href=\"{{s.href}}\" lang=\"ar\" hint-size=\"100%,146px\"><\/dc-import>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<section aria-labelledby=\"rulea-h\" style=\"flex: 3 1 380px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px\">\n<h2 id=\"rulea-h\" style=\"margin: 0 0 12px; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\">القاعدة السارية<\/h2>\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px 20px\">\n<sc-for list=\"{{rule}}\" as=\"r\" hint-placeholder-count=\"10\">\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">{{r.k}}<\/dt><dd style=\"margin: 2px 0 0; font-weight: 700\">{{r.v}}<\/dd><\/div>\n<\/sc-for>\n<\/dl>\n<\/section>\n<section aria-labelledby=\"gatea-h\" style=\"flex: 2 1 300px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px\">\n<h2 id=\"gatea-h\" style=\"margin: 0 0 8px; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\">البوابات المستحقة · 90 يوماً<\/h2>\n<sc-for list=\"{{gates}}\" as=\"g\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid #F0EEE2; font-size: 13px\"><span style=\"flex: 1; min-width: 0\"><a href=\"DocumentAr.html\" style=\"display: block; font-weight: 700\">{{g.title}}<\/a><span dir=\"ltr\" style=\"font-family: Consolas, monospace; font-size: 12px; color: #4A6B6C\">{{g.code}}<\/span><\/span><span style=\"padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: #E2F1EA; color: #005F4F\">{{g.gate}}<\/span><span style=\"width: 76px; text-align: end\">{{g.due}}<\/span><\/div>\n<\/sc-for>\n<p style=\"margin: 10px 0 0; font-size: 12px; color: #4A6B6C\">تنقل البوابة 1 السجلات إلى مركز الأرشيف بعد انتهاء الفترة النشطة. وتفتح البوابة 2 الإتلاف بعد انتهاء فترة الأرشيف. ويعلّق الحجز كلتيهما.<\/p>\n<\/section>\n<\/div>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { sel: 5 }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const sel = st.sel == null ? 5 : st.sel;\n    let ix = 0;\n    const n = (label, lvl, count, open, _c) => { const i = ix++; const cur = i === sel; return { label, count, lvl, i, cur: cur ? 'page' : 'false', pad: (10 + lvl * 16) + 'px', caret: lvl < 2 ? (open ? '▾' : '◂') : '', fg: cur ? '#FFFFFF' : '#003234', bg: cur ? '#005F4F' : 'transparent', weight: cur || lvl === 0 ? 700 : 400, countFg: cur ? 'rgba(255,255,255,.85)' : '#4A6B6C' }; };\n    const nodes = [\n        n('SS · الخدمات المساندة', 0, '148', true), n('IT · تقنية المعلومات', 1, '22', true),\n        n('IT-RE-1 · أصول أجهزة تقنية المعلومات', 2, '1,904'), n('IT-RE-7 · الحوادث والطلبات والدعم', 2, '18,220'),\n        n('IT-RE-8 · مجلس استشارات التغيير', 2, '312'), n('IT-RE-10 · سجل عقود تقنية المعلومات', 2, '486', false, true),\n        n('IT-RE-12 · سياسات تقنية المعلومات', 2, '146'), n('HR · الموارد البشرية', 1, '31'), n('FN · المالية', 1, '27'), n('PG · المشتريات والخدمات العامة', 1, '24'),\n        n('DG · مكتب المدير العام', 0, '18'), n('INV · الاستثمار', 0, '61'),\n    ];\n    const cur = nodes[sel] || nodes[5];\n    const cut = cur.label.indexOf(' · ');\n    const msg = l => 'عرض ' + l + ' · اختر سلسلة لعرض قاعدتها';\n    const tree = nodes.map(x => ({ ...x, pick: () => { this.setState({ sel: x.i }); if (x.lvl < 2) this.say(msg(x.label)); } }));\n    return {\n      tree,\n      selCode: cur.label.slice(0, cut), selName: cur.label.slice(cut + 3),\n      toastOn: !!st.toast, toastText: st.toast || '',\n      stats: [\n        { label: 'العناصر', n: String(cur.count), sub: sel === 5 ? '402 نشطة، 84 وسيطة' : 'في العقدة المحددة', icon: 'layers', tone: 'default', href: '' }, { label: 'دائمة · WORM', n: '0', sub: 'الإجراء النهائي: تقييم', icon: 'storage', tone: 'default', href: '' },\n        { label: 'محجوزة', n: '2,410', sub: 'LH-2025-03 · 2019–2023', icon: 'shield', tone: 'default', href: 'LegalHoldsAr.html' }, { label: 'استحقاق البوابة 1 · 90 يوماً', n: '14', sub: 'إلى مركز الأرشيف', icon: 'hourglass', tone: 'default', href: 'DispositionAr.html' },\n      ],\n      rule: [\n        { k: 'رمز السلسلة', v: 'IT-RE-10' }, { k: 'التصنيف', v: 'الخدمات المساندة › المشتريات والعقود' },\n        { k: 'درجة السرية الافتراضية', v: 'سري' }, { k: 'الاستبقاء النشط', v: '5 سنوات' },\n        { k: 'استبقاء الأرشيف', v: '10 سنوات' }, { k: 'الإجراء النهائي', v: 'تقييم' },\n        { k: 'الأهمية', v: 'حيوية' }, { k: 'نوع المحتوى', v: 'عقد DAS' },\n        { k: 'المكتبات', v: 'العقود واتفاقيات الخدمة' }, { k: 'اعتماد الأرشيف الوطني', v: 'معتمد · 2026.1' },\n      ],\n      gates: [\n        { title: 'عقد صيانة الشبكة 2021', code: 'SS-IT-CR-071', gate: 'البوابة 1', due: '18 ديسمبر' },\n        { title: 'تجديد الترخيص — حزمة الأمن', code: 'SS-IT-CR-076', gate: 'البوابة 1', due: '5 يناير' },\n        { title: 'اتفاقية مستوى خدمة الطباعة', code: 'SS-IT-CR-079', gate: 'البوابة 1', due: '22 يناير' },\n        { title: 'إسناد مكتب الدعم الفني 2011', code: 'SS-IT-CR-012', gate: 'البوابة 2', due: '31 يناير' },\n      ],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1100}}});
</script>
</body>
</html>
