<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · DAS prototype</title>
<style>body{margin:0}</style>
<script src="das-runtime.js"></script>
<script src="components.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script>
DCRun(window.DAS_COMPONENTS, {"name": "Projects", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Roboto',system-ui,sans-serif; font-size: 14px; line-height: 1.45\">\n<dc-import name=\"Sidebar\" active=\"projects\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"Projects\" crumb=\"Projects\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div><div style=\"font-size: 13px; color: #4A6B6C\">Project files · each bound to a project record series<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 32px\">Projects<\/h1><\/div>\n<button type=\"button\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{onNew}}\">+ New project<\/button>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n<sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"5\">\n<dc-import name=\"StatTile\" label=\"{{k.label}}\" value=\"{{k.n}}\" sub=\"{{k.sub}}\" icon=\"{{k.icon}}\" tone=\"{{k.tone}}\" href=\"{{k.href}}\" hint-size=\"100%,146px\"><\/dc-import>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<section aria-label=\"Project list\" style=\"flex: 3 1 560px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid #E5E2CB\">\n<div role=\"tablist\" aria-label=\"Project phase\" style=\"display: flex; gap: 24px\">\n<sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"3\">\n<button type=\"button\" role=\"tab\" aria-selected=\"{{t.sel}}\" onClick=\"{{t.pick}}\" style=\"height: 48px; border: 0; border-bottom: 3px solid {{t.line}}; background: transparent; font: inherit; font-weight: {{t.weight}}; color: {{t.fg}}; cursor: pointer\">{{t.label}}<\/button>\n<\/sc-for>\n<\/div>\n<label for=\"pj-f\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Filter projects<\/label>\n<input id=\"pj-f\" placeholder=\"Filter projects\" style=\"height: 38px; width: 220px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234\">\n<\/div>\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 700px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">Project<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Division · sponsor<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Phase<\/th>\n<th scope=\"col\" style=\"text-align: end; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Documents<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Deliverables<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 8px; border-bottom: 1px solid #E5E2CB\">End date<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"5\">\n<tr style=\"background: {{r.bg}}\">\n<td style=\"padding: 14px 20px; border-bottom: 1px solid #F0EEE2\"><button type=\"button\" onClick=\"{{r.pick}}\" aria-pressed=\"{{r.pressed}}\" style=\"padding: 0; border: 0; background: transparent; font: inherit; font-weight: 700; color: #005F4F; text-align: start; cursor: pointer\">{{r.name}}<\/button><div style=\"font-family: 'Roboto Mono',Consolas,monospace; font-size: 12px; color: #4A6B6C\">{{r.code}} · PM {{r.pm}}<\/div><\/td>\n<td style=\"padding: 14px 8px; border-bottom: 1px solid #F0EEE2\">{{r.div}}<\/td>\n<td style=\"padding: 14px 8px; border-bottom: 1px solid #F0EEE2\"><span style=\"padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: {{r.phBg}}; color: {{r.phFg}}\">{{r.phase}}<\/span><\/td>\n<td style=\"padding: 14px 8px; border-bottom: 1px solid #F0EEE2; text-align: end; font-weight: 700\">{{r.docs}}<\/td>\n<td style=\"padding: 14px 8px; border-bottom: 1px solid #F0EEE2\"><span style=\"display: inline-flex; align-items: center; gap: 8px\"><span style=\"width: 70px; height: 6px; border-radius: 3px; background: #E5E2CB; overflow: hidden; display: block\"><span style=\"display: block; height: 100%; width: {{r.w}}; background: #269D6A\"><\/span><\/span>{{r.del}}<\/span><\/td>\n<td style=\"padding: 14px 20px 14px 8px; border-bottom: 1px solid #F0EEE2\">{{r.end}}<\/td>\n<\/tr>\n<\/sc-for>\n<sc-if value=\"{{noRows}}\" hint-placeholder-val=\"{{ false }}\">\n<tr><td colspan=\"6\" style=\"padding: 20px; color: #4A6B6C\">{{emptyText}}<\/td><\/tr>\n<\/sc-if>\n<\/tbody>\n<\/table>\n<\/div>\n<\/section>\n\n<aside aria-labelledby=\"pd-h\" style=\"flex: 2 1 320px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<div><div style=\"font-family: 'Roboto Mono',Consolas,monospace; font-size: 12px; color: #4A6B6C\">{{p.code}} · {{p.fileCode}}<\/div>\n<h2 id=\"pd-h\" style=\"margin: 4px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 20px\">{{p.name}}<\/h2><\/div>\n<dl style=\"margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 13px\">\n<dt style=\"color: #4A6B6C\">Sponsor<\/dt><dd style=\"margin: 0; font-weight: 700\">{{p.sponsor}}<\/dd>\n<dt style=\"color: #4A6B6C\">Manager<\/dt><dd style=\"margin: 0; font-weight: 700\">{{p.pm}}<\/dd>\n<dt style=\"color: #4A6B6C\">Series<\/dt><dd style=\"margin: 0; font-weight: 700\">{{p.series}}<\/dd>\n<dt style=\"color: #4A6B6C\">Phase<\/dt><dd style=\"margin: 0; font-weight: 700\">{{p.phaseLine}}<\/dd>\n<\/dl>\n<div role=\"tablist\" aria-label=\"Project detail\" style=\"display: inline-flex; background: #F4F4EE; border-radius: 10px; padding: 4px; gap: 4px; font-size: 13px; align-self: flex-start\">\n<sc-for list=\"{{segs}}\" as=\"g\" hint-placeholder-count=\"3\">\n<button type=\"button\" role=\"tab\" aria-selected=\"{{g.sel}}\" onClick=\"{{g.pick}}\" style=\"padding: 6px 12px; border-radius: 8px; border: 0; font: inherit; background: {{g.bg}}; color: {{g.fg}}; font-weight: {{g.weight}}; cursor: pointer\">{{g.label}}<\/button>\n<\/sc-for>\n<\/div>\n<sc-if value=\"{{showRegister}}\" hint-placeholder-val=\"{{ false }}\">\n<dl style=\"margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 13px\">\n<sc-for list=\"{{register}}\" as=\"g\" hint-placeholder-count=\"4\">\n<dt style=\"color: #4A6B6C\">{{g.k}}<\/dt><dd style=\"margin: 0; font-weight: 700; text-align: end\">{{g.v}}<\/dd>\n<\/sc-for>\n<\/dl>\n<\/sc-if>\n<sc-if value=\"{{showTeam}}\" hint-placeholder-val=\"{{ false }}\">\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px\">\n<sc-for list=\"{{team}}\" as=\"m\" hint-placeholder-count=\"4\">\n<li style=\"display: flex; gap: 10px; align-items: center; justify-content: space-between\"><strong>{{m.who}}<\/strong><span style=\"color: #4A6B6C\">{{m.role}}<\/span><\/li>\n<\/sc-for>\n<\/ul>\n<\/sc-if>\n<sc-if value=\"{{showClose}}\" hint-placeholder-val=\"{{ true }}\">\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px\">\n<sc-for list=\"{{checks}}\" as=\"c\" hint-placeholder-count=\"5\">\n<li style=\"display: flex; gap: 10px; align-items: center\"><span style=\"width: 22px; height: 22px; border-radius: 11px; flex: 0 0 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: {{c.bg}}; color: {{c.fg}}\">{{c.mark}}<\/span><span style=\"flex: 1\">{{c.label}}<\/span><span style=\"font-size: 12px; color: #4A6B6C\">{{c.note}}<\/span><\/li>\n<\/sc-for>\n<\/ul>\n<\/sc-if>\n<button type=\"button\" onClick=\"{{onSignoff}}\" style=\"height: 44px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">Request sponsor sign-off<\/button>\n<button type=\"button\" disabled style=\"height: 44px; border-radius: 10px; border: 0; background: #E5E2CB; color: #4A6B6C; font: inherit; font-weight: 700\">Close project and declare records<\/button>\n<\/aside>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { tab: 'active', sel: 'PRJ-2026-004', seg: 'close', asked: {} }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const tab = st.tab || 'active', sel = st.sel || 'PRJ-2026-004', seg = st.seg || 'close', asked = st.asked || {};\n    const PH = { Initiation: ['#EEF0F3', '#3F4146'], Delivery: ['#E2F1EA', '#005F4F'], Closing: ['#FAE3BE', '#63420F'], Closed: ['#EEF0F3', '#3F4146'] };\n    const GROUP = { Initiation: 'active', Delivery: 'active', Closing: 'closing', Closed: 'closed' };\n    const r = (code, name, div, pm, phase, docs, done, total, end, x) => ({ code, name, div, pm, phase, docs, done, total, end, ...x, del: done + ' / ' + total, w: Math.round(done / total * 100) + '%', phBg: PH[phase][0], phFg: PH[phase][1] });\n    const c = (label, ok, note) => ({ label, note, mark: ok ? '✓' : '·', bg: ok ? '#269D6A' : '#E5E2CB', fg: ok ? '#FFFFFF' : '#003234' });\n    const all = [\n      r('PRJ-2026-004', 'DAS implementation', 'IT · Director Support Services', 'Abeer A.', 'Delivery', '212', 14, 22, '2027-02-28', { fileCode: 'SS-IT-PJ-004', sponsor: 'Director Support Services', series: 'IT-RE-15 · IT projects', phaseLine: 'Delivery · ends 28 Feb 2027', drafts: 6, reconciled: true, erp: false, team: [['Abeer A.', 'Project manager'], ['Director Support Services', 'Sponsor'], ['Mona S.', 'Records coordinator'], ['K. Al Mazrouei', 'Information owner']] }),\n      r('PRJ-2025-011', 'ERP upgrade · Fusion 24C', 'FN · CFO', 'Omar R.', 'Closing', '388', 30, 31, '2026-12-15', { fileCode: 'SS-FN-PJ-011', sponsor: 'CFO', series: 'FN-RE-08 · Finance projects', phaseLine: 'Closing out · ends 15 Dec 2026', drafts: 1, reconciled: true, erp: false, team: [['Omar R.', 'Project manager'], ['CFO', 'Sponsor'], ['Mona S.', 'Records coordinator'], ['Oracle partner', 'Vendor']] }),\n      r('PRJ-2026-002', 'Pension portal redesign', 'IT · Director Customer Experience', 'Sara H.', 'Initiation', '41', 1, 12, '2027-09-30', { fileCode: 'SS-IT-PJ-002', sponsor: 'Director Customer Experience', series: 'IT-RE-15 · IT projects', phaseLine: 'Initiation · ends 30 Sep 2027', drafts: 3, reconciled: false, erp: false, team: [['Sara H.', 'Project manager'], ['Director Customer Experience', 'Sponsor'], ['Mona S.', 'Records coordinator']] }),\n      r('PRJ-2026-001', 'HQ relocation — records move', 'HR · Director Support Services', 'Fatima K.', 'Delivery', '64', 5, 9, '2027-04-01', { fileCode: 'SS-HR-PJ-001', sponsor: 'Director Support Services', series: 'HR-RE-12 · Facilities projects', phaseLine: 'Delivery · ends 1 Apr 2027', drafts: 2, reconciled: true, erp: false, team: [['Fatima K.', 'Project manager'], ['Director Support Services', 'Sponsor'], ['Records & Archives', 'Custodian']] }),\n      r('PRJ-2024-007', 'Investment reporting automation', 'FN · CFO', 'Ahmed B.', 'Closed', '37', 8, 8, '2026-03-31', { fileCode: 'SS-FN-PJ-007', sponsor: 'CFO', series: 'FN-RE-08 · Finance projects', phaseLine: 'Closed · 31 Mar 2026', drafts: 0, reconciled: true, erp: true, team: [['Ahmed B.', 'Project manager'], ['CFO', 'Sponsor']] }),\n    ];\n    const p = all.find(x => x.code === sel) || all[0];\n    const closed = p.phase === 'Closed';\n    const tabIds = [['active', 'Active · 3'], ['closing', 'Closing out · 1'], ['closed', 'Closed · 1']];\n    const rows = all.filter(x => GROUP[x.phase] === tab).map(x => ({ ...x, bg: x.code === p.code ? '#F4FAF7' : '#FFFFFF', pressed: x.code === p.code ? 'true' : 'false', pick: () => this.setState({ sel: x.code }) }));\n    const segIds = [['register', 'Register'], ['team', 'Team'], ['close', 'Close-out']];\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      onNew: () => this.say('New project draft PRJ-2026-005 created · add a sponsor to continue'),\n      onSignoff: () => { if (closed) { this.say(p.name + ' is already signed off'); return; } this.setState({ asked: { ...asked, [p.code]: true } }); this.say('Sign-off request sent to ' + p.sponsor); },\n      tabs: tabIds.map(([id, label]) => ({ label, sel: tab === id ? 'true' : 'false', line: tab === id ? '#269D6A' : 'transparent', weight: tab === id ? 700 : 400, fg: tab === id ? '#003234' : '#3D5F60', pick: () => this.setState({ tab: id }) })),\n      segs: segIds.map(([id, label]) => ({ label, sel: seg === id ? 'true' : 'false', bg: seg === id ? '#FFFFFF' : 'transparent', fg: seg === id ? '#003234' : '#3D5F60', weight: seg === id ? 700 : 400, pick: () => this.setState({ seg: id }) })),\n      showRegister: seg === 'register', showTeam: seg === 'team', showClose: seg === 'close',\n      kpis: [\n        { label: 'Active projects', n: '3', sub: 'In initiation or delivery', icon: 'project', tone: 'default', href: '' },\n        { label: 'Closing within 60 d', n: '1', sub: 'ERP upgrade · ends 15 Dec 2026', icon: 'calendar', tone: 'default', href: '' },\n        { label: 'Documents', n: '742', sub: 'Filed across 5 project files', icon: 'doc', tone: 'default', href: '' },\n        { label: 'Open deliverables', n: '19', sub: 'Awaiting acceptance', icon: 'tasks', tone: 'default', href: '' },\n        { label: 'Closed this year', n: '1', sub: 'Investment reporting · 31 Mar 2026', icon: 'archive', tone: 'default', href: '' },\n      ],\n      rows, noRows: rows.length === 0, emptyText: 'No projects in this phase',\n      p,\n      register: [{ k: 'Documents filed', v: p.docs }, { k: 'Deliverables accepted', v: p.del }, { k: 'Drafts open', v: String(p.drafts) }, { k: 'File code', v: p.fileCode }],\n      team: p.team.map(([who, role]) => ({ who, role })),\n      checks: [c('All deliverables accepted', p.done === p.total, p.done + ' / ' + p.total), c('No drafts left', p.drafts === 0, p.drafts ? p.drafts + ' drafts' : ''), c('Register reconciled', p.reconciled, ''), c('ERP project closed', p.erp, p.erp ? '' : 'Open'), c('Sponsor sign-off', closed || !!asked[p.code], closed ? 'Signed' : (asked[p.code] ? 'Requested' : 'Not requested'))],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1000}}});
</script>
</body>
</html>
