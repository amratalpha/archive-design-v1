<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقارير ولوحات المعلومات · DAS prototype</title>
<style>body{margin:0}</style>
<script src="das-runtime.js"></script>
<script src="components.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script>
DCRun(window.DAS_COMPONENTS, {"name": "ReportsAr", "template": "\n<helmet>\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div dir=\"rtl\" style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Neue Frutiger World','Segoe UI',system-ui,sans-serif; font-size: 14px; line-height: 1.6\">\n<dc-import name=\"Sidebar\" active=\"reports\" lang=\"ar\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"Reports\" crumb=\"التقارير\" lang=\"ar\" persona=\"rashed\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div><div style=\"font-size: 13px; color: #4A6B6C\">التقارير ولوحات المعلومات · للقراءة فقط · مقيّدة بالصلاحيات<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 32px\">التقارير ولوحات المعلومات<\/h1><\/div>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n<label for=\"rpa-period\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">الفترة<\/label>\n<select id=\"rpa-period\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; background: #FFFFFF; color: #003234\"><option>آخر 30 يوماً<\/option><option>آخر 90 يوماً<\/option><option>آخر 365 يوماً<\/option><\/select>\n<label for=\"rpa-div\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">الإدارة<\/label>\n<select id=\"rpa-div\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; background: #FFFFFF; color: #003234\"><option>كل الإدارات<\/option><option>IT · تقنية المعلومات<\/option><\/select>\n<button type=\"button\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{onExport}}\">تصدير لوحة المعلومات (CSV)<\/button>\n<\/div>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n<sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"5\">\n<dc-import name=\"StatTile\" label=\"{{k.label}}\" value=\"{{k.n}}\" sub=\"{{k.sub}}\" icon=\"{{k.icon}}\" tone=\"{{k.tone}}\" href=\"{{k.href}}\" lang=\"ar\" hint-size=\"100%,146px\"><\/dc-import>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px\">\n<section aria-labelledby=\"c1a\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><h2 id=\"c1a\" style=\"margin: 0; font-size: 15px; font-weight: 700\">الوثائق المعلنة كسجلات · 12 شهراً<\/h2><button type=\"button\" style=\"height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid #DCE3E0; background: #FFFFFF; color: #005F4F; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer\" aria-expanded=\"{{tableExpanded}}\" onClick=\"{{onToggleTable}}\">{{tableLabel}}<\/button><\/div>\n<div role=\"img\" aria-label=\"مخطط أعمدة للوثائق المعلنة كسجلات شهرياً، من ديسمبر 2025 إلى نوفمبر 2026، بذروة 2,940 في سبتمبر\" style=\"display: flex; align-items: flex-end; gap: 2px; height: 180px; border-bottom: 1px solid #CCC9B4; padding-top: 10px\">\n<sc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\">\n<div title=\"{{m.label}} · {{m.n}}\" style=\"flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%\"><div style=\"width: 60%; height: {{m.h}}; background: {{m.c}}; border-radius: 4px 4px 0 0\"><\/div><\/div>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; gap: 2px; font-size: 11px; color: #4A6B6C\"><sc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\"><span style=\"flex: 1; text-align: center\">{{m.short}}<\/span><\/sc-for><\/div>\n<sc-if value=\"{{showTable}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"overflow-x: auto\"><table style=\"width: 100%; border-collapse: collapse; font-size: 12px\">\n<caption style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">الوثائق المعلنة كسجلات شهرياً<\/caption>\n<thead><tr style=\"color: #4A6B6C\"><th scope=\"row\" style=\"text-align: start; padding: 6px 8px; border-bottom: 1px solid #E5E2CB\">الشهر<\/th><sc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\"><th scope=\"col\" style=\"padding: 6px 4px; border-bottom: 1px solid #E5E2CB; text-align: end; white-space: nowrap; font-weight: 400\">{{m.label}}<\/th><\/sc-for><\/tr><\/thead>\n<tbody><tr><th scope=\"row\" style=\"text-align: start; padding: 6px 8px\">المعلنة<\/th><sc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\"><td style=\"padding: 6px 4px; text-align: end; font-weight: 700\">{{m.n}}<\/td><\/sc-for><\/tr><\/tbody>\n<\/table><\/div>\n<\/sc-if>\n<\/section>\n\n<section aria-labelledby=\"c2a\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<h2 id=\"c2a\" style=\"margin: 0; font-size: 15px; font-weight: 700\">الالتقاط حسب القناة<\/h2>\n<sc-for list=\"{{channels}}\" as=\"c\" hint-placeholder-count=\"5\">\n<div title=\"{{c.name}} · {{c.n}}\" style=\"display: grid; grid-template-columns: 110px 1fr 64px; gap: 10px; align-items: center; font-size: 13px\"><span>{{c.name}}<\/span><span style=\"height: 12px; border-radius: 4px 0 0 4px; background: #E5E2CB; overflow: hidden\"><span style=\"display: block; height: 100%; width: {{c.w}}; background: #269D6A; border-radius: 4px 0 0 4px\"><\/span><\/span><span style=\"text-align: end; font-weight: 700\">{{c.n}}<\/span><\/div>\n<\/sc-for>\n<\/section>\n\n<section aria-labelledby=\"c3a\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><h2 id=\"c3a\" style=\"margin: 0; font-size: 15px; font-weight: 700\">دورة الاعتماد مقابل مستوى الخدمة · ساعات<\/h2><span style=\"display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: #4A6B6C\"><span style=\"width: 2px; height: 14px; background: #003234\"><\/span>مستوى الخدمة<\/span><\/div>\n<sc-for list=\"{{cycles}}\" as=\"c\" hint-placeholder-count=\"4\">\n<div title=\"{{c.name}} · الوسيط {{c.v}} س، مستوى الخدمة {{c.sla}} س\" style=\"display: grid; grid-template-columns: 140px 1fr 80px; gap: 10px; align-items: center; font-size: 13px\"><span>{{c.name}}<\/span><span style=\"position: relative; height: 12px; border-radius: 4px 0 0 4px; background: #E5E2CB\"><span style=\"display: block; height: 100%; width: {{c.w}}; background: {{c.color}}; border-radius: 4px 0 0 4px\"><\/span><span style=\"position: absolute; top: -4px; bottom: -4px; inset-inline-start: {{c.slaPos}}; width: 2px; background: #003234\"><\/span><\/span><span style=\"text-align: end\"><strong>{{c.v}}<\/strong> / {{c.sla}}<\/span><\/div>\n<\/sc-for>\n<span style=\"font-size: 12px; color: #9A1800\">يتجاوز الإتلاف مستوى الخدمة بـ 24 ساعة: تنتظر أصوات اللجنة اكتمال النصاب.<\/span>\n<\/section>\n\n<section aria-labelledby=\"c4a\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\"><h2 id=\"c4a\" style=\"margin: 0; font-size: 15px; font-weight: 700\">بوابات الاستبقاء · الأشهر الستة القادمة<\/h2>\n<span style=\"display: flex; gap: 14px; font-size: 12px; color: #4A6B6C\"><span style=\"display: inline-flex; gap: 6px; align-items: center\"><span style=\"width: 10px; height: 10px; border-radius: 2px; background: #269D6A\"><\/span>البوابة 1 ← مركز الأرشيف<\/span><span style=\"display: inline-flex; gap: 6px; align-items: center\"><span style=\"width: 10px; height: 10px; border-radius: 2px; background: #00453F\"><\/span>البوابة 2 ← الإتلاف<\/span><\/span><\/div>\n<div role=\"img\" aria-label=\"أعمدة مجمّعة لبوابات الاستبقاء المستحقة شهرياً، من ديسمبر إلى مايو\" style=\"display: flex; align-items: flex-end; gap: 16px; height: 160px; border-bottom: 1px solid #CCC9B4\">\n<sc-for list=\"{{gates}}\" as=\"g\" hint-placeholder-count=\"6\">\n<div title=\"{{g.m}} · البوابة 1 {{g.a}}، البوابة 2 {{g.b}}\" style=\"flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2px; height: 100%\"><div style=\"width: 34%; height: {{g.ha}}; background: #269D6A; border-radius: 4px 4px 0 0\"><\/div><div style=\"width: 34%; height: {{g.hb}}; background: #00453F; border-radius: 4px 4px 0 0\"><\/div><\/div>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; gap: 16px; font-size: 11px; color: #4A6B6C\"><sc-for list=\"{{gates}}\" as=\"g\" hint-placeholder-count=\"6\"><span style=\"flex: 1; text-align: center\">{{g.m}}<\/span><\/sc-for><\/div>\n<\/section>\n<\/div>\n\n<section aria-labelledby=\"stda-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<h2 id=\"stda-h\" style=\"margin: 0; padding: 16px 20px; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px; border-bottom: 1px solid #E5E2CB\">التقارير القياسية<\/h2>\n<div style=\"overflow-x: auto\"><table style=\"width: 100%; border-collapse: collapse; min-width: 700px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\"><th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">التقرير<\/th><th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">النطاق<\/th><th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">الصيغة<\/th><th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">آخر تشغيل<\/th><th scope=\"col\" style=\"text-align: end; padding: 10px 20px 10px 8px; border-bottom: 1px solid #E5E2CB\">الإجراءات<\/th><\/tr><\/thead>\n<tbody><sc-for list=\"{{reports}}\" as=\"r\" hint-placeholder-count=\"6\"><tr><td style=\"padding: 12px 20px; border-bottom: 1px solid #F0EEE2; font-weight: 700\">{{r.name}}<\/td><td style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2\">{{r.scope}}<\/td><td style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2\">{{r.fmt}}<\/td><td style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2; color: #4A6B6C\">{{r.last}}<\/td><td style=\"padding: 12px 20px 12px 8px; border-bottom: 1px solid #F0EEE2; text-align: end; white-space: nowrap\"><button type=\"button\" onClick=\"{{r.run}}\" style=\"padding: 0; border: 0; background: transparent; font: inherit; font-weight: 700; color: #005F4F; text-decoration: underline; margin-inline-end: 14px; cursor: pointer\">تشغيل<\/button><button type=\"button\" onClick=\"{{r.exp}}\" style=\"padding: 0; border: 0; background: transparent; font: inherit; font-weight: 700; color: #005F4F; text-decoration: underline; cursor: pointer\">تصدير CSV<\/button><\/td><\/tr><\/sc-for><\/tbody>\n<\/table><\/div>\n<\/section>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { table: false, ran: {} }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const ran = st.ran || {}, table = !!st.table;\n    const T = { now: 'الآن', show: 'عرض الجدول', hide: 'إخفاء الجدول', dash: 'صُدّرت لوحة المعلومات · das-dashboard-2026-11-06.csv', run: (n) => 'بدأ تشغيل ' + n + ' · ستظهر النتائج في ملفاتي عند الجاهزية', csv: (n) => 'صُدّر ' + n + ' بصيغة CSV' };\n    const names = ['ديسمبر', 'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر'];\n    const vals = [1620, 1480, 1710, 2050, 1890, 1960, 2210, 1740, 2380, 2940, 2610, 1180];\n    const max = 3000;\n    const g = [['ديسمبر', 14, 3], ['يناير', 22, 4], ['فبراير', 9, 0], ['مارس', 31, 7], ['أبريل', 18, 2], ['مايو', 12, 5]];\n    const cyc = [['اعتماد وثيقة', 11, 16], ['المشاركة', 9, 24], ['التصنيف', 20, 24], ['الإتلاف', 168, 144]];\n    const ch = [['الترحيل', 18400], ['التكاملات', 3100], ['الماسحات الضوئية', 1400], ['صندوق البريد', 380], ['ملفاتي', 262]];\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      onExport: () => this.say(T.dash),\n      onToggleTable: () => this.setState({ table: !table }),\n      showTable: table, tableLabel: table ? T.hide : T.show, tableExpanded: table ? 'true' : 'false',\n      kpis: [\n        { label: 'المعلنة كسجلات · 30 يوماً', n: '2,610', sub: 'كل الإدارات', icon: 'archive', tone: 'default', href: 'RecordsConsoleAr.html' },\n        { label: 'مصنّفة تلقائياً', n: '94 %', sub: 'فوق حد الثقة 0.75', icon: 'check', tone: 'default', href: 'ClassificationAr.html' },\n        { label: 'وسيط دورة الاعتماد', n: '11 س', sub: 'مستوى الخدمة 16 س', icon: 'clock', tone: 'default', href: 'ApprovalsAr.html' },\n        { label: 'بوابات الاستبقاء المستحقة', n: '127', sub: 'الأشهر الستة القادمة', icon: 'hourglass', tone: 'default', href: 'DispositionAr.html' },\n        { label: 'التخزين · نشط + أرشيف', n: '8.4 TB', sub: 'SharePoint SE', icon: 'storage', tone: 'default', href: '' },\n      ],\n      months: names.map((short, i) => ({ short, label: short + (i === 0 ? ' 2025' : ' 2026'), n: vals[i].toLocaleString('en-US'), h: Math.round(vals[i] / max * 100) + '%', c: i === 11 ? '#7EA393' : '#269D6A' })),\n      channels: ch.map(([name, n]) => ({ name, n: n.toLocaleString('en-US'), w: Math.max(2, Math.round(n / 18400 * 100)) + '%' })),\n      cycles: cyc.map(([name, v, sla]) => ({ name, v, sla, w: Math.round(v / 180 * 100) + '%', slaPos: Math.round(sla / 180 * 100) + '%', color: v > sla ? '#D12101' : '#269D6A' })),\n      gates: g.map(([m, a, b]) => ({ m, a, b, ha: Math.round(a / 32 * 100) + '%', hb: Math.max(1, Math.round(b / 32 * 100)) + '%' })),\n      reports: [\n        { name: 'مراجعة الصلاحيات', scope: 'لكل إدارة', fmt: 'XLSX', last: '01 نوفمبر 2026' },\n        { name: 'شهادات الإتلاف', scope: '2026-Q3', fmt: 'PDF', last: '30 سبتمبر 2026' },\n        { name: 'مستخلص التدقيق', scope: 'نافذة SIEM', fmt: 'CSV', last: '05 نوفمبر 2026' },\n        { name: 'سجل السجلات', scope: 'صيغة الأرشيف الوطني', fmt: 'XLSX', last: '14 سبتمبر 2026' },\n        { name: 'قائمة السجلات الحيوية', scope: 'كل القطاعات', fmt: 'PDF', last: '01 أكتوبر 2026' },\n        { name: 'بوابات الاستبقاء المستحقة', scope: 'الأيام الـ 90 القادمة', fmt: 'CSV', last: '06 نوفمبر 2026' },\n      ].map(r => ({ ...r, last: ran[r.name] ? T.now : r.last,\n        run: () => { this.setState({ ran: { ...ran, [r.name]: true } }); this.say(T.run(r.name)); },\n        exp: () => this.say(T.csv(r.name)) })),\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1400}}});
</script>
</body>
</html>
