n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 760px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">عند وجود<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">الإشارة<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">يُصنَّف ضمن<\/th>\n<th scope=\"col\" style=\"text-align: end; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">الوزن<\/th>\n<th scope=\"col\" style=\"text-align: end; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">المطابقات · 30 يوماً<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 8px; border-bottom: 1px solid #E5E2CB\">الدقة<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{rules}}\" as=\"r\" hint-placeholder-count=\"5\">\n<tr>\n<td dir=\"ltr\" style=\"padding: 12px 20px; border-bottom: 1px solid #F0EEE2; font-family: Consolas, monospace; text-align: right\">{{r.when}}<\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2\"><span style=\"padding: 2px 8px; border-radius: 6px; background: #EEF0F3; color: #3F4146\">{{r.signal}}<\/span><\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2; font-weight: 700\">{{r.then}}<\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2; text-align: end\">{{r.weight}}<\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2; text-align: end\">{{r.matched}}<\/td>\n<td style=\"padding: 12px 20px 12px 8px; border-bottom: 1px solid #F0EEE2\"><span style=\"display: inline-flex; align-items: center; gap: 8px\"><span style=\"width: 70px; height: 6px; border-radius: 3px; background: #E5E2CB; overflow: hidden; display: block\"><span style=\"display: block; height: 100%; width: {{r.w}}; background: #269D6A\"><\/span><\/span>{{r.precision}}<\/span><\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<div style=\"padding: 14px 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; align-items: center\"><span style=\"font-size: 12px; color: #4A6B6C\">فحوصات الخطة: 0 عمليات يتيمة · 2 مصطلحان بلا سلسلة مرتبطة · جميع التسميات ثنائية اللغة<\/span><button type=\"button\" onClick=\"{{onAddRule}}\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">+ إضافة قاعدة<\/button><\/div>\n<\/sc-if>\n\n<sc-if value=\"{{showTerm}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 24px\">\n<sc-for list=\"{{termInfo}}\" as=\"d\" hint-placeholder-count=\"5\">\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">{{d.k}}<\/dt><dd style=\"margin: 2px 0 0; font-weight: 700\">{{d.v}}<\/dd><\/div>\n<\/sc-for>\n<\/dl>\n<span style=\"font-size: 12px; color: #4A6B6C\">تعديل التسميات والحالة يُحفظ في المسودة v13 ولا يسري إلا بعد النشر.<\/span>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{showExc}}\" hint-placeholder-val=\"{{ false }}\">\n<sc-if value=\"{{excEmpty}}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; padding: 24px 20px; color: #4A6B6C; font-size: 13px\">لا توجد استثناءات مفتوحة · جميع الوثائق صُنّفت<\/p>\n<\/sc-if>\n<sc-if value=\"{{excAny}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 760px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">الوثيقة<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">التصنيف المقترح<\/th>\n<th scope=\"col\" style=\"text-align: end; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">الثقة<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 8px; border-bottom: 1px solid #E5E2CB\">الإجراءات<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{exceptions}}\" as=\"x\" hint-placeholder-count=\"6\">\n<tr>\n<td style=\"padding: 12px 20px; border-bottom: 1px solid #F0EEE2\"><a href=\"DocumentAr.html\" style=\"font-weight: 700\">{{x.title}}<\/a><div dir=\"ltr\" style=\"font-family: Consolas, monospace; font-size: 12px; color: #4A6B6C\">{{x.code}}<\/div><\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2\">{{x.proposed}}<\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2; text-align: end; font-weight: 700; color: #63420F\">{{x.conf}}<\/td>\n<td style=\"padding: 12px 20px 12px 8px; border-bottom: 1px solid #F0EEE2\"><span style=\"display: inline-flex; gap: 8px\"><button type=\"button\" onClick=\"{{x.accept}}\" style=\"height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">قبول<\/button><button type=\"button\" onClick=\"{{x.recl}}\" style=\"height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">إعادة تصنيف<\/button><\/span><\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<\/sc-if>\n<\/sc-if>\n\n<sc-if value=\"{{showMap}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 640px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">العملية<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">سلسلة السجلات<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 8px; border-bottom: 1px solid #E5E2CB\">الحالة<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{map}}\" as=\"m\" hint-placeholder-count=\"6\">\n<tr>\n<td style=\"padding: 12px 20px; border-bottom: 1px solid #F0EEE2\"><strong>{{m.proc}}<\/strong><\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2\">{{m.series}}<\/td>\n<td style=\"padding: 12px 20px 12px 8px; border-bottom: 1px solid #F0EEE2; font-weight: 700; color: {{m.fg}}\">{{m.state}}<\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<\/sc-if>\n<\/section>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    this.state = { tab: 'rules', sel: 2, drafts: 0, exc: [\n        { code: 'SS-IT-CR-118', title: 'تجديد صيانة البرمجيات 2026', proposed: 'FN-12 · العقود', conf: '0.71' },\n        { code: 'SS-IT-CO-0871', title: 'خطاب إلى المورد بشأن غرامات اتفاقية الخدمة', proposed: 'IT-RE-10 · سجل عقود تقنية المعلومات', conf: '0.68' },\n        { code: 'SS-IT-ME-207', title: 'محضر مجلس استشارات التغيير — سبتمبر', proposed: 'IT-RE-8 · مجلس استشارات التغيير', conf: '0.73' },\n        { code: 'SS-PG-TN-0412', title: 'استيضاح مناقصة RFP 22/2026', proposed: 'FN-11 · المناقصات', conf: '0.74' },\n        { code: 'SS-IT
