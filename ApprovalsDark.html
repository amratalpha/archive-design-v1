<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approvals inbox (dark) · DAS prototype</title>
<style>body{margin:0}</style>
<script src="das-runtime.js"></script>
<script src="components.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script>
DCRun(window.DAS_COMPONENTS, {"name": "ApprovalsDark", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #003234; color: #FFFFFF; font-family: 'Roboto',system-ui,sans-serif; font-size: 14px; line-height: 1.45\">\n<dc-import name=\"SidebarDark\" active=\"approvals\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"TopbarDark\" page=\"Approvals\" crumb=\"Approvals\" persona=\"khalid\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div>\n<div style=\"font-size: 13px; color: #BFD0CC\">Workflow · K2 · decisions recorded in K2 and the audit warehouse<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 32px\">Approvals<\/h1>\n<\/div>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<a href=\"DelegationDark.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #4F8A7E; background: #00453F; color: #FFFFFF; font-weight: 700; display: inline-flex; align-items: center; text-decoration: none\">Set out-of-office delegate<\/a>\n<button type=\"button\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #67BA97; color: #003234; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{onApprove}}\">Approve selected ({{selCount}})<\/button>\n<\/div>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n<sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"5\">\n<dc-import name=\"StatTileDark\" label=\"{{k.label}}\" value=\"{{k.n}}\" sub=\"{{k.sub}}\" icon=\"{{k.icon}}\" tone=\"{{k.tone}}\" href=\"{{k.href}}\" hint-size=\"100%,146px\"><\/dc-import>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between\">\n<div role=\"tablist\" aria-label=\"Task lists\" style=\"display: inline-flex; background: #003234; border-radius: 10px; padding: 4px; gap: 4px\">\n<sc-for list=\"{{tabs}}\" as=\"tb\" hint-placeholder-count=\"3\">\n<button type=\"button\" role=\"tab\" aria-selected=\"{{tb.sel}}\" onClick=\"{{tb.pick}}\" style=\"height: 38px; padding: 0 16px; border-radius: 8px; border: 0; background: {{tb.bg}}; color: {{tb.fg}}; font: inherit; font-weight: {{tb.weight}}; box-shadow: {{tb.shadow}}; cursor: pointer\">{{tb.label}}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<label for=\"ap-filter\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Filter tasks<\/label>\n<input id=\"ap-filter\" placeholder=\"Filter by code, title or requester…\" style=\"height: 42px; width: 300px; max-width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid #2E6E64; padding: 0 14px; font: inherit; background: #00453F; color: #FFFFFF\">\n<label for=\"ap-type\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Workflow type<\/label>\n<select id=\"ap-type\" style=\"height: 42px; border-radius: 10px; border: 1px solid #2E6E64; padding: 0 12px; font: inherit; background: #00453F; color: #FFFFFF\"><option>All workflow types<\/option><option>Document approval<\/option><option>External sharing request<\/option><option>Disposition approval<\/option><\/select>\n<label for=\"ap-pri\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Priority<\/label>\n<select id=\"ap-pri\" style=\"height: 42px; border-radius: 10px; border: 1px solid #2E6E64; padding: 0 12px; font: inherit; background: #00453F; color: #FFFFFF\"><option>Any priority<\/option><option>High<\/option><option>Normal<\/option><option>Low<\/option><\/select>\n<\/div>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<div style=\"flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<sc-if value=\"{{showMine}}\" hint-placeholder-val=\"{{ true }}\">\n<sc-for list=\"{{tasks}}\" as=\"t\" hint-placeholder-count=\"6\">\n<article style=\"background: #00453F; border-radius: 12px; border: {{t.border}}; padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start\">\n<input type=\"checkbox\" aria-label=\"Select {{t.id}}\" checked=\"{{t.checked}}\" onChange=\"{{t.toggle}}\" style=\"width: 18px; height: 18px; margin-top: 3px; accent-color: #7DC4A6; cursor: pointer\">\n<div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px\">\n<span style=\"font-weight: 700; font-size: 14px; margin-inline-end: 4px\">{{t.action}}<\/span>\n<span style=\"padding: 2px 8px; border-radius: 6px; background: #1F5A54; color: #D9DAE3\">{{t.type}}<\/span>\n<span style=\"padding: 2px 8px; border-radius: 6px; font-weight: 700; background: {{t.pBg}}; color: {{t.pFg}}\">{{t.priority}}<\/span>\n<span style=\"padding: 2px 8px; border-radius: 999px; font-weight: 700; background: {{t.lBg}}; color: {{t.lFg}}\">{{t.level}}<\/span>\n<sc-if value=\"{{t.hasTag}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding: 2px 8px; border-radius: 6px; border: 1px solid #CE9842; color: #F3BF6D\">{{t.tag}}<\/span><\/sc-if>\n<\/div>\n<a href=\"TaskDark.html\" style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 16px; color: #FFFFFF; text-decoration: none\">{{t.title}}<\/a>\n<div style=\"font-size: 13px; color: #BFD0CC\"><span style=\"font-family: 'Roboto Mono',Consolas,monospace\">{{t.id}} · {{t.code}}<\/span> · {{t.who}} · {{t.mode}}<\/div>\n<\/div>\n<div style=\"flex: 0 0 120px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px\">\n<span style=\"font-weight: 700; color: {{t.slaFg}}\">{{t.sla}}<\/span>\n<span style=\"width: 100px; height: 5px; border-radius: 3px; background: #005F4F; overflow: hidden; display: block\"><span style=\"display: block; height: 100%; width: {{t.slaW}}; background: {{t.slaBar}}\"><\/span><\/span>\n<span style=\"font-size: 12px; color: #BFD0CC\">Step {{t.stage}}<\/span>\n<\/div>\n<\/article>\n<\/sc-for>\n<\/sc-if>\n<sc-if value=\"{{showOther}}\" hint-placeholder-val=\"{{ false }}\">\n<sc-for list=\"{{others}}\" as=\"o\" hint-placeholder-count=\"3\">\n<article style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 14px 18px; display: flex; gap: 14px; align-items: center\">\n<div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n<a href=\"TaskDark.html\" style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 16px; color: #FFFFFF; text-decoration: none\">{{o.title}}<\/a>\n<div style=\"font-size: 13px; color: #BFD0CC\"><span style=\"font-family: 'Roboto Mono',Consolas,monospace\">{{o.id}} · {{o.code}}<\/span> · {{o.note}}<\/div>\n<\/div>\n<span style=\"padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: {{o.bg}}; color: {{o.fg}}; white-space: nowrap\">{{o.status}}<\/span>\n<\/article>\n<\/sc-for>\n<div style=\"font-size: 13px; color: #BFD0CC; padding: 4px 2px\">{{otherNote}}<\/div>\n<\/sc-if>\n<sc-if value=\"{{mineEmpty}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background: #00453F; border-radius: 12px; border: 1px dashed #2E6E64; padding: 28px 18px; text-align: center; color: #BFD0CC\">{{emptyText}}<\/div>\n<\/sc-if>\n<\/div>\n\n<aside aria-labelledby=\"pv-h\" style=\"flex: 2 1 340px; min-width: 0; background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n<div><div style=\"font-size: 12px; color: #BFD0CC\">Task preview · K2-88213 · Document approval<\/div>\n<h2 id=\"pv-h\" style=\"margin: 4px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 20px\">Information Security Policy — Issue 4<\/h2><\/div>\n<div style=\"height: 200px; border-radius: 10px; background: #003234; border: 1px solid #005F4F; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 20px 28px; box-sizing: border-box\">\n<span style=\"height: 10px; width: 50%; background: #2E6E64; border-radius: 3px\"><\/span><span style=\"height: 6px; width: 90%; background: #005F4F; border-radius: 3px\"><\/span><span style=\"height: 6px; width: 84%; background: #005F4F; border-radius: 3px\"><\/span><span style=\"height: 6px; width: 88%; background: #005F4F; border-radius: 3px\"><\/span><span style=\"height: 6px; width: 60%; background: #005F4F; border-radius: 3px\"><\/span>\n<span style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transform: rotate(-18deg); color: rgba(255,255,255,.16); font-size: 22px; font-weight: 700\">Abeer A. · Sensitive · preview<\/span>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-weight: 700\">Route progress<\/span>\n<sc-for list=\"{{route}}\" as=\"r\" hint-placeholder-count=\"3\">\n<div style=\"display: flex; gap: 10px; align-items: center\"><span style=\"width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: {{r.bg}}; color: {{r.fg}}\">{{r.n}}<\/span><span style=\"flex: 1\">{{r.who}}<\/span><span style=\"font-size: 12px; color: #BFD0CC\">{{r.when}}<\/span><\/div>\n<\/sc-for>\n<\/div>\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; background: #003B3C; border-radius: 10px; padding: 14px\">\n<div><div style=\"color: #BFD0CC; font-size: 12px\">Series<\/div>IT-RE-12<\/div>\n<div><div style=\"color: #BFD0CC; font-size: 12px\">Confidentiality<\/div>Sensitive<\/div>\n<div><div style=\"color: #BFD0CC; font-size: 12px\">Function › activity › process<\/div>Support services › IT › Policy<\/div>\n<div><div style=\"color: #BFD0CC; font-size: 12px\">OCR quality<\/div>Good · 0.97<\/div>\n<\/div>\n<a href=\"TaskDark.html\" style=\"height: 44px; border-radius: 10px; background: #67BA97; color: #003234; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none\">Open and decide<\/a>\n<\/aside>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #005F4F; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { tab: 'mine', sel: { 'K2-88213': true, 'K2-88240': true }, gone: {}, approved: [] }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const P = { High: ['#4F1A10', '#F09A8A'], Normal: ['#1F5A54', '#D9DAE3'], Low: ['#094C41', '#7DC4A6'] };\n    const L = { Open: ['#094C41', '#7DC4A6'], Sensitive: ['#4A3A17', '#F3BF6D'], Confidential: ['#4D2512', '#F4935E'], Secret: ['#4F1A10', '#F09A8A'] };\n    const S = { ok: ['#7DC4A6', '#269D6A'], warn: ['#F3BF6D', '#CE9842'], err: ['#F09A8A', '#D12101'] };\n    const t = (id, action, type, code, title, who, level, priority, mode, stage, sla, st, w, tag, sel) => ({\n      id, action, type, code, title, who, level, priority, mode, stage, sla, slaW: w, tag: tag || '', hasTag: !!tag, checked: !!sel,\n      lBg: L[level][0], lFg: L[level][1], pBg: P[priority][0], pFg: P[priority][1], slaFg: S[st][0], slaBar: S[st][1],\n      border: sel ? '2px solid #269D6A' : '1px solid #005F4F' });\n    const TASKS = [\n        t('K2-88213', 'Approve document', 'Document approval', 'SS-IT-PY-02-R4', 'Information Security Policy — Issue 4', 'Abeer A. · IT · submitted 28 Sep', 'Sensitive', 'High', 'Serial', '1 / 2', '3h 40m', 'err', '86%', '', true),\n        t('K2-88240', 'Approve contract', 'Document approval', 'SS-IT-CR-118', 'Contract renewal — network maintenance · AED 720,000', 'S. Hassan · IT · submitted 27 Sep', 'Confidential', 'Normal', 'Parallel · all', '1 / 4', '1d 6h', 'warn', '55%', '', true),\n        t('K2-88251', 'Approve external share', 'External sharing request', 'SS-IT-RE-041', 'External sharing · Vendor X · expires 15 Oct', 'Sara H. · IT', 'Open', 'Normal', 'Serial', '2 / 2', '2d 4h', 'ok', '30%', 'Delegated to Khalid S.'),\n        t('K2-88260', 'Confirm classification', 'Classification exception', 'Drop-off #4471', 'Scanned letter · no routing rule matched · confidence 0.61', 'Scanner SS-02', 'Sensitive', 'Normal', 'Serial', '1 / 2', '20h 10m', 'warn', '60%'),\n        t('K2-88102', 'Cast disposition vote', 'Disposition approval', 'IT-RE-7', '2026-Q3 · Helpdesk tickets 2016 · 184 items', 'Records & Archives · vote 2 / 5', 'Open', 'Low', 'Parallel · any one', '2 / 5', '5d 2h', 'ok', '18%'),\n        t('K2-87990', 'Sign legal hold release', 'Legal hold release', 'LH-2025-03', 'Case 118/2025 · vendor dispute · 2,410 items', 'Noura K. · Legal', 'Confidential', 'High', 'Serial', '2 / 2', '-6h 12m', 'err', '100%', 'Escalated'),\n    ];\n    const st = this.state;\n    const all = TASKS.filter(x => !st.gone[x.id]).map(x => ({ ...x, checked: !!st.sel[x.id], border: st.sel[x.id] ? '2px solid #269D6A' : '1px solid #005F4F',\n      toggle: () => this.setState({ sel: { ...this.state.sel, [x.id]: !this.state.sel[x.id] } }) }));\n    const selIds = all.filter(x => st.sel[x.id]).map(x => x.id);\n    const OK = ['#094C41', '#7DC4A6'], WAIT = ['#1F5A54', '#D9DAE3'], RET = ['#4A3A17', '#F3BF6D'];\n    const o = (id, code, title, note, status, c) => ({ id, code, title, note, status, bg: c[0], fg: c[1] });\n    const waiting = [\n      o('K2-88175', 'SS-IT-PY-07', 'Acceptable Use Policy — Issue 2', 'You approved 2 Oct · now with the information owner', 'Step 2 / 2', WAIT),\n      o('K2-88190', 'SS-IT-CR-097', 'Data centre hosting agreement · amendment 1', 'You approved 30 Sep · now with Legal & Legislation', 'Step 3 / 4', WAIT),\n      o('K2-88201', 'SS-IT-ME-207', 'CAB meeting minutes — September', 'You approved 29 Sep · now with the records officer', 'Step 2 / 3', WAIT),\n    ];\n    const done = st.approved.map(x => o(x.id, x.code, x.title, 'Approved just now', 'Approved', OK)).concat([\n      o('K2-88120', 'SS-IT-CO-0871', 'Incoming — Emirates Data Centre · SLA commitments', 'Decided 27 Sep · filed and declared', 'Approved', OK),\n      o('K2-88094', 'SS-IT-RE-039', 'External sharing · Vendor Y', 'Decided 24 Sep · returned to Sara H.', 'Returned', RET),\n      o('K2-88061', 'SS-IT-ME-198', 'CAB meeting minutes — August', 'Decided 18 Sep · filed and declared', 'Approved', OK),\n    ]);\n    const doneN = 41 + st.approved.length;\n    const ids = [['mine', 'Mine' + ' · ' + all.length], ['waiting', 'Waiting on others' + ' · 5'], ['done', 'Completed' + ' · ' + doneN]];\n    const tab = st.tab;\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      tabs: ids.map(([id, label]) => ({ label, sel: tab === id ? 'true' : 'false', bg: tab === id ? '#00453F' : 'transparent', fg: tab === id ? '#FFFFFF' : '#BFD0CC', weight: tab === id ? 700 : 400, shadow: tab === id ? '0 1px 2px rgba(0,50,52,.14)' : 'none', pick: () => this.setState({ tab: id }) })),\n      showMine: tab === 'mine' && all.length > 0, mineEmpty: tab === 'mine' && all.length === 0, emptyText: 'Inbox clear — no tasks are waiting on you',\n      showOther: tab !== 'mine', others: tab === 'waiting' ? waiting : done,\n      otherNote: tab === 'waiting' ? 'Showing the 3 most recent of {n} · the route continues with the next approver'.replace('{n}', '5') : 'Showing the most recent {k} of {n} decisions in the last 30 days'.replace('{k}', String(done.length)).replace('{n}', String(doneN)),\n      selCount: String(selIds.length),\n      onApprove: () => {\n        if (!selIds.length) { this.say('Select at least one task first'); return; }\n        const picked = all.filter(x => this.state.sel[x.id]);\n        const gone = { ...this.state.gone }; picked.forEach(x => { gone[x.id] = true; });\n        this.setState({ gone, sel: {}, approved: picked.map(x => ({ id: x.id, code: x.code, title: x.title })).concat(this.state.approved) });\n        this.say(picked.length === 1 ? '1 task approved · decision sent to K2' : '{n} tasks approved · decisions sent to K2'.replace('{n}', String(picked.length)));\n      },\n      kpis: [\n        { label: 'Awaiting my approval', n: String(all.length), sub: selIds.length + ' selected', icon: 'tasks', tone: 'default', href: '' },\n        { label: 'SLA breached', n: '1', sub: 'Escalated to Sector Director', icon: 'alert', tone: 'alert', href: '' },\n        { label: 'Due today', n: '2', sub: 'Under 24 h', icon: 'clock', tone: 'warn', href: '' },\n        { label: 'Waiting on others', n: '5', sub: 'You approved, route continues', icon: 'hourglass', tone: 'default', href: '' },\n        { label: 'Decided · 7 d', n: String(23 + st.approved.length), sub: 'Median 9 h', icon: 'check', tone: 'default', href: '' },\n      ],\n      tasks: all,\n      route: [\n        { n: '1', who: 'Head of IT · Khalid Al Mazrouei', when: 'In progress', bg: '#269D6A', fg: '#FFFFFF' },\n        { n: '2', who: 'Information owner', when: 'Next', bg: '#005F4F', fg: '#FFFFFF' },\n        { n: '✓', who: 'Code · file · declare', when: 'On approve', bg: '#005F4F', fg: '#FFFFFF' },\n      ],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1100}}});
</script>
</body>
</html>
