DCRun(window.DAS_COMPONENTS, {"name": "ApprovalsAr", "template": "\n<helmet>\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div dir=\"rtl\" style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Neue Frutiger World','Segoe UI',system-ui,sans-serif; font-size: 14px; line-height: 1.6\">\n<dc-import name=\"Sidebar\" active=\"approvals\" lang=\"ar\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"Approvals\" crumb=\"الموافقات\" lang=\"ar\" persona=\"khalid\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div>\n<div style=\"font-size: 13px; color: #4A6B6C\">سير العمل · K2 · تُسجَّل القرارات في K2 ومستودع التدقيق<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 32px\">الموافقات<\/h1>\n<\/div>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<a href=\"DelegationAr.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font-weight: 700; display: inline-flex; align-items: center; text-decoration: none\">تعيين مفوَّض أثناء الغياب<\/a>\n<button type=\"button\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{onApprove}}\">اعتماد المحدد ({{selCount}})<\/button>\n<\/div>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n<sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"5\">\n<dc-import name=\"StatTile\" label=\"{{k.label}}\" value=\"{{k.n}}\" sub=\"{{k.sub}}\" icon=\"{{k.icon}}\" tone=\"{{k.tone}}\" href=\"{{k.href}}\" lang=\"ar\" hint-size=\"100%,146px\"><\/dc-import>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between\">\n<div role=\"tablist\" aria-label=\"قوائم المهام\" style=\"display: inline-flex; background: #E9E7D8; border-radius: 10px; padding: 4px; gap: 4px\">\n<sc-for list=\"{{tabs}}\" as=\"tb\" hint-placeholder-count=\"3\">\n<button type=\"button\" role=\"tab\" aria-selected=\"{{tb.sel}}\" onClick=\"{{tb.pick}}\" style=\"height: 38px; padding: 0 16px; border-radius: 8px; border: 0; background: {{tb.bg}}; color: {{tb.fg}}; font: inherit; font-weight: {{tb.weight}}; box-shadow: {{tb.shadow}}; cursor: pointer\">{{tb.label}}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<label for=\"apa-filter\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">تصفية المهام<\/label>\n<input id=\"apa-filter\" placeholder=\"تصفية بالرمز أو العنوان أو مقدم الطلب…\" style=\"height: 42px; width: 300px; max-width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 14px; font: inherit; background: #FFFFFF; color: #003234\">\n<label for=\"apa-type\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">نوع سير العمل<\/label>\n<select id=\"apa-type\" style=\"height: 42px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; background: #FFFFFF; color: #003234\"><option>كل أنواع سير العمل<\/option><option>اعتماد وثيقة<\/option><option>طلب مشاركة خارجية<\/option><option>اعتماد الإتلاف<\/option><\/select>\n<label for=\"apa-pri\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">الأولوية<\/label>\n<select id=\"apa-pri\" style=\"height: 42px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; background: #FFFFFF; color: #003234\"><option>أي أولوية<\/option><option>عالية<\/option><option>عادية<\/option><option>منخفضة<\/option><\/select>\n<\/div>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<div style=\"flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<sc-if value=\"{{showMine}}\" hint-placeholder-val=\"{{ true }}\">\n<sc-for list=\"{{tasks}}\" as=\"t\" hint-placeholder-count=\"6\">\n<article style=\"background: #FFFFFF; border-radius: 12px; border: {{t.border}}; padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start\">\n<input type=\"checkbox\" aria-label=\"تحديد {{t.id}}\" checked=\"{{t.checked}}\" onChange=\"{{t.toggle}}\" style=\"width: 18px; height: 18px; margin-top: 5px; accent-color: #005F4F; cursor: pointer\">\n<div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px\">\n<span style=\"font-weight: 700; font-size: 14px; margin-inline-end: 4px\">{{t.action}}<\/span>\n<span style=\"padding: 2px 8px; border-radius: 6px; background: #EEF0F3; color: #3F4146\">{{t.type}}<\/span>\n<span style=\"padding: 2px 8px; border-radius: 6px; font-weight: 700; background: {{t.pBg}}; color: {{t.pFg}}\">{{t.priority}}<\/span>\n<span style=\"padding: 2px 8px; border-radius: 999px; font-weight: 700; background: {{t.lBg}}; color: {{t.lFg}}\">{{t.level}}<\/span>\n<sc-if value=\"{{t.hasTag}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding: 2px 8px; border-radius: 6px; border: 1px solid #CE9842; color: #63420F\">{{t.tag}}<\/span><\/sc-if>\n<\/div>\n<a href=\"TaskAr.html\" style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 16px; color: #003234; text-decoration: none\">{{t.title}}<\/a>\n<div style=\"font-size: 13px; color: #4A6B6C\"><span dir=\"ltr\" style=\"font-family: Consolas, monospace\">{{t.id}} · {{t.code}}<\/span> · {{t.who}} · {{t.mode}}<\/div>\n<\/div>\n<div style=\"flex: 0 0 120px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px\">\n<span style=\"font-weight: 700; color: {{t.slaFg}}\">{{t.sla}}<\/span>\n<span style=\"width: 100px; height: 5px; border-radius: 3px; background: #E5E2CB; overflow: hidden; display: block\"><span style=\"display: block; height: 100%; width: {{t.slaW}}; background: {{t.slaBar}}\"><\/span><\/span>\n<span style=\"font-size: 12px; color: #4A6B6C\">الخطوة {{t.stage}}<\/span>\n<\/div>\n<\/article>\n<\/sc-for>\n<\/sc-if>\n<sc-if value=\"{{showOther}}\" hint-placeholder-val=\"{{ false }}\">\n<sc-for list=\"{{others}}\" as=\"o\" hint-placeholder-count=\"3\">\n<article style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 14px 18px; display: flex; gap: 14px; align-items: center\">\n<div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n<a href=\"TaskAr.html\" style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 16px; color: #003234; text-decoration: none\">{{o.title}}<\/a>\n<div style=\"font-size: 13px; color: #4A6B6C\"><span dir=\"ltr\" style=\"font-family: Consolas, monospace\">{{o.id}} · {{o.code}}<\/span> · {{o.note}}<\/div>\n<\/div>\n<span style=\"padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: {{o.bg}}; color: {{o.fg}}; white-space: nowrap\">{{o.status}}<\/span>\n<\/article>\n<\/sc-for>\n<div style=\"font-size: 13px; color: #4A6B6C; padding: 4px 2px\">{{otherNote}}<\/div>\n<\/sc-if>\n<sc-if value=\"{{mineEmpty}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px dashed #CCC9B4; padding: 28px 18px; text-align: center; color: #4A6B6C\">{{emptyText}}<\/div>\n<\/sc-if>\n<\/div>\n\n<aside aria-labelledby=\"pva-h\" style=\"flex: 2 1 340px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n<div><div style=\"font-size: 12px; color: #4A6B6C\">معاينة المهمة · <span dir=\"ltr\">K2-88213<\/span> · اعتماد وثيقة<\/div>\n<h2 id=\"pva-h\" style=\"margin: 4px 0 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 20px\">سياسة أمن المعلومات — الإصدار 4<\/h2><\/div>\n<div style=\"height: 200px; border-radius: 10px; background: #F4F4EE; border: 1px solid #E5E2CB; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 20px 28px; box-sizing: border-box\">\n<span style=\"height: 10px; width: 50%; background: #CCC9B4; border-radius: 3px\"><\/span><span style=\"height: 6px; width: 90%; background: #E5E2CB; border-radius: 3px\"><\/span><span style=\"height: 6px; width: 84%; background: #E5E2CB; border-radius: 3px\"><\/span><span style=\"height: 6px; width: 88%; background: #E5E2CB; border-radius: 3px\"><\/span><span style=\"height: 6px; width: 60%; background: #E5E2CB; border-radius: 3px\"><\/span>\n<span style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transform: rotate(-18deg); color: rgba(0,50,52,.16); font-size: 22px; font-weight: 700\">خالد المزروعي · حساس · معاينة<\/span>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-weight: 700\">تقدّم المسار<\/span>\n<sc-for list=\"{{route}}\" as=\"r\" hint-placeholder-count=\"3\">\n<div style=\"display: flex; gap: 10px; align-items: center\"><span style=\"width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: {{r.bg}}; color: {{r.fg}}\">{{r.n}}<\/span><span style=\"flex: 1\">{{r.who}}<\/span><span style=\"font-size: 12px; color: #4A6B6C\">{{r.when}}<\/span><\/div>\n<\/sc-for>\n<\/div>\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; background: #F9F9F5; border-radius: 10px; padding: 14px\">\n<div><div style=\"color: #4A6B6C; font-size: 12px\">السلسلة<\/div><span dir=\"ltr\">IT-RE-12<\/span><\/div>\n<div><div style=\"color: #4A6B6C; font-size: 12px\">درجة السرية<\/div>حساس<\/div>\n<div><div style=\"color: #4A6B6C; font-size: 12px\">الوظيفة › النشاط › العملية<\/div>الخدمات المساندة › تقنية المعلومات › السياسات<\/div>\n<div><div style=\"color: #4A6B6C; font-size: 12px\">جودة التعرّف الضوئي<\/div>جيدة · 0.97<\/div>\n<\/div>\n<a href=\"TaskAr.html\" style=\"height: 44px; border-radius: 10px; background: #005F4F; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none\">فتح واتخاذ القرار<\/a>\n<\/aside>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { tab: 'mine', sel: { 'K2-88213': true, 'K2-88240': true }, gone: {}, approved: [] }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const P = { 'عالية': ['#FAE5E0', '#B01C01'], 'عادية': ['#EEF0F3', '#3F4146'], 'منخفضة': ['#E2F1EA', '#005F4F'] };\n    const L = { 'عام': ['#E2F1EA', '#005F4F'], 'حساس': ['#FAE3BE', '#63420F'], 'سري': ['#FBDCCB', '#682A0A'], 'سري للغاية': ['#FAE5E0', '#B01C01'] };\n    const S = { ok: ['#005F4F', '#269D6A'], warn: ['#63420F', '#CE9842'], err: ['#B01C01', '#D12101'] };\n    const t = (id, action, type, code, title, who, level, priority, mode, stage, sla, st, w, tag, sel) => ({\n      id, action, type, code, title, who, level, priority, mode, stage, sla, slaW: w, tag: tag || '', hasTag: !!tag, checked: !!sel,\n      lBg: L[level][0], lFg: L[level][1], pBg: P[priority][0], pFg: P[priority][1], slaFg: S[st][0], slaBar: S[st][1],\n      border: sel ? '2px solid #269D6A' : '1px solid #E5E2CB' });\n    const TASKS = [\n        t('K2-88213', 'اعتماد وثيقة', 'اعتماد وثيقة', 'SS-IT-PY-02-R4', 'سياسة أمن المعلومات — الإصدار 4', 'عبير أ. · تقنية المعلومات · قُدّمت 28 سبتمبر', 'حساس', 'عالية', 'تسلسلي', '1 / 2', '3س 40د', 'err', '86%', '', true),\n        t('K2-88240', 'اعتماد عقد', 'اعتماد وثيقة', 'SS-IT-CR-118', 'تجديد عقد صيانة الشبكة · 720,000 درهم', 'س. حسن · تقنية المعلومات · قُدّمت 27 سبتمبر', 'سري', 'عادية', 'متوازٍ · الكل', '1 / 4', '1ي 6س', 'warn', '55%', '', true),\n        t('K2-88251', 'اعتماد مشاركة خارجية', 'طلب مشاركة خارجية', 'SS-IT-RE-041', 'مشاركة خارجية · المورد X · تنتهي 15 أكتوبر', 'سارة ح. · تقنية المعلومات', 'عام', 'عادية', 'تسلسلي', '2 / 2', '2ي 4س', 'ok', '30%', 'مفوَّضة إلى خالد س.'),\n        t('K2-88260', 'تأكيد التصنيف', 'استثناء تصنيف', 'Drop-off #4471', 'رسالة ممسوحة ضوئياً · لا توجد قاعدة توجيه مطابقة · ثقة 0.61', 'الماسح SS-02', 'حساس', 'عادية', 'تسلسلي', '1 / 2', '20س 10د', 'warn', '60%'),\n        t('K2-88102', 'التصويت على الإتلاف', 'اعتماد الإتلاف', 'IT-RE-7', '2026-Q3 · تذاكر الدعم الفني 2016 · 184 عنصراً', 'السجلات والأرشيف · تصويت 2 / 5', 'عام', 'منخفضة', 'متوازٍ · أيٌّ منهم', '2 / 5', '5ي 2س', 'ok', '18%'),\n        t('K2-87990', 'توقيع رفع الحجز القانوني', 'رفع الحجز القانوني', 'LH-2025-03', 'القضية 118/2025 · نزاع مع مورد · 2,410 عنصراً', 'نورة ك. · الشؤون القانونية', 'سري', 'عالية', 'تسلسلي', '2 / 2', '−6س 12د', 'err', '100%', 'مُصعَّدة'),\n    ];\n    const st = this.state;\n    const all = TASKS.filter(x => !st.gone[x.id]).map(x => ({ ...x, checked: !!st.sel[x.id], border: st.sel[x.id] ? '2px solid #269D6A' : '1px solid #E5E2CB',\n      toggle: () => this.setState({ sel: { ...this.state.sel, [x.id]: !this.state.sel[x.id] } }) }));\n    const selIds = all.filter(x => st.sel[x.id]).map(x => x.id);\n    const OK = ['#E2F1EA', '#005F4F'], WAIT = ['#EEF0F3', '#3F4146'], RET = ['#FAE3BE', '#63420F'];\n    const o = (id, code, title, note, status, c) => ({ id, code, title, note, status, bg: c[0], fg: c[1] });\n    const waiting = [\n      o('K2-88175', 'SS-IT-PY-07', 'سياسة الاستخدام المقبول — الإصدار 2', 'اعتمدتَها 2 أكتوبر · الآن لدى مالك المعلومات', 'الخطوة 2 / 2', WAIT),\n      o('K2-88190', 'SS-IT-CR-097', 'اتفاقية استضافة مركز البيانات · التعديل 1', 'اعتمدتَها 30 سبتمبر · الآن لدى الشؤون القانونية والتشريعات', 'الخطوة 3 / 4', WAIT),\n      o('K2-88201', 'SS-IT-ME-207', 'محضر اجتماع المجلس الاستشاري للتغيير — سبتمبر', 'اعتمدتَها 29 سبتمبر · الآن لدى مسؤول السجلات', 'الخطوة 2 / 3', WAIT),\n    ];\n    const done = st.approved.map(x => o(x.id, x.code, x.title, 'اعتُمدت الآن', 'معتمدة', OK)).concat([\n      o('K2-88120', 'SS-IT-CO-0871', 'وارد — مركز الإمارات للبيانات · التزامات مستوى الخدمة', 'قُرّرت 27 سبتمبر · حُفظت وأُعلنت سجلاً', 'معتمدة', OK),\n      o('K2-88094', 'SS-IT-RE-039', 'مشاركة خارجية · المورد Y', 'قُرّرت 24 سبتمبر · أُعيدت إلى سارة ح.', 'مُعادة', RET),\n      o('K2-88061', 'SS-IT-ME-198', 'محضر اجتماع المجلس الاستشاري للتغيير — أغسطس', 'قُرّرت 18 سبتمبر · حُفظت وأُعلنت سجلاً', 'معتمدة', OK),\n    ]);\n    const doneN = 41 + st.approved.length;\n    const ids = [['mine', 'مهامي' + ' · ' + all.length], ['waiting', 'بانتظار الآخرين' + ' · 5'], ['done', 'المكتملة' + ' · ' + doneN]];\n    const tab = st.tab;\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      tabs: ids.map(([id, label]) => ({ label, sel: tab === id ? 'true' : 'false', bg: tab === id ? '#FFFFFF' : 'transparent', fg: tab === id ? '#003234' : '#3D5F60', weight: tab === id ? 700 : 400, shadow: tab === id ? '0 1px 2px rgba(0,50,52,.14)' : 'none', pick: () => this.setState({ tab: id }) })),\n      showMine: tab === 'mine' && all.length > 0, mineEmpty: tab === 'mine' && all.length === 0, emptyText: 'الصندوق فارغ — لا توجد مهام بانتظارك',\n      showOther: tab !== 'mine', others: tab === 'waiting' ? waiting : done,\n      otherNote: tab === 'waiting' ? 'عرض أحدث 3 من {n} · يستمر المسار مع المعتمد التالي'.replace('{n}', '5') : 'عرض أحدث {k} من {n} قراراً خلال آخر 30 يوماً'.replace('{k}', String(done.length)).replace('{n}', String(doneN)),\n      selCount: String(selIds.length),\n      onApprove: () => {\n        if (!selIds.length) { this.say('حدّد مهمة واحدة على الأقل أولاً'); return; }\n        const picked = all.filter(x => this.state.sel[x.id]);\n        const gone = { ...this.state.gone }; picked.forEach(x => { gone[x.id] = true; });\n        this.setState({ gone, sel: {}, approved: picked.map(x => ({ id: x.id, code: x.code, title: x.title })).concat(this.state.approved) });\n        this.say(picked.length === 1 ? 'اعتُمدت مهمة واحدة · أُرسل القرار إلى K2' : 'اعتُمدت {n} مهام · أُرسلت القرارات إلى K2'.replace('{n}', String(picked.length)));\n      },\n      kpis: [\n        { label: 'بانتظار موافقتي', n: String(all.length), sub: 'محدد ' + selIds.length, icon: 'tasks', tone: 'default', href: '' },\n        { label: 'تجاوز مستوى الخدمة', n: '1', sub: 'صُعِّد إلى مدير القطاع', icon: 'alert', tone: 'alert', href: '' },\n        { label: 'مستحقة اليوم', n: '2', sub: 'أقل من 24 ساعة', icon: 'clock', tone: 'warn', href: '' },\n        { label: 'بانتظار الآخرين', n: '5', sub: 'اعتمدتَها ويستمر المسار', icon: 'hourglass', tone: 'default', href: '' },\n        { label: 'قرارات · 7 أيام', n: String(23 + st.approved.length), sub: 'الوسيط 9 ساعات', icon: 'check', tone: 'default', href: '' },\n      ],\n      tasks: all,\n      route: [\n        { n: '1', who: 'رئيس تقنية المعلومات · خالد المزروعي', when: 'قيد التنفيذ', bg: '#269D6A', fg: '#FFFFFF' },\n        { n: '2', who: 'مالك المعلومات', when: 'التالي', bg: '#E5E2CB', fg: '#003234' },\n        { n: '✓', who: 'الترميز · الحفظ · الإعلان كسجل', when: 'عند الاعتماد', bg: '#E5E2CB', fg: '#003234' },\n      ],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1100}}});
</script>
