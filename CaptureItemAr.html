ht: 500; font-size: 20px\">السلسلة <span dir=\"ltr\">IT-RE-1<\/span> · حساس<\/h2>\n<div style=\"display: flex; align-items: center; gap: 10px; font-size: 13px\"><span style=\"flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden\"><span style=\"display: block; height: 100%; width: 92%; background: #269D6A\"><\/span><\/span>الثقة 0.92<\/div>\n<button type=\"button\" onClick=\"{{onAccept}}\" style=\"align-self: flex-start; height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">{{acceptLabel}}<\/button>\n<\/section>\n<\/div>\n\n<form aria-label=\"نموذج الفهرسة\" style=\"flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<sc-for list=\"{{groups}}\" as=\"g\" hint-placeholder-count=\"4\">\n<fieldset style=\"margin: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 18px 20px 20px\">\n<legend style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 17px; padding: 0 6px; margin-inline-start: -6px\">{{g.title}}<\/legend>\n<div style=\"font-size: 12px; color: #4A6B6C; margin: -2px 0 12px\">{{g.hint}}<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px\">\n<sc-for list=\"{{g.fields}}\" as=\"f\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"{{f.id}}\" style=\"font-size: 13px; font-weight: 700\">{{f.label}}<sc-if value=\"{{f.req}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color: #B01C01\"> *<\/span><\/sc-if><\/label>\n<input id=\"{{f.id}}\" value=\"{{f.value}}\" readonly=\"{{f.locked}}\" dir=\"{{f.dir}}\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234; background: {{f.bg}}\">\n<\/div>\n<\/sc-for>\n<\/div>\n<\/fieldset>\n<\/sc-for>\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px\"><span style=\"color: #4A6B6C\">المسار عند الإرسال<\/span><span style=\"padding: 3px 10px; border-radius: 999px; background: #E2F1EA; color: #005F4F; font-weight: 700\">رئيس تقنية المعلومات<\/span><span aria-hidden=\"true\">←<\/span><span style=\"padding: 3px 10px; border-radius: 999px; background: #E2F1EA; color: #005F4F; font-weight: 700\">مالك المعلومات<\/span><\/div>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n<button type=\"button\" onClick=\"{{onReturn}}\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: transparent; color: #005F4F; font: inherit; font-weight: 700; cursor: pointer\">إرجاع إلى الماسح<\/button>\n<button type=\"button\" onClick=\"{{onSave}}\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">حفظ كمسودة<\/button>\n<button type=\"button\" onClick=\"{{onConfirm}}\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">تأكيد الفهرسة والإرسال<\/button>\n<\/div>\n<\/div>\n<\/form>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{done}}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"ci-done-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 28px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center\">\n<span style=\"width: 56px; height: 56px; border-radius: 14px; background: #E2F1EA; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#005F4F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg><\/span>\n<div style=\"flex: 1 1 360px; display: flex; flex-direction: column; gap: 4px\">\n<span style=\"align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #FAE3BE; color: #63420F\">سجل قيد الاعتماد<\/span>\n<h2 id=\"ci-done-h\" style=\"margin: 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 22px\">أُرسل للاعتماد<\/h2>\n<p style=\"margin: 0; color: #4A6B6C\">حُجز الرمز <span dir=\"ltr\">SS-IT-PY-02-R4<\/span> · وُجِّه إلى رئيس تقنية المعلومات ثم إلى مالك المعلومات. يصبح سجلاً معلناً بعد الاعتماد.<\/p>\n<\/div>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<a href=\"CaptureQueueAr.html\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">العودة إلى قائمة الانتظار<\/a>\n<a href=\"TaskAr.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">فتح مهمة الاعتماد<\/a>\n<\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { accepted: false, done: false, toast: null }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const cur = st.done ? 6 : 5;\n    let n = 0;\n    const f = (label, value, o) => ({ id: 'cia-' + (++n), label, value, req: !!(o && o.req), locked: !!(o && o.locked), dir: o && o.ltr ? 'ltr' : 'rtl', bg: o && o.locked ? '#F4F4EE' : '#FFFFFF' });\n    const names = ['الوصول', 'خالٍ من الفيروسات', 'التعرّف الضوئي · PDF/A-2b', 'الاستخراج', 'المقترح', 'التأكيد البشري', 'الترميز · التوجيه · الإعلان كسجل'];\n    return {\n      toastOn: !!st.toast, toastText: st.toast || '',\n      editing: !st.done, done: !!st.done,\n      propTag: st.accepted ? 'قُبل المقترح · القاعدة R-0214' : 'الفهرسة المقترحة · طابقت القاعدة R-0214',\n      acceptLabel: st.accepted ? '✓ تم قبول المقترح' : 'قبول المقترح',\n      onAccept: () => { this.setState({ accepted: true }); this.say('قُبل المقترح · السلسلة IT-RE-1 · حساس'); },\n      onSave: () => this.say('حُفظت المسودة'),\n      onReturn: () => this.say('أُعيد العنصر #4470 إلى الماسح SS-02 لإعادة المسح'),\n      onConfirm: () => { this.setState({ done: true }); this.say('أُرسلت الفهرسة · مهمة الاعتماد لدى رئيس تقنية المعلومات'); },\n      stages: names.map((label, i) => ({ label, cur: i === cur ? 'step' : 'false', bar: i < cur ? '#269D6A' : i === cur ? '#005F4F' : '#E5E2CB', fg: i <= cur ? '#003234' : '#4A6B6C', weight: i === cur ? 700 : 400 })),\n      groups: [\n        { title: 'الهوية', hint: 'ماهية الوثيقة', fields: [\n          f('العنوان (بالإنجليزية)', 'Information Security Policy — Issue 4', { req: true, ltr: true }),\n          f('العنوان (بالعربية)', 'سياسة أمن المعلومات
