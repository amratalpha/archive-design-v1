<script>
DCRun(window.DAS_COMPONENTS, {"name": "LibraryAr", "template": "\n<helmet>\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div dir=\"rtl\" style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Neue Frutiger World','Segoe UI',system-ui,sans-serif; font-size: 14px; line-height: 1.6\">\n<dc-import name=\"Sidebar\" active=\"libPolicies\" lang=\"ar\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"Library\" crumb=\"السياسات والتفويضات\" lang=\"ar\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div><div style=\"font-size: 13px; color: #4A6B6C\">مكتبة الإدارة · موقع SharePoint <span dir=\"ltr\">SS-IT<\/span><\/div>\n<h1 style=\"margin: 4px 0 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 32px\">{{title}}<\/h1><\/div>\n<div role=\"group\" aria-label=\"المكتبة\" style=\"display: inline-flex; background: #E9E7D8; border-radius: 10px; padding: 4px; gap: 4px\">\n<sc-for list=\"{{libs}}\" as=\"s\" hint-placeholder-count=\"3\">\n<button type=\"button\" aria-pressed=\"{{s.sel}}\" onClick=\"{{s.pick}}\" style=\"height: 38px; padding: 0 14px; border-radius: 8px; border: 0; background: {{s.bg}}; color: {{s.fg}}; font: inherit; font-weight: {{s.weight}}; display: flex; align-items: center; box-shadow: {{s.shadow}}; cursor: pointer\">{{s.label}}<\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n<sc-for list=\"{{counts}}\" as=\"c\" hint-placeholder-count=\"4\">\n<dc-import name=\"StatTile\" label=\"{{c.label}}\" value=\"{{c.n}}\" sub=\"{{c.sub}}\" icon=\"{{c.icon}}\" tone=\"{{c.tone}}\" href=\"{{c.href}}\" lang=\"ar\" hint-size=\"100%,146px\"><\/dc-import>\n<\/sc-for>\n<\/div>\n\n<section aria-labelledby=\"liba-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #E5E2CB\">\n<h2 id=\"liba-h\" style=\"margin: 0; font-size: 15px; font-weight: 700\">الوثائق<\/h2>\n<label for=\"liba-f\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">تصفية هذه المكتبة<\/label>\n<input id=\"liba-f\" placeholder=\"تصفية بالرمز أو العنوان\" style=\"height: 40px; width: 280px; max-width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234\">\n<\/div>\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 760px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">الرمز<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #E5E2CB\">العنوان<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #E5E2CB\">درجة السرية<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #E5E2CB\">المرحلة<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #E5E2CB\">المالك<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 12px; border-bottom: 1px solid #E5E2CB\">استحقاق البوابة 1<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"6\">\n<tr>\n<td dir=\"ltr\" style=\"padding: 14px 20px; border-bottom: 1px solid #F0EEE2; font-family: Consolas, monospace; font-size: 13px; text-align: right\">{{r.code}}<\/td>\n<td style=\"padding: 14px 12px; border-bottom: 1px solid #F0EEE2\"><a href=\"DocumentAr.html\" style=\"font-weight: 700; text-decoration: none\">{{r.title}}<\/a><\/td>\n<td style=\"padding: 14px 12px; border-bottom: 1px solid #F0EEE2\"><span style=\"padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{r.bg}}; color: {{r.fg}}\">{{r.level}}<\/span><\/td>\n<td style=\"padding: 14px 12px; border-bottom: 1px solid #F0EEE2\">{{r.phase}}<\/td>\n<td style=\"padding: 14px 12px; border-bottom: 1px solid #F0EEE2\">{{r.owner}}<\/td>\n<td style=\"padding: 14px 20px 14px 12px; border-bottom: 1px solid #F0EEE2\">{{r.gate}}<\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<div style=\"padding: 14px 20px; font-size: 13px; color: #4A6B6C\">تدخل الوثائق الجديدة عبر <a href=\"CaptureQueueAr.html\">الالتقاط<\/a>، لذا فإن كل عنصر هنا مفهرس ومرمَّز ومعلن كسجل.<\/div>\n<\/section>\n\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  renderVals() {\n    const L = { 'عام': ['#E2F1EA', '#005F4F'], 'حساس': ['#FAE3BE', '#63420F'], 'سري': ['#FBDCCB', '#682A0A'] };\n    const r = (code, title, level, phase, owner, gate) => ({ code, title, level, phase, owner, gate, bg: L[level][0], fg: L[level][1] });\n    const lib = (this.state && this.state.lib) || 'policies';\n    const libs = [\n      { id: 'policies', label: 'السياسات والتفويضات',\n        counts: [{ k: 'العناصر', n: '146' }, { k: 'نشطة', n: '118' }, { k: 'وسيطة', n: '26' }, { k: 'محجوزة', n: '2' }],\n        rows: [\n          r('SS-IT-PY-02-R3', 'سياسة أمن المعلومات — الإصدار 3', 'حساس', 'نشطة', 'ك. المزروعي', '2029-03-15'),\n          r('SS-IT-PY-04-R2', 'سياسة الاستخدام المقبول — الإصدار 3', 'عام', 'نشطة', 'ك. المزروعي', '2031-03-02'),\n          r('SS-IT-PY-07-R1', 'معيار التحكم في الوصول', 'حساس', 'نشطة', 'ك. المزروعي', '2031-09-22'),\n          r('SS-IT-DL-003', 'تفويض — مشتريات تقنية المعلومات حتى 500,000 درهم', 'سري', 'نشطة', 'خالد المزروعي', '2030-01-01'),\n          r('SS-IT-PJ-004-01', 'تنفيذ نظام أرشفة الوثائق — ميثاق المشروع', 'عام', 'نشطة', 'عبير أ.', '2032-02-28'),\n          r('SS-IT-PY-01-R5', 'إطار حوكمة تقنية المعلومات — الإصدار 5', 'عام', 'وسيطة', 'ك. المزروعي', 'مؤرشف'),\n        ] },\n      { id: 'contracts', label: 'العقود واتفاقيات الخدمة',\n        counts: [{ k: 'العناصر', n: '64' }, { k: 'نشطة', n: '41' }, { k: 'وسيطة', n: '22' }, { k: 'محجوزة', n: '1' }],\n        rows: [\n          r('SS-IT-CR-118', 'عقد الخدمات المُدارة مع المورد X', 'سري', 'نشطة', 'خالد المزروعي', '2031-06-30'),\n          r('SS-IT-CR-097', 'اتفاقية استضافة مركز البيانات', 'سري', 'وسيطة', 'ك. المزروعي', 'محجوز'),\n          r('SS-IT-CR-121', 'اتفاقية Microsoft المؤسسية — تجديد 2026', 'حساس', 'نشطة', 'عبير أ.', '2032-01-15'),\n          r('SS-IT-SL-014', 'مركز الإمارات للبيانات — جدول اتفاقية مستوى الخدمة', 'حساس', 'نشطة', 'عبير أ.', '2031-09-21'),\n          r('SS-IT-CR-084', 'عقد صيانة الشبكة 2019–2022', 'حساس', 'وسيطة', 'ك. المزروعي', 'مؤرشف'),\n        ] },\n      { id: 'corr', label: 'المراسلات',\n        counts: [{ k: 'العناصر', n: '312' }, { k: 'نشطة', n: '287' }, { k: 'وسيطة', n: '24' }, { k: 'محجوزة', n: '1' }],\n        rows: [\n          r('SS-IT-CO-0871', 'وارد — مركز الإمارات للبيانات · التزامات مستوى الخدمة', 'حساس', 'نشطة', 'عبير أ.', '2031-09-21'),\n          r('SS-IT-CO-0869', 'صادر — المورد X · مراجعة الأداء الربعية', 'عام', 'نشطة', 'عبير أ.', '2031-09-14'),\n          r('SS-IT-ME-207', 'محضر اجتماع مجلس إدارة التغيير — سبتمبر', 'عام', 'نشطة', 'ك. المزروعي', '2031-09-28'),\n          r('SS-IT-CO-0855', 'وارد — هيئة تنظيم الاتصالات · تعميم أمن السحابة', 'حساس', 'نشطة', 'ك. المزروعي', '2031-08-30'),\n          r('SS-IT-CO-0712', 'صادر — الشؤون القانونية والتشريعات · استفسار حول اتفاقية الاستضافة', 'سري', 'وسيطة', 'ك. المزروعي', 'محجوز'),\n        ] },\n    ];\n    const cur = libs.find(x => x.id === lib) || libs[0];\n    return {\n      title: cur.label,\n      libs: libs.map(x => ({ label: x.label, sel: x.id === lib ? 'true' : 'false', bg: x.id === lib ? '#FFFFFF' : 'transparent', fg: x.id === lib ? '#003234' : '#3D5F60', weight: x.id === lib ? 700 : 400, shadow: x.id === lib ? '0 1px 2px rgba(0,50,52,.14)' : 'none', pick: () => this.setState({ lib: x.id }) })),\n      counts: cur.counts.map((c, i) => {\n        const items = parseInt(cur.counts[0].n.replace(/,/g, ''), 10) || 0;\n        const pct = items ? Math.round((parseInt(c.n.replace(/,/g, ''), 10) || 0) * 100 / items) + ' % من العناصر' : '';\n        const meta = [\n          { sub: 'موقع SharePoint · SS-IT', icon: 'folder', href: '' },\n          { sub: pct, icon: 'doc', href: '' },\n          { sub: pct, icon: 'archive', href: '' },\n          { sub: 'حجز قانوني · الإتلاف معلّق', icon: 'shield', href: 'LegalHoldsAr.html' },\n        ][i] || { sub: '', icon: 'layers', href: '' };\n        return { label: c.k, n: c.n, sub: meta.sub, icon: meta.icon, tone: 'default', href: meta.href };\n      }),\n      rows: cur.rows,\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1000}}});
</script>
