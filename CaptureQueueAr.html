<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الالتقاط · قائمة الإيداع · DAS prototype</title>
<style>body{margin:0}</style>
<script src="das-runtime.js"></script>
<script src="components.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script>
DCRun(window.DAS_COMPONENTS, {"name": "CaptureQueueAr", "template": "\n<helmet>\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div dir=\"rtl\" style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Neue Frutiger World','Segoe UI',system-ui,sans-serif; font-size: 14px; line-height: 1.6\">\n<dc-import name=\"Sidebar\" active=\"capture\" lang=\"ar\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"CaptureQueue\" crumb=\"الالتقاط\" lang=\"ar\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div><div style=\"font-size: 13px; color: #4A6B6C\">مكتبة الإيداع · لا شيء هنا سجل بعد<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 32px\">قائمة الإيداع<\/h1><\/div>\n<a href=\"MyFilesAr.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font-weight: 700; display: inline-flex; align-items: center; text-decoration: none\">ملفاتي ←<\/a>\n<\/div>\n\n<section aria-labelledby=\"dropa-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 2px dashed #7EA393; padding: 28px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center\">\n<span style=\"width: 56px; height: 56px; border-radius: 14px; background: #E2F1EA; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#005F4F\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 16V4M7 9l5-5 5 5M4 20h16\"><\/path><\/svg><\/span>\n<div style=\"flex: 1 1 320px\"><h2 id=\"dropa-h\" style=\"margin: 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 20px\">أفلت الملفات أو امسحها ضوئياً أو استورد سجلاً<\/h2>\n<p style=\"margin: 4px 0 0; color: #4A6B6C\">PDF وملفات Office والصور والبريد. يُفحص كل ملف من الفيروسات ويُحوَّل إلى PDF/A-2b مع التعرّف الضوئي، ويُقترح له سلسلة قبل الفهرسة.<\/p><\/div>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<button type=\"button\" onClick=\"{{onTemplate}}\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">القالب ↓<\/button>\n<button type=\"button\" onClick=\"{{onUploadTpl}}\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">رفع القالب المعبأ<\/button>\n<button type=\"button\" onClick=\"{{onChoose}}\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">اختيار ملفات<\/button>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"qa-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #E5E2CB\">\n<h2 id=\"qa-h\" style=\"margin: 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\">{{qTitle}}<\/h2>\n<div style=\"display: flex; gap: 6px; font-size: 13px; flex-wrap: wrap\">\n<sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"5\">\n<button type=\"button\" aria-pressed=\"{{c.sel}}\" onClick=\"{{c.pick}}\" style=\"padding: 6px 12px; border-radius: 999px; border: 0; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-weight: {{c.weight}}; cursor: pointer\">{{c.label}}<\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 860px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">الدفعة<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #E5E2CB\">النظام المصدر<\/th>\n<th scope=\"col\" style=\"text-align: end; padding: 10px 12px; border-bottom: 1px solid #E5E2CB\">الملفات<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #E5E2CB\">الوصول<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #E5E2CB\">السلسلة المقترحة · الثقة<\/th>\n<th scope=\"col\" style=\"text-align: end; padding: 10px 20px 10px 12px; border-bottom: 1px solid #E5E2CB\">الإجراء<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"4\">\n<tr>\n<td dir=\"ltr\" style=\"padding: 14px 20px; border-bottom: 1px solid #F0EEE2; font-family: Consolas, monospace; font-weight: 700; text-align: right\">{{r.id}}<\/td>\n<td style=\"padding: 14px 12px; border-bottom: 1px solid #F0EEE2\">{{r.src}}<\/td>\n<td style=\"padding: 14px 12px; border-bottom: 1px solid #F0EEE2; text-align: end\">{{r.files}}<\/td>\n<td style=\"padding: 14px 12px; border-bottom: 1px solid #F0EEE2; color: #4A6B6C\">{{r.arrived}}<\/td>\n<td style=\"padding: 14px 12px; border-bottom: 1px solid #F0EEE2\">\n<div style=\"display: flex; align-items: center; gap: 10px\"><span dir=\"ltr\" style=\"font-family: Consolas, monospace; font-weight: 700\">{{r.series}}<\/span>\n<span style=\"width: 72px; height: 6px; border-radius: 3px; background: #E5E2CB; overflow: hidden; display: block\"><span style=\"display: block; height: 100%; width: {{r.w}}; background: {{r.bar}}\"><\/span><\/span>\n<span style=\"font-size: 13px\">{{r.conf}}<\/span><\/div>\n<div style=\"font-size: 12px; color: {{r.noteFg}}\">{{r.note}}<\/div>\n<\/td>\n<td style=\"padding: 14px 20px 14px 12px; border-bottom: 1px solid #F0EEE2; text-align: end\"><a href=\"{{r.href}}\" style=\"display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 8px; background: #E2F1EA; color: #005F4F; font-weight: 700; text-decoration: none; white-space: nowrap\">{{r.cta}}<\/a><\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<sc-if value=\"{{noRows}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding: 20px; color: #4A6B6C; font-size: 13px\">لا توجد دفعات بانتظار الفهرسة من هذا المصدر.<\/div>\n<\/sc-if>\n<\/section>\n\n<section aria-labelledby=\"pipea-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px\">\n<h2 id=\"pipea-h\" style=\"margin: 0 0 14px; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\">مراحل الالتقاط<\/h2>\n<ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px\">\n<sc-for list=\"{{stages}}\" as=\"s\" hint-placeholder-count=\"7\">\n<li style=\"padding: 12px; border-radius: 10px; background: #F9F9F5; border: 1px solid #ECEADB\"><div style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 700; font-size: 22px; color: #269D6A\">{{s.n}}<\/div><div style=\"font-size: 13px; font-weight: 700\">{{s.label}}<\/div><\/li>\n<\/sc-for>\n<\/ol>\n<\/section>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { src: 'all', toast: null }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const src = st.src || 'all';\n    const kinds = ['files', 'scan', 'mail', 'scan'];\n    const r = (id, src, files, arrived, series, c, note, low) => ({ id, src, files, arrived, series, conf: c.toFixed(2), w: Math.round(c * 100) + '%', bar: low ? '#CE9842' : '#269D6A', note, noteFg: low ? '#63420F' : '#4A6B6C', href: files > 1 ? 'CaptureBatchAr.html' : 'CaptureItemAr.html', cta: files > 1 ? 'فهرسة الدفعة' : 'فهرسة العنصر' });\n    const all = [\n      r('B-2201', 'ملفاتي · Google Drive ‏/DAS rollout (TR-1043)', 3, 'اليوم 08:41', 'IA-RE-1', 0.84, 'القاعدة R-0214 · تطابق كلمة مفتاحية'),\n      r('B-2202', 'الماسح SS-02 · العنصر #4470', 1, 'اليوم 08:12', 'IT-RE-1', 0.92, 'أكّده مسؤول السجلات'),\n      r('B-2203', 'التقاط البريد · it-docs@adpf.ae', 2, 'اليوم 07:55', 'FN-RE-1', 0.71, 'ثقة منخفضة · بدائل EM-RE-1 ‏0.22، MP-RE-1 ‏0.07', true),\n      r('B-2204', 'الماسح SS-02 · العنصر #4471', 1, 'أمس 16:20', '—', 0.0, 'لا تطابق — اختر السلسلة', true),\n    ];\n    const rows = all.filter((x, i) => src === 'all' || kinds[i] === src);\n    const n = rows.length;\n    return {\n      toastOn: !!st.toast, toastText: st.toast || '',\n      onTemplate: () => this.say('نُزِّل قالب سجل الإيداع · DAS-register-template.xlsx'),\n      onUploadTpl: () => this.say('استُلم القالب المعبأ · يجري التحقق من الصفوف'),\n      onChoose: () => this.say('فُتح منتقي الملفات · أفلت الملفات أو اخترها للرفع'),\n      chips: [['all', 'كل المصادر'], ['scan', 'الماسحات'], ['mail', 'البريد'], ['files', 'ملفاتي'], ['int', 'التكاملات']].map(([id, label]) => ({ label, sel: src === id ? 'true' : 'false', bg: src === id ? '#003234' : '#F4F4EE', fg: src === id ? '#FFFFFF' : '#003234', weight: src === id ? 700 : 400, pick: () => this.setState({ src: id }) })),\n      rows, noRows: n === 0, qTitle: 'بانتظار الفهرسة · ' + n + ' ' + (n >= 3 && n <= 10 ? 'دفعات' : 'دفعة'),\n      stages: ['الوصول', 'خالٍ من الفيروسات', 'التعرّف الضوئي · PDF/A-2b', 'الاستخراج', 'الاقتراح', 'التأكيد البشري', 'الترميز · التوجيه · الإعلان'].map((label, i) => ({ label, n: String(i + 1).padStart(2, '0') })),\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1100}}});
</script>
</body>
</html>
