<script>
DCRun(window.DAS_COMPONENTS, {"name": "MyFilesDark", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #003234; color: #FFFFFF; font-family: 'Roboto',system-ui,sans-serif; font-size: 14px; line-height: 1.45\">\n<dc-import name=\"SidebarDark\" active=\"myFiles\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"TopbarDark\" page=\"MyFiles\" crumb=\"My files\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div><div style=\"font-size: 13px; color: #BFD0CC\">Connected platforms · personal scope · OAuth per user<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 32px\">My files<\/h1><\/div>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<a href=\"CaptureQueueDark.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #4F8A7E; background: #00453F; color: #FFFFFF; font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">Upload from this device<\/a>\n<button type=\"button\" onClick=\"{{onConnect}}\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #67BA97; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">+ Connect account<\/button>\n<\/div>\n<\/div>\n\n<div role=\"tablist\" aria-label=\"My files views\" style=\"display: flex; gap: 24px; border-bottom: 1px solid #005F4F\">\n<sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"2\">\n<button type=\"button\" role=\"tab\" aria-selected=\"{{t.sel}}\" onClick=\"{{t.pick}}\" style=\"height: 44px; border: 0; border-bottom: 3px solid {{t.line}}; background: transparent; font: inherit; font-weight: {{t.weight}}; color: {{t.fg}}; padding: 0 2px; cursor: pointer\">{{t.label}}<\/button>\n<\/sc-for>\n<\/div>\n\n<sc-if value=\"{{showBrowse}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px\">\n<sc-for list=\"{{accounts}}\" as=\"a\" hint-placeholder-count=\"4\">\n<button type=\"button\" aria-pressed=\"{{a.sel}}\" onClick=\"{{a.pick}}\" style=\"text-align: start; background: #00453F; border-radius: 12px; border: {{a.border}}; padding: 16px; display: flex; gap: 12px; align-items: center; font: inherit; color: #FFFFFF; cursor: pointer\">\n<span style=\"width: 40px; height: 40px; border-radius: 10px; background: {{a.tile}}; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 13px\">{{a.ini}}<\/span>\n<span style=\"flex: 1; min-width: 0\"><span style=\"display: block; font-weight: 700\">{{a.name}}<\/span><span style=\"font-size: 12px; color: {{a.stFg}}\">{{a.status}}<\/span><\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<section aria-labelledby=\"br-h\" style=\"flex: 3 1 560px; min-width: 0; background: #00453F; border-radius: 12px; border: 1px solid #005F4F\">\n<div style=\"padding: 16px 20px; border-bottom: 1px solid #005F4F; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between\">\n<h2 id=\"br-h\" style=\"margin: 0; font-size: 15px; font-weight: 700\">{{acctName}}<\/h2>\n<nav aria-label=\"Folder path\" style=\"font-size: 13px; color: #BFD0CC\">Root / ADPF / <strong style=\"color: #FFFFFF\">Policies 2026<\/strong><\/nav>\n<\/div>\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 600px\">\n<thead><tr style=\"font-size: 12px; color: #BFD0CC\">\n<th scope=\"col\" style=\"width: 44px; padding: 10px 20px; border-bottom: 1px solid #005F4F\"><span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Select<\/span><\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #005F4F\">Name<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #005F4F\">Kind<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #005F4F\">Modified<\/th>\n<th scope=\"col\" style=\"text-align: end; padding: 10px 20px 10px 12px; border-bottom: 1px solid #005F4F\">Size<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{files}}\" as=\"f\" hint-placeholder-count=\"5\">\n<tr style=\"background: {{f.bg}}\">\n<td style=\"padding: 12px 20px; border-bottom: 1px solid #0B5048\"><input type=\"checkbox\" aria-label=\"Select {{f.name}}\" checked=\"{{f.on}}\" style=\"width: 18px; height: 18px; accent-color: #7DC4A6\"><\/td>\n<td style=\"padding: 12px; border-bottom: 1px solid #0B5048; font-weight: 700\">{{f.name}}<\/td>\n<td style=\"padding: 12px; border-bottom: 1px solid #0B5048\">{{f.kind}}<\/td>\n<td style=\"padding: 12px; border-bottom: 1px solid #0B5048; color: #BFD0CC\">{{f.mod}}<\/td>\n<td style=\"padding: 12px 20px 12px 12px; border-bottom: 1px solid #0B5048; text-align: end\">{{f.size}}<\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<\/section>\n\n<aside aria-labelledby=\"imp-h\" style=\"flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<h2 id=\"imp-h\" style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">Import to archive<\/h2>\n<div style=\"font-size: 13px; color: #BFD0CC\">3 files selected · 4.1 MB<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"mf-series\" style=\"font-size: 13px; font-weight: 700\">Destination record series<\/label>\n<select id=\"mf-series\" style=\"height: 44px; border-radius: 10px; border: 1px solid #2E6E64; padding: 0 12px; font: inherit; background: #00453F; color: #FFFFFF\"><option>IT-RE-12 · IT policies<\/option><option>IT-RE-10 · IT contracts register<\/option><\/select>\n<\/div>\n<label style=\"display: flex; gap: 10px; align-items: center; min-height: 44px\"><input type=\"checkbox\" checked style=\"width: 18px; height: 18px; accent-color: #7DC4A6\">Classify automatically on arrival<\/label>\n<button type=\"button\" onClick=\"{{onImport}}\" style=\"height: 44px; border-radius: 10px; border: 0; background: #67BA97; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">Import to archive · 3<\/button>\n<span style=\"font-size: 12px; color: #BFD0CC\">Files land in Drop-off. They become records once indexed and declared.<\/span>\n<a href=\"CaptureQueueDark.html\" style=\"font-size: 13px; font-weight: 700; text-decoration: none\">Open Drop-off →<\/a>\n<\/div>\n<div style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px; display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-weight: 700; margin-bottom: 8px\">Transfers<\/span>\n<sc-for list=\"{{transfers}}\" as=\"t\" hint-placeholder-count=\"3\">\n<div style=\"padding: 10px 0; border-top: 1px solid #0B5048; display: flex; flex-direction: column; gap: 4px\">\n<div style=\"display: flex; justify-content: space-between; gap: 8px\"><span style=\"font-weight: 700; font-family: 'Roboto Mono',Consolas,monospace\">{{t.id}} · {{t.dir}}<\/span><span style=\"font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 6px; background: {{t.bg}}; color: {{t.fg}}\">{{t.status}}<\/span><\/div>\n<div style=\"font-size: 13px; color: #BFD0CC\">{{t.path}} · {{t.items}}<\/div>\n<span style=\"height: 5px; border-radius: 3px; background: #005F4F; overflow: hidden; display: block\"><span style=\"display: block; height: 100%; width: {{t.w}}; background: #269D6A\"><\/span><\/span>\n<\/div>\n<\/sc-for>\n<\/div>\n<\/aside>\n<\/div>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{showTransfers}}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"tr-h\" style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px; display: flex; flex-direction: column; gap: 4px\">\n<h2 id=\"tr-h\" style=\"margin: 0 0 8px; font-size: 15px; font-weight: 700\">Transfers · 3<\/h2>\n<sc-for list=\"{{transfers}}\" as=\"t\" hint-placeholder-count=\"3\">\n<div style=\"padding: 12px 0; border-top: 1px solid #0B5048; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px\"><span style=\"font-weight: 700; font-family: 'Roboto Mono',Consolas,monospace\">{{t.id}} · {{t.dir}}<\/span><span style=\"font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 6px; background: {{t.bg}}; color: {{t.fg}}\">{{t.status}}<\/span><\/div>\n<div style=\"font-size: 13px; color: #BFD0CC\">{{t.path}} · {{t.items}}<\/div>\n<span style=\"height: 5px; border-radius: 3px; background: #005F4F; overflow: hidden; display: block\"><span style=\"display: block; height: 100%; width: {{t.w}}; background: #269D6A\"><\/span><\/span>\n<\/div>\n<\/sc-for>\n<a href=\"CaptureQueueDark.html\" style=\"margin-top: 8px; font-size: 13px; font-weight: 700; text-decoration: none\">Open Drop-off →<\/a>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #005F4F; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { tab: 'browse', acct: 0, toast: null }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const tab = st.tab || 'browse';\n    const acct = st.acct || 0;\n    const f = (name, kind, mod, size, on) => ({ name, kind, mod, size, on: !!on, bg: on ? '#0B4A40' : '#00453F' });\n    const accounts = [\n      { ini: 'OD', name: 'OneDrive — Abeer', status: 'Connected · browsing', stFg: '#7DC4A6', tile: '#005F4F' },\n      { ini: 'GD', name: 'Google Drive — IT shared', status: 'Connected', stFg: '#7DC4A6', tile: '#3F4146' },\n      { ini: 'DB', name: 'Dropbox — personal', status: 'Needs attention · sign in again', stFg: '#F09A8A', tile: '#63666E' },\n      { ini: 'SP', name: 'SharePoint — IT policies library', status: 'Connected · source columns', stFg: '#7DC4A6', tile: '#00453F' },\n    ];\n    const tabIds = [['browse', 'Browse sources'], ['transfers', 'Transfers · 3']];\n    return {\n      toastOn: !!st.toast, toastText: st.toast || '',\n      tabs: tabIds.map(([id, label]) => ({ label, sel: tab === id ? 'true' : 'false', line: tab === id ? '#269D6A' : 'transparent', weight: tab === id ? 700 : 400, fg: tab === id ? '#FFFFFF' : '#BFD0CC', pick: () => this.setState({ tab: id }) })),\n      showBrowse: tab === 'browse', showTransfers: tab === 'transfers',\n      acctName: accounts[acct].name,\n      onConnect: () => this.say('Microsoft sign-in opened · approve access to connect the account'),\n      onImport: () => this.say('3 files sent to Drop-off · TR-1045 · classifying on arrival'),\n      accounts: accounts.map((a, i) => ({ ...a, sel: i === acct ? 'true' : 'false', border: i === acct ? '2px solid #269D6A' : '1px solid #005F4F', pick: () => this.setState({ acct: i }) })),\n      files: [\n        f('InfoSec Policy v4 draft.docx', 'Word document', '27 Sep 2026', '1.2 MB', true),\n        f('Access Control Standard.pdf', 'PDF', '22 Sep 2026', '840 KB', true),\n        f('Emirates DC — SLA letter.pdf', 'PDF', '21 Sep 2026', '2.1 MB', true),\n        f('Steering committee pack Sep.pptx', 'PowerPoint', '18 Sep 2026', '6.4 MB'),\n        f('Acceptable Use Policy v3.docx', 'Word document', '02 Mar 2026', '310 KB'),\n      ],\n      transfers: [\n        { id: 'TR-1042', dir: 'In', path: '/ADPF/Policies 2026 → IT-RE-1', items: '14 items', status: 'Declared', bg: '#094C41', fg: '#7DC4A6', w: '100%' },\n        { id: 'TR-1043', dir: 'In', path: '/DAS rollout → Drop-off', items: '3 items', status: 'In Drop-off · indexing', bg: '#4A3A17', fg: '#F3BF6D', w: '70%' },\n        { id: 'TR-1044', dir: 'Out', path: 'SS-IT-PY-02-R3 → OneDrive', items: '1 item', status: 'Transferring · 62 %', bg: '#1F5A54', fg: '#D9DAE3', w: '62%' },\n      ],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1100}}});
</script>
