DCRun(window.DAS_COMPONENTS, {"name": "ProjectsAr", "template": "\n<helmet>\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div dir=\"rtl\" style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Neue Frutiger World','Segoe UI',system-ui,sans-serif; font-size: 14px; line-height: 1.6\">\n<dc-import name=\"Sidebar\" active=\"projects\" lang=\"ar\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"Projects\" crumb=\"المشاريع\" lang=\"ar\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div><div style=\"font-size: 13px; color: #4A6B6C\">ملفات المشاريع · كل مشروع مرتبط بسلسلة سجلات خاصة به<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 32px\">المشاريع<\/h1><\/div>\n<button type=\"button\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{onNew}}\">+ مشروع جديد<\/button>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n<sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"5\">\n<dc-import name=\"StatTile\" label=\"{{k.label}}\" value=\"{{k.n}}\" sub=\"{{k.sub}}\" icon=\"{{k.icon}}\" tone=\"{{k.tone}}\" href=\"{{k.href}}\" lang=\"ar\" hint-size=\"100%,146px\"><\/dc-import>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<section aria-label=\"قائمة المشاريع\" style=\"flex: 3 1 560px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid #E5E2CB\">\n<div role=\"tablist\" aria-label=\"مرحلة المشروع\" style=\"display: flex; gap: 24px\">\n<sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"3\">\n<button type=\"button\" role=\"tab\" aria-selected=\"{{t.sel}}\" onClick=\"{{t.pick}}\" style=\"height: 48px; border: 0; border-bottom: 3px solid {{t.line}}; background: transparent; font: inherit; font-weight: {{t.weight}}; color: {{t.fg}}; cursor: pointer\">{{t.label}}<\/button>\n<\/sc-for>\n<\/div>\n<label for=\"pja-f\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">تصفية المشاريع<\/label>\n<input id=\"pja-f\" placeholder=\"تصفية المشاريع\" style=\"height: 38px; width: 220px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234\">\n<\/div>\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 700px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">المشروع<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">الإدارة · الراعي<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">المرحلة<\/th>\n<th scope=\"col\" style=\"text-align: end; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">الوثائق<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">المخرجات<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 8px; border-bottom: 1px solid #E5E2CB\">تاريخ الانتهاء<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"5\">\n<tr style=\"background: {{r.bg}}\">\n<td style=\"padding: 14px 20px; border-bottom: 1px solid #F0EEE2\"><button type=\"button\" onClick=\"{{r.pick}}\" aria-pressed=\"{{r.pressed}}\" style=\"padding: 0; border: 0; background: transparent; font: inherit; font-weight: 700; color: #005F4F; text-align: start; cursor: pointer\">{{r.name}}<\/button><div style=\"font-size: 12px; color: #4A6B6C\"><span dir=\"ltr\" style=\"font-family: Consolas, monospace\">{{r.code}}<\/span> · مدير المشروع {{r.pm}}<\/div><\/td>\n<td style=\"padding: 14px 8px; border-bottom: 1px solid #F0EEE2\">{{r.div}}<\/td>\n<td style=\"padding: 14px 8px; border-bottom: 1px solid #F0EEE2\"><span style=\"padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: {{r.phBg}}; color: {{r.phFg}}\">{{r.phase}}<\/span><\/td>\n<td style=\"padding: 14px 8px; border-bottom: 1px solid #F0EEE2; text-align: end; font-weight: 700\">{{r.docs}}<\/td>\n<td style=\"padding: 14px 8px; border-bottom: 1px solid #F0EEE2\"><span style=\"display: inline-flex; align-items: center; gap: 8px\"><span style=\"width: 70px; height: 6px; border-radius: 3px; background: #E5E2CB; overflow: hidden; display: block\"><span style=\"display: block; height: 100%; width: {{r.w}}; background: #269D6A\"><\/span><\/span>{{r.del}}<\/span><\/td>\n<td style=\"padding: 14px 20px 14px 8px; border-bottom: 1px solid #F0EEE2\">{{r.end}}<\/td>\n<\/tr>\n<\/sc-for>\n<sc-if value=\"{{noRows}}\" hint-placeholder-val=\"{{ false }}\">\n<tr><td colspan=\"6\" style=\"padding: 20px; color: #4A6B6C\">{{emptyText}}<\/td><\/tr>\n<\/sc-if>\n<\/tbody>\n<\/table>\n<\/div>\n<\/section>\n\n<aside aria-labelledby=\"pda-h\" style=\"flex: 2 1 320px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<div><div dir=\"ltr\" style=\"font-family: Consolas, monospace; font-size: 12px; color: #4A6B6C; text-align: right\">{{p.code}} · {{p.fileCode}}<\/div>\n<h2 id=\"pda-h\" style=\"margin: 4px 0 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 20px\">{{p.name}}<\/h2><\/div>\n<dl style=\"margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 13px\">\n<dt style=\"color: #4A6B6C\">الراعي<\/dt><dd style=\"margin: 0; font-weight: 700\">{{p.sponsor}}<\/dd>\n<dt style=\"color: #4A6B6C\">مدير المشروع<\/dt><dd style=\"margin: 0; font-weight: 700\">{{p.pm}}<\/dd>\n<dt style=\"color: #4A6B6C\">السلسلة<\/dt><dd style=\"margin: 0; font-weight: 700\"><span dir=\"ltr\">{{p.seriesCode}}<\/span> · {{p.seriesName}}<\/dd>\n<dt style=\"color: #4A6B6C\">المرحلة<\/dt><dd style=\"margin: 0; font-weight: 700\">{{p.phaseLine}}<\/dd>\n<\/dl>\n<div role=\"tablist\" aria-label=\"تفاصيل المشروع\" style=\"display: inline-flex; background: #F4F4EE; border-radius: 10px; padding: 4px; gap: 4px; font-size: 13px; align-self: flex-start\">\n<sc-for list=\"{{segs}}\" as=\"g\" hint-placeholder-count=\"3\">\n<button type=\"button\" role=\"tab\" aria-selected=\"{{g.sel}}\" onClick=\"{{g.pick}}\" style=\"padding: 6px 12px; border-radius: 8px; border: 0; font: inherit; background: {{g.bg}}; color: {{g.fg}}; font-weight: {{g.weight}}; cursor: pointer\">{{g.label}}<\/button>\n<\/sc-for>\n<\/div>\n<sc-if value=\"{{showRegister}}\" hint-placeholder-val=\"{{ false }}\">\n<dl style=\"margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 13px\">\n<sc-for list=\"{{register}}\" as=\"g\" hint-placeholder-count=\"4\">\n<dt style=\"color: #4A6B6C\">{{g.k}}<\/dt><dd style=\"margin: 0; font-weight: 700; text-align: end\">{{g.v}}<\/dd>\n<\/sc-for>\n<\/dl>\n<\/sc-if>\n<sc-if value=\"{{showTeam}}\" hint-placeholder-val=\"{{ false }}\">\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px\">\n<sc-for list=\"{{team}}\" as=\"m\" hint-placeholder-count=\"4\">\n<li style=\"display: flex; gap: 10px; align-items: center; justify-content: space-between\"><strong>{{m.who}}<\/strong><span style=\"color: #4A6B6C\">{{m.role}}<\/span><\/li>\n<\/sc-for>\n<\/ul>\n<\/sc-if>\n<sc-if value=\"{{showClose}}\" hint-placeholder-val=\"{{ true }}\">\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px\">\n<sc-for list=\"{{checks}}\" as=\"c\" hint-placeholder-count=\"5\">\n<li style=\"display: flex; gap: 10px; align-items: center\"><span style=\"width: 22px; height: 22px; border-radius: 11px; flex: 0 0 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: {{c.bg}}; color: {{c.fg}}\">{{c.mark}}<\/span><span style=\"flex: 1\">{{c.label}}<\/span><span style=\"font-size: 12px; color: #4A6B6C\">{{c.note}}<\/span><\/li>\n<\/sc-for>\n<\/ul>\n<\/sc-if>\n<button type=\"button\" onClick=\"{{onSignoff}}\" style=\"height: 44px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">طلب اعتماد الراعي<\/button>\n<button type=\"button\" disabled style=\"height: 44px; border-radius: 10px; border: 0; background: #E5E2CB; color: #4A6B6C; font: inherit; font-weight: 700\">إغلاق المشروع والإعلان كسجلات<\/button>\n<\/aside>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { tab: 'active', sel: 'PRJ-2026-004', seg: 'close', asked: {} }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const tab = st.tab || 'active', sel = st.sel || 'PRJ-2026-004', seg = st.seg || 'close', asked = st.asked || {};\n    const PH = { 'بدء': ['#EEF0F3', '#3F4146'], 'تنفيذ': ['#E2F1EA', '#005F4F'], 'قيد الإغلاق': ['#FAE3BE', '#63420F'], 'مغلق': ['#EEF0F3', '#3F4146'] };\n    const GROUP = { 'بدء': 'active', 'تنفيذ': 'active', 'قيد الإغلاق': 'closing', 'مغلق': 'closed' };\n    const r = (code, name, div, pm, phase, docs, done, total, end, x) => ({ code, name, div, pm, phase, docs, done, total, end, ...x, del: done + ' / ' + total, w: Math.round(done / total * 100) + '%', phBg: PH[phase][0], phFg: PH[phase][1] });\n    const c = (label, ok, note) => ({ label, note, mark: ok ? '✓' : '·', bg: ok ? '#269D6A' : '#E5E2CB', fg: ok ? '#FFFFFF' : '#003234' });\n    const all = [\n      r('PRJ-2026-004', 'تطبيق نظام أرشفة الوثائق', 'تقنية المعلومات · مدير الخدمات المساندة', 'عبير أ.', 'تنفيذ', '212', 14, 22, '2027-02-28', { fileCode: 'SS-IT-PJ-004', sponsor: 'مدير الخدمات المساندة', seriesCode: 'IT-RE-15', seriesName: 'مشاريع تقنية المعلومات', phaseLine: 'تنفيذ · ينتهي 28 فبراير 2027', drafts: 6, reconciled: true, erp: false, team: [['عبير أ.', 'مدير المشروع'], ['مدير الخدمات المساندة', 'الراعي'], ['منى س.', 'منسقة السجلات'], ['ك. المزروعي', 'مالك المعلومات']] }),\n      r('PRJ-2025-011', 'ترقية نظام ERP · Fusion 24C', 'المالية · المدير المالي', 'عمر ر.', 'قيد الإغلاق', '388', 30, 31, '2026-12-15', { fileCode: 'SS-FN-PJ-011', sponsor: 'المدير المالي', seriesCode: 'FN-RE-08', seriesName: 'مشاريع المالية', phaseLine: 'قيد الإغلاق · ينتهي 15 ديسمبر 2026', drafts: 1, reconciled: true, erp: false, team: [['عمر ر.', 'مدير المشروع'], ['المدير المالي', 'الراعي'], ['منى س.', 'منسقة السجلات'], ['شريك Oracle', 'المورّد']] }),\n      r('PRJ-2026-002', 'إعادة تصميم بوابة المعاشات', 'تقنية المعلومات · مدير تجربة المتعاملين', 'سارة ح.', 'بدء', '41', 1, 12, '2027-09-30', { fileCode: 'SS-IT-PJ-002', sponsor: 'مدير تجربة المتعاملين', seriesCode: 'IT-RE-15', seriesName: 'مشاريع تقنية المعلومات', phaseLine: 'بدء · ينتهي 30 سبتمبر 2027', drafts: 3, reconciled: false, erp: false, team: [['سارة ح.', 'مدير المشروع'], ['مدير تجربة المتعاملين', 'الراعي'], ['منى س.', 'منسقة السجلات']] }),\n      r('PRJ-2026-001', 'نقل المقر الرئيسي — نقل السجلات', 'الموارد البشرية · مدير الخدمات المساندة', 'فاطمة ك.', 'تنفيذ', '64', 5, 9, '2027-04-01', { fileCode: 'SS-HR-PJ-001', sponsor: 'مدير الخدمات المساندة', seriesCode: 'HR-RE-12', seriesName: 'مشاريع المرافق', phaseLine: 'تنفيذ · ينتهي 1 أبريل 2027', drafts: 2, reconciled: true, erp: false, team: [['فاطمة ك.', 'مدير المشروع'], ['مدير الخدمات المساندة', 'الراعي'], ['السجلات والأرشيف', 'الأمين']] }),\n      r('PRJ-2024-007', 'أتمتة تقارير الاستثمار', 'المالية · المدير المالي', 'أحمد ب.', 'مغلق', '37', 8, 8, '2026-03-31', { fileCode: 'SS-FN-PJ-007', sponsor: 'المدير المالي', seriesCode: 'FN-RE-08', seriesName: 'مشاريع المالية', phaseLine: 'مغلق · 31 مارس 2026', drafts: 0, reconciled: true, erp: true, team: [['أحمد ب.', 'مدير المشروع'], ['المدير المالي', 'الراعي']] }),\n    ];\n    const p = all.find(x => x.code === sel) || all[0];\n    const closed = p.phase === 'مغلق';\n    const tabIds = [['active', 'نشطة · 3'], ['closing', 'قيد الإغلاق · 1'], ['closed', 'مغلقة · 1']];\n    const rows = all.filter(x => GROUP[x.phase] === tab).map(x => ({ ...x, bg: x.code === p.code ? '#F4FAF7' : '#FFFFFF', pressed: x.code === p.code ? 'true' : 'false', pick: () => this.setState({ sel: x.code }) }));\n    const segIds = [['register', 'السجل'], ['team', 'الفريق'], ['close', 'الإغلاق']];\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      onNew: () => this.say('أُنشئت مسودة المشروع PRJ-2026-005 · أضف راعياً للمتابعة'),\n      onSignoff: () => { if (closed) { this.say('تم اعتماد ' + p.name + ' مسبقاً'); return; } this.setState({ asked: { ...asked, [p.code]: true } }); this.say('أُرسل طلب الاعتماد إلى ' + p.sponsor); },\n      tabs: tabIds.map(([id, label]) => ({ label, sel: tab === id ? 'true' : 'false', line: tab === id ? '#269D6A' : 'transparent', weight: tab === id ? 700 : 400, fg: tab === id ? '#003234' : '#3D5F60', pick: () => this.setState({ tab: id }) })),\n      segs: segIds.map(([id, label]) => ({ label, sel: seg === id ? 'true' : 'false', bg: seg === id ? '#FFFFFF' : 'transparent', fg: seg === id ? '#003234' : '#3D5F60', weight: seg === id ? 700 : 400, pick: () => this.setState({ seg: id }) })),\n      showRegister: seg === 'register', showTeam: seg === 'team', showClose: seg === 'close',\n      kpis: [\n        { label: 'المشاريع النشطة', n: '3', sub: 'في مرحلتي البدء والتنفيذ', icon: 'project', tone: 'default', href: '' },\n        { label: 'تُغلق خلال 60 يوماً', n: '1', sub: 'ترقية نظام ERP · ينتهي 15 ديسمبر 2026', icon: 'calendar', tone: 'default', href: '' },\n        { label: 'الوثائق', n: '742', sub: 'محفوظة في 5 ملفات مشاريع', icon: 'doc', tone: 'default', href: '' },\n        { label: 'مخرجات مفتوحة', n: '19', sub: 'بانتظار القبول', icon: 'tasks', tone: 'default', href: '' },\n        { label: 'أُغلقت هذا العام', n: '1', sub: 'أتمتة تقارير الاستثمار · 31 مارس 2026', icon: 'archive', tone: 'default', href: '' },\n      ],\n      rows, noRows: rows.length === 0, emptyText: 'لا توجد مشاريع في هذه المرحلة',\n      p,\n      register: [{ k: 'الوثائق المحفوظة', v: p.docs }, { k: 'المخرجات المقبولة', v: p.del }, { k: 'مسودات مفتوحة', v: String(p.drafts) }, { k: 'رمز الملف', v: p.fileCode }],\n      team: p.team.map(([who, role]) => ({ who, role })),\n      checks: [c('قبول جميع المخرجات', p.done === p.total, p.done + ' / ' + p.total), c('لا توجد مسودات متبقية', p.drafts === 0, p.drafts ? p.drafts + ' مسودات' : ''), c('مطابقة السجل', p.reconciled, ''), c('إغلاق المشروع في ERP', p.erp, p.erp ? '' : 'مفتوح'), c('اعتماد الراعي', closed || !!asked[p.code], closed ? 'معتمد' : (asked[p.code] ? 'طُلب' : 'لم يُطلب'))],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1000}}});
</script>
