 background: #003234; text-decoration: none\">Change summary R3 → R4.docx<\/a>\n<a href=\"DocumentDark.html\" style=\"padding: 4px 10px; border-radius: 8px; background: #003234; text-decoration: none\">CISO review note.pdf<\/a>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"idx-h\" style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px\">\n<h2 id=\"idx-h\" style=\"margin: 0 0 14px; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">Index to verify<\/h2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px\">\n<sc-for list=\"{{index}}\" as=\"f\" hint-placeholder-count=\"6\">\n<div style=\"display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 10px; background: {{f.bg}}\">\n<span style=\"width: 22px; height: 22px; flex: 0 0 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: {{f.dot}}; color: #FFFFFF\">{{f.mark}}<\/span>\n<div><div style=\"font-size: 12px; color: #BFD0CC\">{{f.k}}<\/div><div style=\"font-weight: 700\">{{f.v}}<\/div><div style=\"font-size: 12px; color: {{f.noteFg}}\">{{f.note}}<\/div><\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"his-h\" style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px\">\n<h2 id=\"his-h\" style=\"margin: 0 0 12px; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">History<\/h2>\n<sc-for list=\"{{history}}\" as=\"h\" hint-placeholder-count=\"4\">\n<div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid #0B5048; font-size: 13px\"><span style=\"color: #BFD0CC\">{{h.when}}<\/span><span><strong>{{h.who}}<\/strong> · {{h.what}}<\/span><\/div>\n<\/sc-for>\n<\/section>\n<\/div>\n\n<div style=\"flex: 2 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<section aria-labelledby=\"rt-h\" style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<div><h2 id=\"rt-h\" style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">Route<\/h2><div style=\"font-size: 12px; color: #BFD0CC\">From delegation-of-authority matrix DoA-2026 §4.2 · rule R2<\/div><\/div>\n<sc-for list=\"{{route}}\" as=\"r\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; gap: 12px; align-items: center\"><span style=\"width: 28px; height: 28px; border-radius: 14px; flex: 0 0 28px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: {{r.bg}}; color: {{r.fg}}\">{{r.n}}<\/span><div style=\"flex: 1\"><div style=\"font-weight: 700\">{{r.role}}<\/div><div style=\"font-size: 12px; color: #BFD0CC\">{{r.who}}<\/div><\/div><span style=\"font-size: 12px; color: #BFD0CC\">{{r.when}}<\/span><\/div>\n<\/sc-for>\n<\/section>\n\n<sc-if value=\"{{open}}\" hint-placeholder-val=\"{{ true }}\">\n<form aria-labelledby=\"dec-h\" style=\"background: #00453F; border-radius: 12px; border: 2px solid #269D6A; padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n<h2 id=\"dec-h\" style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">Your decision<\/h2>\n<fieldset style=\"border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px\">\n<legend style=\"font-size: 13px; font-weight: 700; margin-bottom: 8px\">Outcome<\/legend>\n<sc-for list=\"{{outcomes}}\" as=\"o\" hint-placeholder-count=\"4\">\n<label style=\"display: flex; gap: 10px; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid {{o.border}}; background: {{o.bg}}; cursor: pointer\"><input type=\"radio\" name=\"outcome\" checked=\"{{o.on}}\" onChange=\"{{o.pick}}\" style=\"accent-color: #7DC4A6; width: 18px; height: 18px; cursor: pointer\"><span style=\"font-weight: 700\">{{o.label}}<\/span><\/label>\n<\/sc-for>\n<\/fieldset>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"t-reason\" style=\"font-size: 13px; font-weight: 700\">Reason code <span style=\"font-weight: 400; color: #BFD0CC\">· required to return or reject<\/span><\/label>\n<select id=\"t-reason\" style=\"height: 44px; border-radius: 10px; border: 1px solid #2E6E64; padding: 0 12px; font: inherit; background: #00453F; color: #FFFFFF\"><option>Choose a reason<\/option><option>Wrong series<\/option><option>Confidentiality too low<\/option><option>Missing pages<\/option><option>Duplicate of existing record<\/option><\/select>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"t-del\" style=\"font-size: 13px; font-weight: 700\">Delegate to <span style=\"font-weight: 400; color: #BFD0CC\">· optional<\/span><\/label>\n<input id=\"t-del\" placeholder=\"Search a colleague\" style=\"height: 44px; border-radius: 10px; border: 1px solid #2E6E64; padding: 0 12px; font: inherit; color: #FFFFFF\">\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"t-com\" style=\"font-size: 13px; font-weight: 700\">Comment <span style=\"font-weight: 400; color: #BFD0CC\">· visible to originator<\/span><\/label>\n<textarea id=\"t-com\" rows=\"3\" style=\"border-radius: 10px; border: 1px solid #2E6E64; padding: 10px 12px; font: inherit; color: #FFFFFF; resize: vertical\">Reviewed with the CISO note. Approved for issue.<\/textarea>\n<\/div>\n<button type=\"button\" style=\"height: 48px; border-radius: 10px; border: 0; background: #67BA97; color: #003234; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{onSubmit}}\">Submit decision<\/button>\n<span style=\"font-size: 12px; color: #BFD0CC\">On approve the record is coded, filed to IT-RE-12 and declared. The decision is written to K2 and the audit warehouse.<\/span>\n<\/form>\n<\/sc-if>\n<sc-if value=\"{{closed}}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"closed-h\" style=\"background: #00453F; border-radius: 12px; border: 2px solid #269D6A; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; gap: 10px; align-items: center\"><span aria-hidden=\"true\" style=\"width: 28px; height: 28px; flex: 0 0 28px; border-radius: 14px; background: #269D6A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700\">✓<\/span><h2 id=\"closed-h\" style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">Task closed<\/h2><\/div>\n<div style=\"font-size: 13px; color: #BFD0CC\">{{closedLabel}}<\/div>\n<p style=\"margin: 0\">{{closedText}}<\/p>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<a href=\"ApprovalsDark.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; background: #67BA97; color: #003234; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">Back to inbox<\/a>\n<a href=\"DocumentDark.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #4F8A7E; background: #00453F; color: #FFFFFF; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">View record<\/a>\n<\/div>\n<\/section>\n<\/sc-if>\n<\/div>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #005F4F; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { outcome: 0, page: 1, closed: false }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const ok = (k, v, note) => ({ k, v, note, mark: '✓', dot: '#269D6A', bg: '#0B4A40', noteFg: '#7DC4A6' });\n    const chk = (k, v, note) => ({ k, v, note, mark: '!', dot: '#976F30', bg: '#403516', noteFg: '#F3BF6D' });\n    const st = this.state;\n    const TEXTS = ['Approved · SS-IT-PY-02-R4 moves to the information owner for step 2 of 2. The decision is written to K2 and the audit warehouse.', 'Approved with index change · the corrected index travels with the task to the information owner for step 2 of 2.', 'Returned to Abeer A. with your reason code and comment. The task reopens in her inbox.', 'Rejected · Abeer A. is notified and the draft stays in Drop-off. Nothing was filed.'];\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      page: String(st.page), open: !st.closed, closed: st.closed,\n      onPrev: () => this.setState({ page: Math.max(1, this.state.page - 1) }),\n      onNext: () => this.setState({ page: Math.min(14, this.state.page + 1) }),\n      onSubmit: () => { this.setState({ closed: true }); this.say('Decision sent to K2 · task closed'); },\n      closedText: TEXTS[st.outcome],\n      index: [\n        ok('Record series', 'IT-RE-12 · IT policies', 'Verified'),\n        ok('Function › activity › process', 'Support services › IT › Policy', 'Verified'),\n        chk('Confidentiality', 'Sensitive', 'Check this · R3 was Sensitive, CISO suggests Confidential'),\n        ok('Retention', '5 yrs active + 10 yrs archive · appraise', 'Bound from series'),\n        ok('Information owner', 'Khalid Al Mazrouei · Head of IT', 'Verified'),\n        chk('OCR quality', 'Low on pages 9, 12', 'Check this before approving'),\n      ],\n      history: (st.closed ? [{ when: '06 Nov · now', who: 'Khalid Al Mazrouei', what: 'Decision recorded · ' + ['Approve', 'Approve with index change', 'Return to originator', 'Reject'][st.outcome] }] : []).concat([\n        { when: '28 Sep · 09:15', who: 'K2', what: 'Task assigned · Head of IT' },\n        { when: '28 Sep · 09:14', who: 'DAS ID provider', what: 'Serial reserved SS-IT-PY-02' },\n        { when: '28 Sep · 09:12', who: 'Abeer A.', what: 'Index confirmed and submitted from Capture' },\n        { when: '27 Sep · 16:02', who: 'Abeer A.', what: 'Uploaded from OneDrive — Abeer' },\n      ]),\n      route: [\n        { n: '0', role: 'Originator', who: 'Abeer A.', when: 'Submitted', bg: '#269D6A', fg: '#FFFFFF' },\n        { n: '1', role: 'Head of division', who: 'Khalid Al Mazrouei · 16 h', when: st.closed ? 'Decided' : 'Now', bg: '#005F4F', fg: '#FFFFFF' },\n        { n: '2', role: 'Information owner', who: 'DAS-InfoOwners · 24 h', when: 'Next', bg: '#005F4F', fg: '#FFFFFF' },\n        { n: '✓', role: 'Code · file · declare', who: 'Automatic', when: 'On approve', bg: '#005F4F', fg: '#FFFFFF' },\n      ],\n      outcomes: ['Approve', 'Approve with index change', 'Return to originator', 'Reject'].map((label, k) => ({ label, on: st.outcome === k, border: st.outcome === k ? '#269D6A' : '#005F4F', bg: st.outcome === k ? '#0B4A40' : '#00453F', pick: () => this.setState({ outcome: k }) })),\n      closedLabel: 'Outcome: ' + ['Approve', 'Approve with index change', 'Return to originator', 'Reject'][st.outcome],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1400}}});
