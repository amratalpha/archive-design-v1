tton\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #4F8A7E; background: #00453F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{onConfigure}}\">Configure<\/button><\/div>\n<\/div>\n<div style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px; display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-weight: 700; margin-bottom: 6px\">Exception queue · {{excCount}}<\/span>\n<sc-for list=\"{{exceptions}}\" as=\"e\" hint-placeholder-count=\"3\">\n<div style=\"padding: 10px 0; border-top: 1px solid #0B5048; display: flex; flex-direction: column; gap: 4px; font-size: 13px\">\n<div style=\"display: flex; justify-content: space-between\"><span style=\"font-family: 'Roboto Mono',Consolas,monospace; font-weight: 700\">{{e.job}} · {{e.iface}}<\/span><span style=\"color: #BFD0CC\">{{e.retries}} retries<\/span><\/div>\n<span style=\"color: #F09A8A\">{{e.err}}<\/span>\n<div style=\"display: flex; gap: 12px\"><button type=\"button\" onClick=\"{{e.retry}}\" style=\"padding: 0; border: 0; background: transparent; font: inherit; font-weight: 700; color: #7DC4A6; text-decoration: underline; cursor: pointer\">Retry<\/button><button type=\"button\" onClick=\"{{e.send}}\" style=\"padding: 0; border: 0; background: transparent; font: inherit; font-weight: 700; color: #7DC4A6; text-decoration: underline; cursor: pointer\">Send to originator<\/button><\/div>\n<\/div>\n<\/sc-for>\n<sc-if value=\"{{noExc}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding: 10px 0; border-top: 1px solid #0B5048; font-size: 13px; color: #BFD0CC\">Exception queue is clear<\/div><\/sc-if>\n<\/div>\n<\/aside>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; backg el: 'Exception queue', n: String(n), sub: 'Failed jobs awaiting retry', icon: 'hourglass', tone: n ? 'alert' : 'default', href: '' },\n      ],\n      runAllMsg: '4 connectors due · runs queued',\n      addMsg: 'New channel draft created · pick a connector type to configure',\n      runMsg: (x) => x + ' run started · last run updated',\n      testMsg: (x) => x + ' · connection test passed in 0.8 s',\n      confMsg: (x) => x + ' settings opened · changes are logged to SIEM',\n      disabledMsg: (x) => x + ' is disabled · enable it in Configure first',\n      retryMsg: (j) => j + ' re-queued for retry',\n      sendMsg: (j) => j + ' sent back to the originator',\n      connectors: [\n        ['ad', 'Active Directory · IDM (Salahyati)', 'In', '612', '08:50', 'Healthy', '0', '100 %'],\n        ['erp', 'Oracle ERP', 'Both', '188', '08:45', 'Degraded', '6', '97 %'],\n        ['k2', 'K2 workflow platform', 'Both', '1,204', '08:52', 'Healthy', '2', '99.8 %'],\n        ['fs', 'File servers · shares', 'In', '2,310', '08:30', 'Healthy', '1', '99.9 %'],\n        ['sp', 'Existing SharePoint farms', 'In', '—', '07:00', 'Running', '0', '—'],\n        ['ex', 'Exchange', 'In', '22', '08:48', 'Healthy', '0', '100 %'],\n        ['na', 'National Archives', 'Out', '0', 'Yesterday', 'Healthy', '0', '100 %'],\n        ['siem', 'SIEM', 'Out', '48,120', '08:52', 'Healthy', '0', '100 %'],\n        ['gd', 'Google Drive · Corp Comm shared drive', 'In', '17', '08:40', 'Healthy', '0', '100 %'],\n        ['sftp', 'SFTP · insurer batch drop', 'In', '—', '12 Oct', 'Disabled', '0', '—'],\n        ['ocr', 'OCR · PDF/A rendition engine', 'Both', '64', '08:51', 'Healthy', '1', '98.4 %'],\n      ],\n      exceptions: [\n        { job: 'J-20481', iface: 'ERP', retries: 3, err: 'PO-2026-04471 · DOC_CLASS \"SVC-AGR\" has no series mapping' },\n        { job: 'J-20477', iface: 'OCR', retries: 1, err: 'Page 9 confidence 0.42 — re-scan required' },\n        { job: 'J-20470', iface: 'SMB', retries: 2, err: 'Path exceeds 400 characters' },\n      ],\n      flows: [\n        { src: 'Active Directory · IDM', dst: 'DAS', what: 'Users, groups, org units', when: 'Every 15 min' },\n        { src: 'Oracle ERP', dst: 'DAS', what: 'POs, invoices, contracts · DOC_CLASS → series', when: 'Every 15 min' },\n        { src: 'DAS', dst: 'Oracle ERP', what: 'Archive code back on the transaction', when: 'On declare' },\n        { src: 'K2 workflow platform', dst: 'DAS', what: 'Approval tasks and decisions', when: 'Real time' },\n        { src: 'File servers · shares', dst: 'DAS Drop-off', what: 'New files in watched shares', when: 'Hourly' },\n        { src: 'Existing SharePoint farms', dst: 'DAS', what: 'Migration waves', when: 'Nightly 07:00' },\n        { src: 'Exchange', dst: 'DAS', what: 'Emails filed from Outlook', when: 'Real time' },\n        { src: 'DAS', dst: 'National Archives', what: 'Permanent records transfer', when: 'On transfer batch' },\n        { src: 'DAS', dst: 'SIEM', what: 'Audit events', when: 'Streaming' },\n        { src: 'DAS', dst: 'OCR · PDF/A engine', what: 'Scans for OCR and PDF/A rendition', when: 'On capture' },\n      ],\n      mapping: [\n        { src: 'Oracle ERP', from: 'DOC_CLASS = CONTRACT', to: 'Series IT-RE-10 · IT contracts register', status: 'Mapped', bg: ok[0], fg: ok[1] },\n        { src: 'Oracle ERP', from: 'DOC_CLASS = SVC-AGR', to: 'No series', status: 'Unmapped', bg: bad[0], fg: bad[1] },\n        { src: 'Oracle ERP', from: 'PO_NUMBER', to: 'ERP reference', status: 'Mapped', bg: ok[0], fg: ok[1] },\n        { src: 'Active Directory', from: 'department', to: 'Sector · division', status: 'Mapped', bg: ok[0], fg: ok[1] },\n        { src: 'Active Directory', from: 'memberOf DAS-SS-IT-Heads', to: 'Role · Head of division', status: 'Mapped', bg: ok[0], fg: ok[1] },\n        { src: 'SharePoint 2013', from: 'ContentType = Contract', to: 'Document type · Contract', status: 'Review', bg: warn[0], fg: warn[1] },\n      ],\n      migration: [\n        { wave: 'Wave 1', src: 'TalkSPS (SharePoint 2013)', items: '128,400', prog: '100 %', status: 'Completed', bg: ok[0], fg: ok[1] },\n        { wave: 'Wave 2', src: 'HR site collection', items: '46,210', prog: '62 %', status: 'Running', bg: ok[0], fg: ok[1] },\n        { wave: 'Wave 3', src: 'Finance file shares', items: '88,900', prog: '0 %', status: 'Scheduled', bg: warn[0], fg: warn[1] },\n        { wave: 'Wave 4', src: 'Corp Comm Google Drive', items: '9,340', prog: '0 %', status: 'Not started', bg: grey[0], fg: grey[1] },\n      ],\n      runlog: [\n        { job: 'J-20489', iface: 'K2 workflow platform', start: '08:52', items: '1,204', status: 'Succeeded', bg: ok[0], fg: ok[1] },\n        { job: 'J-20488', iface: 'SIEM', start: '08:52', items: '48,120', status: 'Succeeded', bg: ok[0], fg: ok[1] },\n        { job: 'J-20486', iface: 'OCR · PDF/A rendition engine', start: '08:51', items: '64', status: 'Succeeded', bg: ok[0], fg: ok[1] },\n        { job: 'J-20481', iface: 'Oracle ERP', start: '08:45', items: '188', status: 'Partial · 6 errors', bg: warn[0], fg: warn[1] },\n        { job: 'J-20477', iface: 'OCR · PDF/A rendition engine', start: '08:31', items: '12', status: 'Partial · 1 error', bg: warn[0], fg: warn[1] },\n        { job: 'J-20470', iface: 'File servers · shares', start: '08:30', items: '2,310', status: 'Partial · 1 error', bg: warn[0], fg: warn[1] },\n      ],\n    };\n    const st = this.state || {};\n    const tab = st.tab || 'connectors', sel = st.sel || 'erp', ran = st.ran || {}, gone = st.gone || {}, runs = st.runs || [];\n    const ST = T.ST;\n    const conns = T.connectors.map(([id, name, dir, today, last, status, errors, success]) => {\n      const s = ST[status];\n      return { id, name, dir, today, errors, success, status, last: ran[id] ? T.justNow : last, fg: s[0], dot: s[1], badgeBg: s[2], badgeFg: s[3], border: s[4], bg: id === sel ? '#403516' : '#00453F', pressed: id === sel ? 'true' : 'false', pick: () => this.setState({ sel: id }) };\n    });\n    const sc = conns.find(x => x.id === sel) || conns[1];\n    const disabled = sc.status === T.disabledName;\n    const exceptions = T.exceptions.filter(e => !gone[e.job]).map(e => ({ ...e,\n      retry: () => { this.setState({ gone: { ...gone, [e.job]: true } }); this.say(T.retryMsg(e.job)); },\n      send: () => { this.setState({ gone: { ...gone, [e.job]: true } }); this.say(T.sendMsg(e.job)); } }));\n    const n = exceptions.length;\n    const ids = ['connectors', 'flows', 'exc', 'map', 'mig', 'log'];\n    const labels = T.tabLabels(n);\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      onRunAll: () => this.say(T.runAllMsg), onAdd: () => this.say(T.addMsg),\n      onRun: () => {\n        if (disabled) { this.say(T.disabledMsg(sc.name)); return; }\n        this.setState({ ran: { ...ran, [sc.id]: true }, runs: [{ job: 'J-' + (20490 + runs.length), iface: sc.name, start: T.justNow, items: '—', status: T.runningName, bg: '#094C41', fg: '#7DC4A6' }, ...runs] });\n        this.say(T.runMsg(sc.name));\n      },\n      onTest: () => this.say(disabled ? T.disabledMsg(sc.name) : T.testMsg(sc.name)),\n      onConfigure: () => this.say(T.confMsg(sc.name)),\n      kpis: T.kpis(n),\n      tabs: ids.map((id, i) => ({ label: labels[i], sel: tab === id ? 'true' : 'false', line: tab === id ? '#269D6A' : 'transparent', weight: tab === id ? 700 : 400, fg: tab === id ? '#FFFFFF' : '#BFD0CC', pick: () => this.setState({ tab: id }) })),\n      showConnectors: tab === 'connectors', showFlows: tab === 'flows', showExc: tab === 'exc', showMap: tab === 'map', showMig: tab === 'mig', showLog: tab === 'log',\n      connectors: conns, sc, exceptions, excCount: String(n), noExc: n === 0,\n      flows: T.flows, mapping: T.mapping, migration: T.migration, runlog: [...runs, ...T.runlog],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1100}}});
