DCRun(window.DAS_COMPONENTS, {"name": "Share", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Roboto',system-ui,sans-serif; font-size: 14px; line-height: 1.45\">\n<dc-import name=\"Sidebar\" active=\"search\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"Share\" crumb=\"SS-IT-RE-041 / Share\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<a href=\"Document.html\" style=\"font-weight: 700; font-size: 13px; text-decoration: none\">← Back to document<\/a>\n<div><div style=\"font-size: 13px; color: #4A6B6C\">SS-IT-RE-041 · IT vendor performance report · Open<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 32px\">External sharing request<\/h1><\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<sc-if value=\"{{open}}\" hint-placeholder-val=\"{{ true }}\">\n<form aria-label=\"Sharing request\" style=\"flex: 3 1 480px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"sh-mail\" style=\"font-size: 13px; font-weight: 700\">Recipient e-mail<\/label><input id=\"sh-mail\" type=\"email\" value=\"account.manager@vendorx.ae\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234\"><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"sh-org\" style=\"font-size: 13px; font-weight: 700\">Recipient organisation<\/label><input id=\"sh-org\" value=\"Vendor X\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234\"><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"sh-exp\" style=\"font-size: 13px; font-weight: 700\">Expiry date<\/label><input id=\"sh-exp\" value=\"2026-11-20\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234\"><span style=\"font-size: 12px; color: #4A6B6C\">Maximum 30 days<\/span><\/div>\n<\/div>\n<fieldset style=\"border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px\">\n<legend style=\"font-size: 13px; font-weight: 700; margin-bottom: 8px\">Permission<\/legend>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px\">\n<label style=\"display: flex; gap: 12px; padding: 14px; border-radius: 10px; border: {{p1.border}}; background: {{p1.bg}}; cursor: pointer\"><input type=\"radio\" name=\"perm\" checked=\"{{p1.on}}\" onClick=\"{{p1.pick}}\" style=\"accent-color: #005F4F; width: 18px; height: 18px\"><span><strong>View only<\/strong><span style=\"display: block; font-size: 12px; color: #4A6B6C\">Watermarked browser view<\/span><\/span><\/label>\n<label style=\"display: flex; gap: 12px; padding: 14px; border-radius: 10px; border: {{p2.border}}; background: {{p2.bg}}; cursor: pointer\"><input type=\"radio\" name=\"perm\" checked=\"{{p2.on}}\" onClick=\"{{p2.pick}}\" style=\"accent-color: #005F4F; width: 18px; height: 18px\"><span><strong>Download · IRM<\/strong><span style=\"display: block; font-size: 12px; color: #4A6B6C\">Protected file, expires with the link<\/span><\/span><\/label>\n<\/div>\n<\/fieldset>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"sh-why\" style=\"font-size: 13px; font-weight: 700\">Justification<\/label><textarea id=\"sh-why\" rows=\"4\" style=\"border-radius: 10px; border: 1px solid #CCC9B4; padding: 10px 12px; font: inherit; color: #003234\">Quarterly performance review with the vendor, as required by contract SS-IT-CR-118 §9.<\/textarea><\/div>\n<div style=\"display: flex; justify-content: flex-end; gap: 8px\">\n<a href=\"Document.html\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; color: #005F4F; font-weight: 700; display: inline-flex; align-items: center\">Cancel<\/a>\n<button type=\"button\" onClick=\"{{onSubmit}}\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">Submit for approval<\/button>\n<\/div>\n<\/form>\n<\/sc-if>\n<sc-if value=\"{{done}}\" hint-placeholder-val=\"{{ false }}\">\n<section role=\"status\" aria-label=\"Sharing request submitted\" style=\"flex: 3 1 480px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; border-top: 4px solid #269D6A; padding: 24px; display: flex; flex-direction: column; gap: 12px\">\n<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#269D6A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<h2 style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 22px\">Sharing request submitted<\/h2>\n<p style=\"margin: 0; color: #4A6B6C\">SS-IT-RE-041 is waiting on the Head of IT (16 h), then the information owner (24 h). Vendor X receives the link only after both approve.<\/p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<a href=\"Approvals.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; background: #005F4F; color: #FFFFFF\">Open my approvals<\/a>\n<a href=\"Document.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; border: 1px solid #B2C4BE; color: #003234\">Back to document<\/a>\n<\/div>\n<\/section>\n<\/sc-if>\n\n<aside aria-labelledby=\"ctl-h\" style=\"flex: 2 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"background: #003234; color: #FFFFFF; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n<h2 id=\"ctl-h\" style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">Controls applied<\/h2>\n<ul style=\"margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: rgba(255,255,255,.9)\">\n<li>Approved by Head of IT, then the information owner<\/li><li>Link expires automatically on the expiry date<\/li><li>Every open is logged to the audit warehouse and SIEM<\/li><li>Secret records can never be shared externally<\/li>\n<\/ul>\n<\/div>\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-weight: 700\">Route<\/span>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px\"><span style=\"padding: 3px 10px; border-radius: 999px; background: #E2F1EA; color: #005F4F; font-weight: 700\">Head of IT · 16 h<\/span><span aria-hidden=\"true\">→<\/span><span style=\"padding: 3px 10px; border-radius: 999px; background: #E2F1EA; color: #005F4F; font-weight: 700\">Information owner · 24 h<\/span><\/div>\n<\/div>\n<\/aside>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { perm: 'view', done: false }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const perm = st.perm || 'view';\n    const p = id => ({ on: perm === id, border: perm === id ? '2px solid #269D6A' : '1px solid #DCE3E0', bg: perm === id ? '#F4FAF7' : '#FFFFFF', pick: () => this.setState({ perm: id }) });\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      p1: p('view'), p2: p('irm'),\n      open: !st.done, done: !!st.done,\n      onSubmit: () => { this.setState({ done: true }); this.say('Request sent to Head of IT for approval'); },\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1000}}});
</script>
