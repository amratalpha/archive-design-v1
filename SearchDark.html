<!doctype html>

<div id="dc-root"></div>
<script>
DCRun(window.DAS_COMPONENTS, {"name": "SearchDark", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #003234; color: #FFFFFF; font-family: 'Roboto',system-ui,sans-serif; font-size: 14px; line-height: 1.45\">\n<dc-import name=\"SidebarDark\" active=\"search\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"TopbarDark\" page=\"Search\" crumb=\"Search\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<section aria-labelledby=\"s-h\" style=\"background: #005F4F; color: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<h1 id=\"s-h\" style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 28px\">Search centre<\/h1>\n<form role=\"search\" style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<label for=\"s-q\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Search titles, codes and full text<\/label>\n<div style=\"flex: 1 1 420px; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 12px; background: #00453F\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#BFD0CC\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5\"><\/path><\/svg>\n<input id=\"s-q\" value=\"information security policy\" style=\"flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; color: #FFFFFF\">\n<span style=\"font-size: 12px; color: #BFD0CC; border: 1px solid #2E6E64; border-radius: 4px; padding: 0 6px\">/<\/span>\n<\/div>\n<button type=\"button\" onClick=\"{{onSearch}}\" style=\"height: 52px; padding: 0 24px; border-radius: 12px; border: 0; background: #269D6A; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer\">Search<\/button>\n<\/form>\n<div style=\"font-size: 13px; color: rgba(255,255,255,.82)\">Titles, codes and full text in Arabic and English. Security-trimmed at query time: you only see what your groups allow.<\/div>\n<\/section>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<aside aria-label=\"Refiners\" style=\"flex: 1 1 240px; max-width: 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<sc-for list=\"{{refiners}}\" as=\"g\" hint-placeholder-count=\"4\">\n<fieldset style=\"margin: 0; background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\">\n<legend style=\"font-weight: 700; padding: 0 4px; margin-inline-start: -4px\">{{g.title}}<\/legend>\n<sc-for list=\"{{g.opts}}\" as=\"o\" hint-placeholder-count=\"3\">\n<label style=\"display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 13px\"><input type=\"checkbox\" checked=\"{{o.on}}\" style=\"width: 16px; height: 16px; accent-color: #7DC4A6\"><span style=\"flex: 1\">{{o.label}}<\/span><span style=\"color: #BFD0CC\">{{o.n}}<\/span><\/label>\n<\/sc-for>\n<\/fieldset>\n<\/sc-for>\n<div style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 13px\">\n<span style=\"font-weight: 700\">Saved searches<\/span>\n<button type=\"button\" onClick=\"{{onSaved1}}\" style=\"align-self: flex-start; padding: 0; border: 0; background: transparent; font: inherit; color: #7DC4A6; text-decoration: underline; text-align: start; cursor: pointer\">IT policies due for review<\/button><button type=\"button\" onClick=\"{{onSaved2}}\" style=\"align-self: flex-start; padding: 0; border: 0; background: transparent; font: inherit; color: #7DC4A6; text-decoration: underline; text-align: start; cursor: pointer\">Confidential contracts on hold<\/button>\n<span style=\"font-weight: 700; margin-top: 6px\">Recent<\/span>\n<span style=\"color: #BFD0CC\">\"CAB minutes\" · \"Emirates Data Centre\"<\/span>\n<\/div>\n<\/aside>\n\n<section aria-labelledby=\"res-h\" style=\"flex: 999 1 560px; min-width: 0; background: #00453F; border-radius: 12px; border: 1px solid #005F4F\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px 20px; border-bottom: 1px solid #005F4F\">\n<h2 id=\"res-h\" style=\"margin: 0; font-size: 15px; font-weight: 700\">Results: 5<\/h2>\n<sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"2\">\n<span style=\"display: inline-flex; gap: 6px; align-items: center; padding: 4px 6px 4px 12px; border-radius: 999px; background: #094C41; color: #7DC4A6; font-size: 12px; font-weight: 700\">{{c.label}} <button type=\"button\" aria-label=\"{{c.aria}}\" onClick=\"{{c.remove}}\" style=\"width: 22px; height: 22px; border-radius: 11px; border: 0; background: transparent; color: #7DC4A6; font-weight: 700; cursor: pointer\">×<\/button><\/span>\n<\/sc-for>\n<sc-if value=\"{{noChips}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 13px; color: #BFD0CC\">{{noChipsText}}<\/span><\/sc-if>\n<sc-if value=\"{{hasChips}}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" onClick=\"{{onClear}}\" style=\"padding: 0; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 700; color: #7DC4A6; text-decoration: underline; cursor: pointer\">Clear all<\/button><\/sc-if>\n<span style=\"flex: 1\"><\/span>\n<label for=\"s-sort\" style=\"font-size: 13px; color: #BFD0CC\">Sort by<\/label>\n<select id=\"s-sort\" style=\"height: 38px; border-radius: 8px; border: 1px solid #2E6E64; padding: 0 10px; font: inherit; background: #00453F; color: #FFFFFF\"><option>Newest<\/option><option>Date archived<\/option><option>Code<\/option><\/select>\n<\/div>\n<div style=\"display: flex; flex-direction: column\">\n<sc-for list=\"{{results}}\" as=\"r\" hint-placeholder-count=\"5\">\n<a href=\"DocumentDark.html\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 16px 20px; border-bottom: 1px solid #0B5048; text-decoration: none; color: #FFFFFF\">\n<span style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0\">\n<span style=\"font-family: 'Roboto Mono',Consolas,monospace; font-size: 12px; color: #BFD0CC\">{{r.code}} · {{r.series}}<\/span>\n<span style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 16px; color: #7DC4A6\">{{r.title}}<\/span>\n<span style=\"font-size: 13px; color: #BFD0CC\">{{r.snippet}}<\/span>\n<span style=\"display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #BFD0CC\"><span>Owner {{r.owner}}<\/span><span>Archived {{r.date}}<\/span><span>Gate 1 due {{r.gate}}<\/span><span>{{r.phase}}<\/span><\/span>\n<\/span>\n<span style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 6px\">\n<span style=\"padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{r.bg}}; color: {{r.fg}}\">{{r.level}}<\/span>\n<sc-if value=\"{{r.hold}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding: 2px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1px solid #682A0A; color: #F4935E\">On hold<\/span><\/sc-if>\n<\/span>\n<\/a>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; flex-wrap: wrap; gap: 10px\">\n<button type=\"button\" onClick=\"{{onExport}}\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #4F8A7E; background: #00453F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">Export manifest (read-only package)<\/button>\n<span style=\"font-size: 13px; color: #BFD0CC\">Showing 1–5 of 5<\/span>\n<\/div>\n<\/section>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #005F4F; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = this.state || {}; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const allChips = [{ id: 'sector', label: 'Sector: SS', aria: 'Remove filter Sector SS' }, { id: 'phase', label: 'Phase: Active', aria: 'Remove filter Phase Active' }];\n    const removed = st.removed || {};\n    const chips = allChips.filter(c => !removed[c.id]).map(c => ({ ...c, remove: () => this.setState({ removed: { ...((this.state && this.state.removed) || {}), [c.id]: true } }) }));\n    const applySaved = () => { this.setState({ removed: {} }); this.say('Saved search applied'); };\n    const L = { Open: ['#094C41', '#7DC4A6'], Sensitive: ['#4A3A17', '#F3BF6D'], Confidential: ['#4D2512', '#F4935E'], Secret: ['#4F1A10', '#F09A8A'] };\n    const r = (code, title, series, phase, level, owner, date, gate, snippet, hold) => ({ code, title, series, phase, level, owner, date, gate, snippet, hold: !!hold, bg: L[level][0], fg: L[level][1] });\n    const o = (label, n, on) => ({ label, n, on: !!on });\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      chips, hasChips: chips.length > 0, noChips: chips.length === 0, noChipsText: 'No filters applied',\n      onClear: () => { this.setState({ removed: { sector: true, phase: true } }); this.say('Filters cleared'); },\n      onSaved1: applySaved, onSaved2: applySaved,\n      onSearch: () => this.say('5 results'),\n      onExport: () => this.say('Manifest exported · read-only package ready'),\n      refiners: [\n        { title: 'Phase', opts: [o('Active', 3, true), o('Intermediate', 1), o('Permanent', 1)] },\n        { title: 'Confidentiality', opts: [o('Open', 1), o('Sensitive', 2), o('Confidential', 1), o('Secret', 1)] },\n        { title: 'Document type', opts: [o('Policy', 1), o('Meeting minutes', 2), o('Contract', 1), o('Correspondence', 1)] },\n        { title: 'Sector', opts: [o('SS · Support Services', 4, true), o('DG · Director General’s Office', 1)] },\n      ],\n      results: [\n        r('SS-IT-PY-02-R3', 'Information Security Policy — Issue 3', 'IT-RE-12', 'Active', 'Sensitive', 'K. Al Mazrouei', '2024-03-15', '2029-03-15', '…the information security policy sets the controls every division applies to access, classification and…'),\n        r('SS-IT-ME-207', 'CAB meeting minutes — September', 'IT-RE-8', 'Active', 'Open', 'K. Al Mazrouei', '2026-09-28', '2031-09-28', '…change advisory board approved the security policy rollout plan for Q4…'),\n        r('SS-IT-CR-097', 'Data centre hosting agreement', 'IT-RE-10', 'Intermediate', 'Confidential', 'K. Al Mazrouei', '2021-02-10', 'On hold', '…the provider shall comply with the Fund’s information security policy and…', true),\n        r('SS-IT-CO-0871', 'Incoming — Emirates Data Centre · SLA commitments', 'IT-RE-10', 'Active', 'Sensitive', 'Abeer A.', '2026-09-21', '2031-09-21', '…commitments aligned with ADPF information security requirements…'),\n        r('DG-DG-ME-011-R1', 'Administrative Committee minutes 01-2021', 'DGP-RE-1', 'Permanent', 'Secret', 'DG Office', '2021-01-20', 'Permanent', 'Preview restricted · Secret'),\n      ],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1200}}});
</script>
</body>
</html>
