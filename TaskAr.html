ontent: center; font-size: 12px; font-weight: 700; background: {{r.bg}}; color: {{r.fg}}\">{{r.n}}<\/span><div style=\"flex: 1\"><div style=\"font-weight: 700\">{{r.role}}<\/div><div style=\"font-size: 12px; color: #4A6B6C\">{{r.who}}<\/div><\/div><span style=\"font-size: 12px; color: #4A6B6C\">{{r.when}}<\/span><\/div>\n<\/sc-for>\n<\/section>\n\n<sc-if value=\"{{open}}\" hint-placeholder-val=\"{{ true }}\">\n<form aria-labelledby=\"deca-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 2px solid #269D6A; padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n<h2 id=\"deca-h\" style=\"margin: 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\">قرارك<\/h2>\n<fieldset style=\"border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px\">\n<legend style=\"font-size: 13px; font-weight: 700; margin-bottom: 8px\">النتيجة<\/legend>\n<sc-for list=\"{{outcomes}}\" as=\"o\" hint-placeholder-count=\"4\">\n<label style=\"display: flex; gap: 10px; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid {{o.border}}; background: {{o.bg}}; cursor: pointer\"><input type=\"radio\" name=\"outcome-ar\" checked=\"{{o.on}}\" onChange=\"{{o.pick}}\" style=\"accent-color: #005F4F; width: 18px; height: 18px; cursor: pointer\"><span style=\"font-weight: 700\">{{o.label}}<\/span><\/label>\n<\/sc-for>\n<\/fieldset>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"ta-reason\" style=\"font-size: 13px; font-weight: 700\">رمز السبب <span style=\"font-weight: 400; color: #4A6B6C\">· مطلوب عند الإرجاع أو الرفض<\/span><\/label>\n<select id=\"ta-reason\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; background: #FFFFFF; color: #003234\"><option>اختر سبباً<\/option><option>سلسلة غير صحيحة<\/option><option>درجة السرية منخفضة<\/option><option>صفحات ناقصة<\/option><option>مكرر لسجل موجود<\
