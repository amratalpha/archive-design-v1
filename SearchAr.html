<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مركز البحث · DAS prototype</title>
<style>body{margin:0}</style>
<script src="das-runtime.js"></script>
<script src="components.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script>
DCRun(window.DAS_COMPONENTS, {"name": "SearchAr", "template": "\n<helmet>\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div dir=\"rtl\" style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Neue Frutiger World','Segoe UI',system-ui,sans-serif; font-size: 14px; line-height: 1.6\">\n<dc-import name=\"Sidebar\" active=\"search\" lang=\"ar\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"Search\" crumb=\"البحث\" lang=\"ar\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<section aria-labelledby=\"sa-h\" style=\"background: #003234; color: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<h1 id=\"sa-h\" style=\"margin: 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 28px\">مركز البحث<\/h1>\n<form role=\"search\" style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<label for=\"sa-q\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">ابحث في العناوين والرموز والنص الكامل<\/label>\n<div style=\"flex: 1 1 420px; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 12px; background: #FFFFFF\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#4A6B6C\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5\"><\/path><\/svg>\n<input id=\"sa-q\" value=\"سياسة أمن المعلومات\" style=\"flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; color: #003234\">\n<span style=\"font-size: 12px; color: #4A6B6C; border: 1px solid #CCC9B4; border-radius: 4px; padding: 0 6px\">/<\/span>\n<\/div>\n<button type=\"button\" onClick=\"{{onSearch}}\" style=\"height: 52px; padding: 0 24px; border-radius: 12px; border: 0; background: #269D6A; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer\">بحث<\/button>\n<\/form>\n<div style=\"font-size: 13px; color: rgba(255,255,255,.82)\">العناوين والرموز والنص الكامل بالعربية والإنجليزية. تُقيَّد النتائج وقت الاستعلام: لا ترى إلا ما تسمح به مجموعاتك.<\/div>\n<\/section>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<aside aria-label=\"عوامل التصفية\" style=\"flex: 1 1 240px; max-width: 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<sc-for list=\"{{refiners}}\" as=\"g\" hint-placeholder-count=\"4\">\n<fieldset style=\"margin: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\">\n<legend style=\"font-weight: 700; padding: 0 4px; margin-inline-start: -4px\">{{g.title}}<\/legend>\n<sc-for list=\"{{g.opts}}\" as=\"o\" hint-placeholder-count=\"3\">\n<label style=\"display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 13px\"><input type=\"checkbox\" checked=\"{{o.on}}\" style=\"width: 16px; height: 16px; accent-color: #005F4F\"><span style=\"flex: 1\">{{o.label}}<\/span><span style=\"color: #4A6B6C\">{{o.n}}<\/span><\/label>\n<\/sc-for>\n<\/fieldset>\n<\/sc-for>\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 13px\">\n<span style=\"font-weight: 700\">عمليات البحث المحفوظة<\/span>\n<button type=\"button\" onClick=\"{{onSaved1}}\" style=\"align-self: flex-start; padding: 0; border: 0; background: transparent; font: inherit; color: #005F4F; text-decoration: underline; text-align: start; cursor: pointer\">سياسات تقنية المعلومات المستحقة للمراجعة<\/button><button type=\"button\" onClick=\"{{onSaved2}}\" style=\"align-self: flex-start; padding: 0; border: 0; background: transparent; font: inherit; color: #005F4F; text-decoration: underline; text-align: start; cursor: pointer\">العقود السرية المحجوزة<\/button>\n<\/div>\n<\/aside>\n\n<section aria-labelledby=\"resa-h\" style=\"flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px 20px; border-bottom: 1px solid #E5E2CB\">\n<h2 id=\"resa-h\" style=\"margin: 0; font-size: 15px; font-weight: 700\">النتائج: 5<\/h2>\n<sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"2\">\n<span style=\"display: inline-flex; gap: 6px; align-items: center; padding: 4px 12px 4px 6px; border-radius: 999px; background: #E2F1EA; color: #005F4F; font-size: 12px; font-weight: 700\">{{c.label}} <button type=\"button\" aria-label=\"{{c.aria}}\" onClick=\"{{c.remove}}\" style=\"width: 22px; height: 22px; border-radius: 11px; border: 0; background: transparent; color: #005F4F; font-weight: 700; cursor: pointer\">×<\/button><\/span>\n<\/sc-for>\n<sc-if value=\"{{noChips}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 13px; color: #4A6B6C\">{{noChipsText}}<\/span><\/sc-if>\n<sc-if value=\"{{hasChips}}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" onClick=\"{{onClear}}\" style=\"padding: 0; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 700; color: #005F4F; text-decoration: underline; cursor: pointer\">مسح الكل<\/button><\/sc-if>\n<span style=\"flex: 1\"><\/span>\n<label for=\"sa-sort\" style=\"font-size: 13px; color: #4A6B6C\">الترتيب حسب<\/label>\n<select id=\"sa-sort\" style=\"height: 38px; border-radius: 8px; border: 1px solid #CCC9B4; padding: 0 10px; font: inherit; background: #FFFFFF; color: #003234\"><option>الأحدث<\/option><option>تاريخ الأرشفة<\/option><option>الرمز<\/option><\/select>\n<\/div>\n<div style=\"display: flex; flex-direction: column\">\n<sc-for list=\"{{results}}\" as=\"r\" hint-placeholder-count=\"5\">\n<a href=\"DocumentAr.html\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 16px 20px; border-bottom: 1px solid #F0EEE2; text-decoration: none; color: #003234\">\n<span style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0\">\n<span dir=\"ltr\" style=\"font-family: Consolas, monospace; font-size: 12px; color: #4A6B6C; text-align: right\">{{r.code}} · {{r.series}}<\/span>\n<span style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 16px; color: #005F4F\">{{r.title}}<\/span>\n<span style=\"font-size: 13px; color: #4A6B6C\">{{r.snippet}}<\/span>\n<span style=\"display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #4A6B6C\"><span>المالك {{r.owner}}<\/span><span>أُرشفت {{r.date}}<\/span><span>البوابة 1: {{r.gate}}<\/span><span>{{r.phase}}<\/span><\/span>\n<\/span>\n<span style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 6px\">\n<span style=\"padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{r.bg}}; color: {{r.fg}}\">{{r.level}}<\/span>\n<sc-if value=\"{{r.hold}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding: 2px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1px solid #682A0A; color: #682A0A\">محجوز<\/span><\/sc-if>\n<\/span>\n<\/a>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; flex-wrap: wrap; gap: 10px\">\n<button type=\"button\" onClick=\"{{onExport}}\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">تصدير البيان (حزمة للقراءة فقط)<\/button>\n<span style=\"font-size: 13px; color: #4A6B6C\">عرض 1–5 من 5<\/span>\n<\/div>\n<\/section>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = this.state || {}; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const allChips = [{ id: 'sector', label: 'القطاع: SS', aria: 'إزالة عامل القطاع' }, { id: 'phase', label: 'المرحلة: نشطة', aria: 'إزالة عامل المرحلة' }];\n    const removed = st.removed || {};\n    const chips = allChips.filter(c => !removed[c.id]).map(c => ({ ...c, remove: () => this.setState({ removed: { ...((this.state && this.state.removed) || {}), [c.id]: true } }) }));\n    const applySaved = () => { this.setState({ removed: {} }); this.say('تم تطبيق البحث المحفوظ'); };\n    const L = { 'عام': ['#E2F1EA', '#005F4F'], 'حساس': ['#FAE3BE', '#63420F'], 'سري': ['#FBDCCB', '#682A0A'], 'سري للغاية': ['#FAE5E0', '#B01C01'] };\n    const r = (code, title, series, phase, level, owner, date, gate, snippet, hold) => ({ code, title, series, phase, level, owner, date, gate, snippet, hold: !!hold, bg: L[level][0], fg: L[level][1] });\n    const o = (label, n, on) => ({ label, n, on: !!on });\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      chips, hasChips: chips.length > 0, noChips: chips.length === 0, noChipsText: 'لا توجد عوامل تصفية مطبقة',\n      onClear: () => { this.setState({ removed: { sector: true, phase: true } }); this.say('تم مسح عوامل التصفية'); },\n      onSaved1: applySaved, onSaved2: applySaved,\n      onSearch: () => this.say('5 نتائج'),\n      onExport: () => this.say('تم تصدير البيان · الحزمة للقراءة فقط جاهزة'),\n      refiners: [\n        { title: 'المرحلة', opts: [o('نشطة', 3, true), o('وسيطة', 1), o('دائمة', 1)] },\n        { title: 'درجة السرية', opts: [o('عام', 1), o('حساس', 2), o('سري', 1), o('سري للغاية', 1)] },\n        { title: 'نوع الوثيقة', opts: [o('سياسة', 1), o('محضر اجتماع', 2), o('عقد', 1), o('مراسلة', 1)] },\n        { title: 'القطاع', opts: [o('SS · الخدمات المساندة', 4, true), o('DG · مكتب المدير العام', 1)] },\n      ],\n      results: [\n        r('SS-IT-PY-02-R3', 'سياسة أمن المعلومات — الإصدار 3', 'IT-RE-12', 'نشطة', 'حساس', 'ك. المزروعي', '2024-03-15', '2029-03-15', '…تحدد سياسة أمن المعلومات الضوابط التي تطبقها كل إدارة على الوصول والتصنيف و…'),\n        r('SS-IT-ME-207', 'محضر اجتماع مجلس استشارات التغيير — سبتمبر', 'IT-RE-8', 'نشطة', 'عام', 'ك. المزروعي', '2026-09-28', '2031-09-28', '…اعتمد المجلس خطة طرح سياسة الأمن للربع الرابع…'),\n        r('SS-IT-CR-097', 'اتفاقية استضافة مركز البيانات', 'IT-RE-10', 'وسيطة', 'سري', 'ك. المزروعي', '2021-02-10', 'معلّقة بالحجز', '…يلتزم المزوّد بسياسة أمن المعلومات في الصندوق و…', true),\n        r('SS-IT-CO-0871', 'وارد — مركز الإمارات للبيانات · التزامات مستوى الخدمة', 'IT-RE-10', 'نشطة', 'حساس', 'عبير أ.', '2026-09-21', '2031-09-21', '…التزامات متوافقة مع متطلبات أمن المعلومات في الصندوق…'),\n        r('DG-DG-ME-011-R1', 'محضر اللجنة الإدارية 01-2021', 'DGP-RE-1', 'دائمة', 'سري للغاية', 'مكتب المدير العام', '2021-01-20', 'دائم', 'المعاينة مقيّدة · سري للغاية'),\n      ],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1200}}});
</script>
</body>
</html>
