<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disposition · appraisal · DAS prototype</title>

<script src="components.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script>
DCRun(window.DAS_COMPONENTS, {"name": "Disposition", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Roboto',system-ui,sans-serif; font-size: 14px; line-height: 1.45\">\n<dc-import name=\"Sidebar\" active=\"disposition\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"Disposition\" crumb=\"Disposition\" persona=\"rashed\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div><div style=\"font-size: 13px; color: #4A6B6C\">Disposition cycle 2026-Q3 · opened 01 Sep · committee of 5 · quorum 3<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 32px\">Appraisal<\/h1><\/div>\n\n<ol aria-label=\"Cycle steps\" style=\"list-style: none; margin: 0; padding: 18px 20px; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; display: flex; flex-wrap: wrap; gap: 10px\">\n<sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"6\">\n<li aria-current=\"{{s.cur}}\" style=\"flex: 1 1 140px; display: flex; align-items: center; gap: 10px; font-weight: {{s.weight}}; color: {{s.fg}}\"><span style=\"width: 30px; height: 30px; flex: 0 0 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: {{s.bg}}; color: {{s.dotFg}}\">{{s.mark}}<\/span>{{s.label}}<\/li>\n<\/sc-for>\n<\/ol>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n<sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"4\">\n<dc-import name=\"StatTile\" label=\"{{k.label}}\" value=\"{{k.n}}\" sub=\"{{k.sub}}\" icon=\"{{k.icon}}\" tone=\"{{k.tone}}\" href=\"{{k.href}}\" hint-size=\"100%,146px\"><\/dc-import>\n<\/sc-for>\n<\/div>\n\n<section aria-labelledby=\"bt-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<h2 id=\"bt-h\" style=\"margin: 0; padding: 16px 20px; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px; border-bottom: 1px solid #E5E2CB\">Batches due this cycle<\/h2>\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 980px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">Series batch<\/th>\n<th scope=\"col\" style=\"text-align: end; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Items<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Register says<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Holds<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Votes<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Your vote<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 8px; border-bottom: 1px solid #E5E2CB\">Minute ref.<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{batches}}\" as=\"b\" hint-placeholder-count=\"4\">\n<tr>\n<td style=\"padding: 14px 20px; border-bottom: 1px solid #F0EEE2\"><strong>{{b.id}} · {{b.series}}<\/strong><div style=\"color: #4A6B6C\">{{b.title}}<\/div><\/td>\n<td style=\"padding: 14px 8px; border-bottom: 1px solid #F0EEE2; text-align: end; font-weight: 700\">{{b.items}}<\/td>\n<td style=\"padding: 14px 8px; border-bottom: 1px solid #F0EEE2\">{{b.reg}}<\/td>\n<td style=\"padding: 14px 8px; border-bottom: 1px solid #F0EEE2; color: {{b.holdFg}}; font-weight: 700\">{{b.holds}}<\/td>\n<td style=\"padding: 14px 8px; border-bottom: 1px solid #F0EEE2\"><span style=\"color: #005F4F; font-weight: 700\">{{b.yes}} ✓<\/span> · <span style=\"color: #9A1800\">{{b.no}} ✗<\/span><div style=\"width: 90px; height: 5px; border-radius: 3px; background: #E5E2CB; margin-top: 4px; overflow: hidden\"><div style=\"height: 100%; width: {{b.w}}; background: #269D6A\"><\/div><\/div><\/td>\n<td style=\"padding: 14px 8px; border-bottom: 1px solid #F0EEE2\"><label for=\"{{b.vid}}\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Your vote for {{b.id}}<\/label><select id=\"{{b.vid}}\" style=\"height: 38px; border-radius: 8px; border: 1px solid #CCC9B4; padding: 0 8px; font: inherit; background: #FFFFFF; color: #003234\"><option>{{b.vote}}<\/option><option>Destroy<\/option><option>Transfer to NLA<\/option><option>Retain<\/option><option>Appraise later<\/option><\/select><\/td>\n<td style=\"padding: 14px 20px 14px 8px; border-bottom: 1px solid #F0EEE2; font-family: 'Roboto Mono',Consolas,monospace\">{{b.minute}}<\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 16px 20px\">\n<span style=\"font-size: 12px; color: #4A6B6C\">On execute: items are destroyed or transferred, a certificate is issued and the audit trail keeps a stub for each record.<\/span>\n<div style=\"display: flex; gap: 8px\"><button type=\"button\" onClick=\"{{onSave}}\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">Save votes<\/button><button type=\"button\" onClick=\"{{onExecute}}\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">{{execLabel}}<\/button><\/div>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"ex-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px\">\n<h2 id=\"ex-h\" style=\"margin: 0 0 8px; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">Executed this cycle<\/h2>\n<sc-for list=\"{{executed}}\" as=\"e\" hint-placeholder-count=\"2\">\n<div style=\"display: grid; grid-template-columns: 1.4fr 1fr .6fr 1fr 1.2fr 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid #F0EEE2; font-size: 13px\"><strong>{{e.batch}}<\/strong><span>{{e.action}}<\/span><span>{{e.items}}<\/span><span style=\"font-family: 'Roboto Mono',Consolas,monospace\">{{e.minute}}<\/span><a href=\"Reports.html\" style=\"font-family: 'Roboto Mono',Consolas,monospace\">{{e.cert}}<\/a><span style=\"color: #4A6B6C\">{{e.at}}<\/span><\/div>\n<\/sc-for>\n<\/section>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { saved: false, done: false }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const labels = ['Due list', 'Hold check', 'Committee vote', 'Minute ref.', 'Execute', 'Certificate'];\n    return {\n      steps: labels.map((label, i) => ({ label, mark: i < 2 ? '✓' : String(i + 1), cur: i === 2 ? 'step' : 'false', bg: i < 2 ? '#269D6A' : i === 2 ? '#005F4F' : '#E5E2CB', dotFg: i <= 2 ? '#FFFFFF' : '#003234', fg: i <= 2 ? '#003234' : '#4A6B6C', weight: i === 2 ? 700 : 400 })),\n      kpis: [\n        { label: 'Batches due', n: '4', sub: 'Cycle 2026-Q3 · opened 01 Sep', icon: 'calendar', tone: 'default', href: '' },\n        { label: 'Excluded · on hold', n: '12', sub: 'Leave records 2015 · HR-RE-2', icon: 'shield', tone: 'default', href: 'LegalHolds.html' },\n        { label: 'Voted', n: st.saved ? '4 / 4' : '2 / 4', sub: 'Committee of 5 · quorum 3', icon: 'vote', tone: 'default', href: '' },\n        { label: 'Ready to execute', n: st.done ? '0' : '1', sub: st.done ? 'Executed this cycle' : 'Resolutions 2011 · transfer to NLA', icon: 'gavel', tone: 'default', href: '' },\n      ],\n      batches: (st.done ? b => b.filter(x => x.id !== 'B3') : b => b)([\n        { id: 'B1', vid: 'v1', series: 'IT-RE-7', title: 'Helpdesk tickets 2016', items: '184', reg: 'Appraise', holds: 'None', holdFg: '#4A6B6C', yes: 2, no: 0, w: '40%', vote: 'Destroy', minute: '—' },\n        { id: 'B2', vid: 'v2', series: 'HR-RE-2', title: 'Leave records 2015', items: '1,912', reg: 'Permanent', holds: '12 held', holdFg: '#682A0A', yes: 0, no: 0, w: '0%', vote: 'Retain', minute: '—' },\n        { id: 'B3', vid: 'v3', series: 'LG-RE-6', title: 'Resolutions 2011', items: '6', reg: 'Transfer', holds: 'None', holdFg: '#4A6B6C', yes: 4, no: 0, w: '80%', vote: 'Transfer to NLA', minute: 'DC-2026-09-03' },\n        { id: 'B4', vid: 'v4', series: 'CC-RE-3', title: 'Media campaign records 2013 · 1.9 TB', items: '433', reg: 'Appraise', holds: 'None', holdFg: '#4A6B6C', yes: 1, no: 1, w: '20%', vote: 'Appraise later', minute: '—' },\n      ]),\n      executed: (st.done ? [\n        { batch: 'LG-RE-6 · Resolutions 2011', action: 'Transferred to NLA', items: '6', minute: 'DC-2026-09-03', cert: 'DC-2026-Q3-07', at: 'Just now' },\n] : []).concat([\n        { batch: 'IT-RE-7 · tickets 2015', action: 'Destroyed', items: '184', minute: 'DC-2026-08-11', cert: 'DC-2026-Q3-01', at: '12 Aug 2026' },\n        { batch: 'FN-RE-4 · vouchers 2010', action: 'Transferred to NLA', items: '410', minute: 'DC-2026-08-11', cert: 'DC-2026-Q3-04', at: '19 Aug 2026' },\n      ]),\n      toastOn: !!st.toast, toastText: st.toast || '',\n      execLabel: st.done ? 'Execute ready batches (0)' : 'Execute ready batches (1)',\n      onSave: () => { this.setState({ saved: true }); this.say('Votes saved · 4 batches · cycle 2026-Q3'); },\n      onExecute: () => { if (st.done) { this.say('No batches are ready to execute'); return; } this.setState({ done: true }); this.say('Batch B3 executed · certificate DC-2026-Q3-07 issued'); },\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1100}}});
</script>
</body>
</html>
