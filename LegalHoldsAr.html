style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 17px\">{{h.matter}}<\/span>\n<span style=\"font-size: 13px; color: #4A6B6C\">النطاق {{h.scope}} · طبّقه {{h.by}}<\/span>\n<\/div>\n<div style=\"text-align: end\"><div style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 700; font-size: 30px; color: #269D6A\">{{h.items}}<\/div><div style=\"font-size: 12px; color: #4A6B6C\">عنصراً محجوزاً<\/div><\/div>\n<sc-if value=\"{{h.isLink}}\" hint-placeholder-val=\"{{ false }}\"><a href=\"DocumentAr.html\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">{{h.cta}}<\/a><\/sc-if>\n<sc-if value=\"{{h.isBtn}}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" onClick=\"{{h.act}}\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">{{h.cta}}<\/button><\/sc-if>\n<\/article>\n<\/sc-for>\n<\/div>\n\n<form aria-labelledby=\"nha-h\" style=\"flex: 2 1 340px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<h2 id=\"nha-h\" style=\"margin: 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\">حجز جديد<\/h2>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"lha-m\" style=\"font-size: 13px; font-weight: 700\">القضية<\/label><input id=\"lha-m\" placeholder=\"مثال: القضية 052/2026 — مطالبة تعاقدية\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234\"><\/div>\n<fieldset style=\"border: 0; margin: 0; padding: 0\"><legend style=\"font-size: 13px; font-weight: 700; margin-bottom: 8px\">نوع النطاق<\/legend>\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px\">\n<label style=\"display: flex; gap: 8px; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 8px; border: 2px solid #269D6A; background: #F4FAF7\"><input type=\"radio\" name=\"scope-ar\" checked style=\"accent-color: #005F4F\">سلسلة السجلات<\/label>\n<label style=\"display: flex; gap: 8px; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid #DCE3E0\"><input type=\"radio\" name=\"scope-ar\" style=\"accent-color: #005F4F\">الإدارة<\/label>\n<label style=\"display: flex; gap: 8px; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid #DCE3E0\"><input type=\"radio\" name=\"scope-ar\" style=\"accent-color: #005F4F\">نطاق زمني<\/label>\n<label style=\"display: flex; gap: 8px; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid #DCE3E0\"><input type=\"radio\" name=\"scope-ar\" style=\"accent-color: #005F4F\">عناصر محددة<\/label>\n<\/div><\/fieldset>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"lha-s\" style=\"font-size: 13px; font-weight: 700\">النطاق<\/label><input id=\"lha-s\" dir=\"ltr\" value=\"PG-RE-18, PG-RE-04\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234; text-align: right\"><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"lha-a\" style=\"font-size: 13px; font-weight: 700\">الجهة / مرجع القضية<\/label><input id=\"lha-a\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234\"><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"lha-2\" style=\"font-size: 13px; font-weight: 700\">الموقّع الثاني<\/label><select id=\"lha-2\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; background: #FFFFFF; color: #003234\"><option>نورة ك.<\/option><option>عمر ر.<\/option><option>هدى س.<\/option><option>فيصل م.<\/option><\/select><\/div>\n<button type=\"button\" onClick=\"{{onApply}}\" style=\"height: 48px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">تطبيق الحجز<\/button>\n<span style=\"font-size: 12px; color: #4A6B6C\">يسري الحجز عند تأكيد الموقّع الثاني، ويعلّق بوابات الاستبقاء والإتلاف لكل عنصر ضمن النطاق.<\/span>\n<\/form>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    this.state = { next: 2, holds: [\n          { ref: 'LH-2026-01', status: 'بانتظار الموقّع الثاني', bg: '#FAE3BE', fg: '#63420F', matter: 'القضية 041/2026 — تظلّم مناقصة', scope: 'PG-RE-18, PG-RE-04', by: 'نورة ك.', items: '612', cta: 'تذكير الموقّع', kind: 'remind' },\n          { ref: 'LH-2025-03', status: 'بانتظار الرفع', bg: '#FBDCCB', fg: '#682A0A', matter: 'القضية 118/2025 — نزاع مع مورد', scope: 'IT-RE-10 · 2019–2023', by: 'نورة ك.', items: '2,410', cta: 'إرسال للرفع', kind: 'release' },\n          { ref: 'LH-2024-01', status: 'مرفوع', bg: '#EEF0F3', fg: '#3F4146', matter: 'تحقيق داخلي 7/2024', scope: 'HR-RE-1 · عناصر محددة', by: 'عمر ر.', items: '38', cta: 'عرض السجل', kind: 'log' },\n    ] };\n  }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  act(h) {\n    if (h.kind === 'remind') { this.say('تم إرسال تذكير إلى الموقّع الثاني على ' + h.ref); return; }\n    if (h.kind === 'release') {\n      this.setState({ holds: this.state.holds.map(x => x.ref === h.ref ? { ...x, status: 'أُرسل الرفع إلى الموقّع الثاني', bg: '#FAE3BE', fg: '#63420F', cta: 'تذكير الموقّع', kind: 'remind' } : x) });\n      this.say('أُرسل طلب رفع ' + h.ref + ' إلى الموقّع الثاني');\n    }\n  }\n  apply() {\n    const st = this.state;\n    const ref = 'LH-2026-' + String(st.next).padStart(2, '0');\n    this.setState({ next: st.next + 1, holds: [{ ref, status: 'بانتظار الموقّع الثاني', bg: '#FAE3BE', fg: '#63420F', matter: 'القضية 052/2026 — مطالبة تعاقدية', scope: 'PG-RE-18, PG-RE-04', by: 'ر. الشامسي', items: '—', cta: 'تذكير الموقّع', kind: 'remind' }].concat(st.holds) });\n    this.say('أُرسل الحجز ' + ref + ' إلى نورة ك. للتوقيع الثاني');\n  }\n  renderVals() {\n    const st = this.state || {};\n    return {\n      holds: (st.holds || []).map(h => ({ ...h, isLink: h.kind === 'log', isBtn: h.kind !== 'log', act: () => this.act(h) })),\n      onApply: () => this.apply(),\n      toastOn: !!st.toast, toastText: st.toast || '',\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1000}}});
</script>
