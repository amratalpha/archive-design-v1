<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports and dashboards (dark) · DAS prototype</title>
<style>body{margin:0}</style>
<script src="das-runtime.js"></script>
<script src="components.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script>
DCRun(window.DAS_COMPONENTS, {"name": "ReportsDark", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #003234; color: #FFFFFF; font-family: 'Roboto',system-ui,sans-serif; font-size: 14px; line-height: 1.45\">\n<dc-import name=\"SidebarDark\" active=\"reports\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"TopbarDark\" page=\"Reports\" crumb=\"Reports\" persona=\"rashed\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div><div style=\"font-size: 13px; color: #BFD0CC\">Reporting and dashboards · read-only · security-trimmed<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 32px\">Reports and dashboards<\/h1><\/div>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n<label for=\"rp-period\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Period<\/label>\n<select id=\"rp-period\" style=\"height: 44px; border-radius: 10px; border: 1px solid #2E6E64; padding: 0 12px; font: inherit; background: #00453F; color: #FFFFFF\"><option>Last 30 days<\/option><option>Last 90 days<\/option><option>Last 365 days<\/option><\/select>\n<label for=\"rp-div\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Division<\/label>\n<select id=\"rp-div\" style=\"height: 44px; border-radius: 10px; border: 1px solid #2E6E64; padding: 0 12px; font: inherit; background: #00453F; color: #FFFFFF\"><option>All divisions<\/option><option>IT · Information Technology<\/option><\/select>\n<button type=\"button\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #4F8A7E; background: #00453F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{onExport}}\">Export dashboard (CSV)<\/button>\n<\/div>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n<sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"5\">\n<dc-import name=\"StatTileDark\" label=\"{{k.label}}\" value=\"{{k.n}}\" sub=\"{{k.sub}}\" icon=\"{{k.icon}}\" tone=\"{{k.tone}}\" href=\"{{k.href}}\" hint-size=\"100%,146px\"><\/dc-import>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px\">\n<section aria-labelledby=\"c1\" style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><h2 id=\"c1\" style=\"margin: 0; font-size: 15px; font-weight: 700\">Documents declared · 12 months<\/h2><button type=\"button\" style=\"height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid #005F4F; background: #00453F; color: #7DC4A6; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer\" aria-expanded=\"{{tableExpanded}}\" onClick=\"{{onToggleTable}}\">{{tableLabel}}<\/button><\/div>\n<div role=\"img\" aria-label=\"Column chart of documents declared per month, Dec 2025 to Nov 2026, peaking at 2,940 in September\" style=\"display: flex; align-items: flex-end; gap: 2px; height: 180px; border-bottom: 1px solid #2E6E64; padding-top: 10px\">\n<sc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\">\n<div title=\"{{m.label}} · {{m.n}}\" style=\"flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%\"><div style=\"width: 60%; height: {{m.h}}; background: {{m.c}}; border-radius: 4px 4px 0 0\"><\/div><\/div>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; gap: 2px; font-size: 11px; color: #BFD0CC\"><sc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\"><span style=\"flex: 1; text-align: center\">{{m.short}}<\/span><\/sc-for><\/div>\n<sc-if value=\"{{showTable}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"overflow-x: auto\"><table style=\"width: 100%; border-collapse: collapse; font-size: 12px\">\n<caption style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Documents declared per month<\/caption>\n<thead><tr style=\"color: #BFD0CC\"><th scope=\"row\" style=\"text-align: start; padding: 6px 8px; border-bottom: 1px solid #005F4F\">Month<\/th><sc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\"><th scope=\"col\" style=\"padding: 6px 4px; border-bottom: 1px solid #005F4F; text-align: end; white-space: nowrap; font-weight: 400\">{{m.label}}<\/th><\/sc-for><\/tr><\/thead>\n<tbody><tr><th scope=\"row\" style=\"text-align: start; padding: 6px 8px\">Declared<\/th><sc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\"><td style=\"padding: 6px 4px; text-align: end; font-weight: 700\">{{m.n}}<\/td><\/sc-for><\/tr><\/tbody>\n<\/table><\/div>\n<\/sc-if>\n<\/section>\n\n<section aria-labelledby=\"c2\" style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<h2 id=\"c2\" style=\"margin: 0; font-size: 15px; font-weight: 700\">Capture by channel<\/h2>\n<sc-for list=\"{{channels}}\" as=\"c\" hint-placeholder-count=\"5\">\n<div title=\"{{c.name}} · {{c.n}}\" style=\"display: grid; grid-template-columns: 110px 1fr 64px; gap: 10px; align-items: center; font-size: 13px\"><span>{{c.name}}<\/span><span style=\"height: 12px; border-radius: 0 4px 4px 0; background: #005F4F; overflow: hidden\"><span style=\"display: block; height: 100%; width: {{c.w}}; background: #269D6A; border-radius: 0 4px 4px 0\"><\/span><\/span><span style=\"text-align: end; font-weight: 700\">{{c.n}}<\/span><\/div>\n<\/sc-for>\n<\/section>\n\n<section aria-labelledby=\"c3\" style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><h2 id=\"c3\" style=\"margin: 0; font-size: 15px; font-weight: 700\">Approval cycle vs SLA · hours<\/h2><span style=\"display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: #BFD0CC\"><span style=\"width: 2px; height: 14px; background: #005F4F\"><\/span>SLA<\/span><\/div>\n<sc-for list=\"{{cycles}}\" as=\"c\" hint-placeholder-count=\"4\">\n<div title=\"{{c.name}} · median {{c.v}} h, SLA {{c.sla}} h\" style=\"display: grid; grid-template-columns: 140px 1fr 80px; gap: 10px; align-items: center; font-size: 13px\"><span>{{c.name}}<\/span><span style=\"position: relative; height: 12px; border-radius: 0 4px 4px 0; background: #005F4F\"><span style=\"display: block; height: 100%; width: {{c.w}}; background: {{c.color}}; border-radius: 0 4px 4px 0\"><\/span><span style=\"position: absolute; top: -4px; bottom: -4px; inset-inline-start: {{c.slaPos}}; width: 2px; background: #005F4F\"><\/span><\/span><span style=\"text-align: end\"><strong>{{c.v}}<\/strong> / {{c.sla}}<\/span><\/div>\n<\/sc-for>\n<span style=\"font-size: 12px; color: #F09A8A\">Disposition runs 24 h over its SLA: committee votes wait for quorum.<\/span>\n<\/section>\n\n<section aria-labelledby=\"c4\" style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px\"><h2 id=\"c4\" style=\"margin: 0; font-size: 15px; font-weight: 700\">Retention gates · next 6 months<\/h2>\n<span style=\"display: flex; gap: 14px; font-size: 12px; color: #BFD0CC\"><span style=\"display: inline-flex; gap: 6px; align-items: center\"><span style=\"width: 10px; height: 10px; border-radius: 2px; background: #269D6A\"><\/span>Gate 1 → Archive Centre<\/span><span style=\"display: inline-flex; gap: 6px; align-items: center\"><span style=\"width: 10px; height: 10px; border-radius: 2px; background: #00453F\"><\/span>Gate 2 → Disposition<\/span><\/span><\/div>\n<div role=\"img\" aria-label=\"Grouped columns of retention gates due per month, December to May\" style=\"display: flex; align-items: flex-end; gap: 16px; height: 160px; border-bottom: 1px solid #2E6E64\">\n<sc-for list=\"{{gates}}\" as=\"g\" hint-placeholder-count=\"6\">\n<div title=\"{{g.m}} · Gate 1 {{g.a}}, Gate 2 {{g.b}}\" style=\"flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2px; height: 100%\"><div style=\"width: 34%; height: {{g.ha}}; background: #269D6A; border-radius: 4px 4px 0 0\"><\/div><div style=\"width: 34%; height: {{g.hb}}; background: #00453F; border-radius: 4px 4px 0 0\"><\/div><\/div>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; gap: 16px; font-size: 11px; color: #BFD0CC\"><sc-for list=\"{{gates}}\" as=\"g\" hint-placeholder-count=\"6\"><span style=\"flex: 1; text-align: center\">{{g.m}}<\/span><\/sc-for><\/div>\n<\/section>\n<\/div>\n\n<section aria-labelledby=\"std-h\" style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F\">\n<h2 id=\"std-h\" style=\"margin: 0; padding: 16px 20px; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px; border-bottom: 1px solid #005F4F\">Standard reports<\/h2>\n<div style=\"overflow-x: auto\"><table style=\"width: 100%; border-collapse: collapse; min-width: 700px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #BFD0CC\"><th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #005F4F\">Report<\/th><th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Scope<\/th><th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Format<\/th><th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Last run<\/th><th scope=\"col\" style=\"text-align: end; padding: 10px 20px 10px 8px; border-bottom: 1px solid #005F4F\">Actions<\/th><\/tr><\/thead>\n<tbody><sc-for list=\"{{reports}}\" as=\"r\" hint-placeholder-count=\"6\"><tr><td style=\"padding: 12px 20px; border-bottom: 1px solid #0B5048; font-weight: 700\">{{r.name}}<\/td><td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048\">{{r.scope}}<\/td><td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048\">{{r.fmt}}<\/td><td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048; color: #BFD0CC\">{{r.last}}<\/td><td style=\"padding: 12px 20px 12px 8px; border-bottom: 1px solid #0B5048; text-align: end; white-space: nowrap\"><button type=\"button\" onClick=\"{{r.run}}\" style=\"padding: 0; border: 0; background: transparent; font: inherit; font-weight: 700; color: #7DC4A6; text-decoration: underline; margin-inline-end: 14px; cursor: pointer\">Run<\/button><button type=\"button\" onClick=\"{{r.exp}}\" style=\"padding: 0; border: 0; background: transparent; font: inherit; font-weight: 700; color: #7DC4A6; text-decoration: underline; cursor: pointer\">Export CSV<\/button><\/td><\/tr><\/sc-for><\/tbody>\n<\/table><\/div>\n<\/section>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #005F4F; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { table: false, ran: {} }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const ran = st.ran || {}, table = !!st.table;\n    const T = { now: 'Just now', show: 'Show table', hide: 'Hide table', dash: 'Dashboard exported · das-dashboard-2026-11-06.csv', run: (n) => n + ' run started · results in My files when ready', csv: (n) => n + ' exported as CSV' };\n    const names = ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'];\n    const vals = [1620, 1480, 1710, 2050, 1890, 1960, 2210, 1740, 2380, 2940, 2610, 1180];\n    const max = 3000;\n    const g = [['Dec', 14, 3], ['Jan', 22, 4], ['Feb', 9, 0], ['Mar', 31, 7], ['Apr', 18, 2], ['May', 12, 5]];\n    const cyc = [['Document approval', 11, 16], ['Share', 9, 24], ['Classify', 20, 24], ['Disposition', 168, 144]];\n    const ch = [['Migration', 18400], ['Integrations', 3100], ['Scanners', 1400], ['Mailbox', 380], ['My Files', 262]];\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      onExport: () => this.say(T.dash),\n      onToggleTable: () => this.setState({ table: !table }),\n      showTable: table, tableLabel: table ? T.hide : T.show, tableExpanded: table ? 'true' : 'false',\n      kpis: [\n        { label: 'Declared · 30 d', n: '2,610', sub: 'All divisions', icon: 'archive', tone: 'default', href: 'RecordsConsoleDark.html' },\n        { label: 'Auto-classified', n: '94 %', sub: 'Above threshold 0.75', icon: 'check', tone: 'default', href: 'ClassificationDark.html' },\n        { label: 'Median approval cycle', n: '11 h', sub: 'SLA 16 h', icon: 'clock', tone: 'default', href: 'ApprovalsDark.html' },\n        { label: 'Retention gates due', n: '127', sub: 'Next 6 months', icon: 'hourglass', tone: 'default', href: 'DispositionDark.html' },\n        { label: 'Storage · hot + archive', n: '8.4 TB', sub: 'SharePoint SE', icon: 'storage', tone: 'default', href: '' },\n      ],\n      months: names.map((short, i) => ({ short, label: short + (i === 0 ? ' 2025' : ' 2026'), n: vals[i].toLocaleString('en-US'), h: Math.round(vals[i] / max * 100) + '%', c: i === 11 ? '#7EA393' : '#269D6A' })),\n      channels: ch.map(([name, n]) => ({ name, n: n.toLocaleString('en-US'), w: Math.max(2, Math.round(n / 18400 * 100)) + '%' })),\n      cycles: cyc.map(([name, v, sla]) => ({ name, v, sla, w: Math.round(v / 180 * 100) + '%', slaPos: Math.round(sla / 180 * 100) + '%', color: v > sla ? '#F09A8A' : '#269D6A' })),\n      gates: g.map(([m, a, b]) => ({ m, a, b, ha: Math.round(a / 32 * 100) + '%', hb: Math.max(1, Math.round(b / 32 * 100)) + '%' })),\n      reports: [\n        { name: 'Access review', scope: 'Per division', fmt: 'XLSX', last: '01 Nov 2026' },\n        { name: 'Disposition certificates', scope: '2026-Q3', fmt: 'PDF', last: '30 Sep 2026' },\n        { name: 'Audit extract', scope: 'SIEM window', fmt: 'CSV', last: '05 Nov 2026' },\n        { name: 'Records register', scope: 'NLA format', fmt: 'XLSX', last: '14 Sep 2026' },\n        { name: 'Vital records list', scope: 'All sectors', fmt: 'PDF', last: '01 Oct 2026' },\n        { name: 'Retention gates due', scope: 'Next 90 days', fmt: 'CSV', last: '06 Nov 2026' },\n      ].map(r => ({ ...r, last: ran[r.name] ? T.now : r.last,\n        run: () => { this.setState({ ran: { ...ran, [r.name]: true } }); this.say(T.run(r.name)); },\n        exp: () => this.say(T.csv(r.name)) })),\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1400}}});
</script>
</body>
</html>
