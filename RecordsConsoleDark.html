<div id="dc-root"></div>
<script>
DCRun(window.DAS_COMPONENTS, {"name": "RecordsConsoleDark", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #003234; color: #FFFFFF; font-family: 'Roboto',system-ui,sans-serif; font-size: 14px; line-height: 1.45\">\n<dc-import name=\"SidebarDark\" active=\"records\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"TopbarDark\" page=\"RecordsConsole\" crumb=\"Records\" persona=\"rashed\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n\n<nav aria-labelledby=\"fp-h\" style=\"flex: 1 1 260px; max-width: 320px; min-width: 0; background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n<h2 id=\"fp-h\" style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">File plan<\/h2>\n<div style=\"font-size: 12px; color: #BFD0CC\">10 sectors · 24 divisions · 464 series<\/div>\n<label for=\"fp-find\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Find series<\/label>\n<input id=\"fp-find\" placeholder=\"Find series…\" style=\"height: 40px; border-radius: 10px; border: 1px solid #2E6E64; padding: 0 12px; font: inherit; color: #FFFFFF\">\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px\">\n<sc-for list=\"{{tree}}\" as=\"n\" hint-placeholder-count=\"12\">\n<li><button type=\"button\" onClick=\"{{n.pick}}\" aria-current=\"{{n.cur}}\" style=\"width: 100%; border: 0; font: inherit; text-align: start; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 10px; padding-inline-start: {{n.pad}}; border-radius: 8px; text-decoration: none; color: {{n.fg}}; background: {{n.bg}}; font-weight: {{n.weight}}\"><span style=\"width: 12px; color: #BFD0CC\">{{n.caret}}<\/span><span style=\"flex: 1\">{{n.label}}<\/span><span style=\"font-size: 12px; color: {{n.countFg}}\">{{n.count}}<\/span><\/button><\/li>\n<\/sc-for>\n<\/ul>\n<\/nav>\n\n<div style=\"flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 24px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end\">\n<div><div style=\"font-size: 13px; color: #BFD0CC\">Series · records register baseline v2026.1 (signed 02 Mar 2026)<\/div>\n<h1 style=\"margin: 4px 0 6px; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 28px\">{{selCode}} · {{selName}}<\/h1>\n<span style=\"padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #094C41; color: #7DC4A6\">Maintained and current<\/span><\/div>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n<a href=\"SearchDark.html\" style=\"height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #4F8A7E; background: #00453F; color: #FFFFFF; font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">Pull whole series<\/a>\n<a href=\"LegalHoldsDark.html\" style=\"height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #4F8A7E; color: #FFFFFF; font-weight: 700; display: inline-flex; align-items: center; text-decoration: none\">Apply hold<\/a>\n<a href=\"AdminDark.html\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #67BA97; color: #003234; font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">Propose retention change<\/a>\n<\/div>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n<sc-for list=\"{{stats}}\" as=\"s\" hint-placeholder-count=\"4\">\n<dc-import name=\"StatTileDark\" label=\"{{s.label}}\" value=\"{{s.n}}\" sub=\"{{s.sub}}\" icon=\"{{s.icon}}\" tone=\"{{s.tone}}\" href=\"{{s.href}}\" hint-size=\"100%,146px\"><\/dc-import>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<section aria-labelledby=\"rule-h\" style=\"flex: 3 1 380px; min-width: 0; background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px\">\n<h2 id=\"rule-h\" style=\"margin: 0 0 12px; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">Rule in force<\/h2>\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px 20px\">\n<sc-for list=\"{{rule}}\" as=\"r\" hint-placeholder-count=\"10\">\n<div><dt style=\"font-size: 12px; color: #BFD0CC\">{{r.k}}<\/dt><dd style=\"margin: 2px 0 0; font-weight: 700\">{{r.v}}<\/dd><\/div>\n<\/sc-for>\n<\/dl>\n<\/section>\n<section aria-labelledby=\"gate-h\" style=\"flex: 2 1 300px; min-width: 0; background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px\">\n<h2 id=\"gate-h\" style=\"margin: 0 0 8px; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">Gates due · 90 days<\/h2>\n<sc-for list=\"{{gates}}\" as=\"g\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid #0B5048; font-size: 13px\"><span style=\"flex: 1; min-width: 0\"><a href=\"DocumentDark.html\" style=\"display: block; font-weight: 700\">{{g.title}}<\/a><span style=\"font-family: 'Roboto Mono',Consolas,monospace; font-size: 12px; color: #BFD0CC\">{{g.code}}<\/span><\/span><span style=\"padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: #094C41; color: #7DC4A6\">{{g.gate}}<\/span><span style=\"width: 76px; text-align: end\">{{g.due}}<\/span><\/div>\n<\/sc-for>\n<p style=\"margin: 10px 0 0; font-size: 12px; color: #BFD0CC\">Gate 1 moves records to the Archive Centre after the active period. Gate 2 opens disposition after the archive period. Holds suspend both.<\/p>\n<\/section>\n<\/div>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #005F4F; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { sel: 5 }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const sel = st.sel == null ? 5 : st.sel;\n    let ix = 0;\n    const n = (label, lvl, count, open, _c) => { const i = ix++; const cur = i === sel; return { label, count, lvl, i, cur: cur ? 'page' : 'false', pad: (10 + lvl * 16) + 'px', caret: lvl < 2 ? (open ? '▾' : '▸') : '', fg: cur ? '#FFFFFF' : '#FFFFFF', bg: cur ? '#005F4F' : 'transparent', weight: cur || lvl === 0 ? 700 : 400, countFg: cur ? 'rgba(255,255,255,.85)' : '#BFD0CC' }; };\n    const nodes = [\n        n('SS · Support Services', 0, '148', true), n('IT · Information Technology', 1, '22', true),\n        n('IT-RE-1 · IT equipment assets', 2, '1,904'), n('IT-RE-7 · Incidents, requests and support', 2, '18,220'),\n        n('IT-RE-8 · Change advisory board', 2, '312'), n('IT-RE-10 · IT contracts register', 2, '486', false, true),\n        n('IT-RE-12 · IT policies', 2, '146'), n('HR · Human Resources', 1, '31'), n('FN · Finance', 1, '27'), n('PG · Procurement and General Services', 1, '24'),\n        n('DG · Director General’s Office', 0, '18'), n('INV · Investment', 0, '61'),\n    ];\n    const cur = nodes[sel] || nodes[5];\n    const cut = cur.label.indexOf(' · ');\n    const msg = l => 'Showing ' + l + ' · pick a series to see its rule';\n    const tree = nodes.map(x => ({ ...x, pick: () => { this.setState({ sel: x.i }); if (x.lvl < 2) this.say(msg(x.label)); } }));\n    return {\n      tree,\n      selCode: cur.label.slice(0, cut), selName: cur.label.slice(cut + 3),\n      toastOn: !!st.toast, toastText: st.toast || '',\n      stats: [\n        { label: 'Items', n: String(cur.count), sub: sel === 5 ? '402 active, 84 intermediate' : 'In the selected node', icon: 'layers', tone: 'default', href: '' }, { label: 'Permanent · WORM', n: '0', sub: 'Final disposition: appraise', icon: 'storage', tone: 'default', href: '' },\n        { label: 'On hold', n: '2,410', sub: 'LH-2025-03 · 2019–2023', icon: 'shield', tone: 'default', href: 'LegalHoldsDark.html' }, { label: 'Gate 1 due · 90 d', n: '14', sub: 'To Archive Centre', icon: 'hourglass', tone: 'default', href: 'DispositionDark.html' },\n      ],\n      rule: [\n        { k: 'Series code', v: 'IT-RE-10' }, { k: 'Classification', v: 'Support services › Procurement & contracts' },\n        { k: 'Default confidentiality', v: 'Confidential' }, { k: 'Active retention', v: '5 years' },\n        { k: 'Archive retention', v: '10 years' }, { k: 'Final disposition', v: 'Appraise' },\n        { k: 'Vitality', v: 'Vital' }, { k: 'Content type', v: 'DAS Contract' },\n        { k: 'Libraries', v: 'Contracts and SLAs' }, { k: 'NLA approval', v: 'Approved · 2026.1' },\n      ],\n      gates: [\n        { title: 'Network maintenance contract 2021', code: 'SS-IT-CR-071', gate: 'Gate 1', due: '18 Dec' },\n        { title: 'Licence renewal — security suite', code: 'SS-IT-CR-076', gate: 'Gate 1', due: '05 Jan' },\n        { title: 'Printing services SLA', code: 'SS-IT-CR-079', gate: 'Gate 1', due: '22 Jan' },\n        { title: 'Helpdesk outsourcing 2011', code: 'SS-IT-CR-012', gate: 'Gate 2', due: '31 Jan' },\n      ],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1100}}});
</script>
</body>
