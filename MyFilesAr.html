button type=\"button\" role=\"tab\" aria-selected=\"{{t.sel}}\" onClick=\"{{t.pick}}\" style=\"height: 44px; border: 0; border-bottom: 3px solid {{t.line}}; background: transparent; font: inherit; font-weight: {{t.weight}}; color: {{t.fg}}; padding: 0 2px; cursor: pointer\">{{t.label}}<\/button>\n<\/sc-for>\n<\/div>\n\n<sc-if value=\"{{showBrowse}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px\">\n<sc-for list=\"{{accounts}}\" as=\"a\" hint-placeholder-count=\"4\">\n<button type=\"button\" aria-pressed=\"{{a.sel}}\" onClick=\"{{a.pick}}\" style=\"text-align: start; background: #FFFFFF; border-radius: 12px; border: {{a.border}}; padding: 16px; display: flex; gap: 12px; align-items: center; font: inherit; color: #003234; cursor: pointer\">\n<span style=\"width: 40px; height: 40px; border-radius: 10px; background: {{a.tile}}; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 13px\">{{a.ini}}<\/span>\n<span style=\"flex: 1; min-width: 0\"><span style=\"display: block; font-weight: 700\">{{a.name}}<\/span><span style=\"font-size: 12px; color: {{a.stFg}}\">{{a.status}}<\/span><\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<section aria-labelledby=\"bra-h\" style=\"flex: 3 1 560px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<div style=\"padding: 16px 20px; border-bottom: 1px solid #E5E2CB; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between\">\n<h2 id=\"bra-h\" style=\"margin: 0; font-size: 15px; font-weight: 700\">{{acctName}}<\/h2>\n<nav aria-label=\"مسار المجلد\" style=\"font-size: 13px; color: #4A6B6C\">الجذر / <span dir=\"ltr\">ADPF<\/span> / <strong style=\"color: #003234\">السياسات 2026<\/strong><\/nav>\n<\/div>\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 600px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\">\n<th scope=\"col\" style=\"width: 44px; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\"><span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">تحديد<\/span><\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #E5E2CB\">الاسم<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #E5E2CB\">النوع<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #E5E2CB\">آخر تعديل<\/th>\n<th scope=\"col\" style=\"text-align: end; padding: 10px 20px 10px 12px; border-bottom: 1px solid #E5E2CB\">الحجم<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{files}}\" as=\"f\" hint-placeholder-count=\"5\">\n<tr style=\"background: {{f.bg}}\">\n<td style=\"padding: 12px 20px; border-bottom: 1px solid #F0EEE2\"><input type=\"checkbox\" aria-label=\"تحديد {{f.name}}\" checked=\"{{f.on}}\" style=\"width: 18px; height: 18px; accent-color: #005F4F\"><\/td>\n<td dir=\"ltr\" style=\"padding: 12px; border-bottom: 1px solid #F0EEE2; font-weight: 700; text-align: right\">{{f.name}}<\/td>\n<td style=\"padding: 12px; border-bottom: 1px solid #F0EEE2\">{{f.kind}}<\/td>\n<td style=\"padding: 12px; border-bottom: 1px solid #F0EEE2; color: #4A6B6C\">{{f.mod}}<\/td>\n<td style=\"padding: 12px 20px 12px 12px; border-bottom: 1px solid #F0EEE2; text-align: end\">{{f.size}}<\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<\/section>\n\n<aside aria-labelledby=\"impa-h\" style=\"flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<h2 id=\"impa-h\" style=\"margin: 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\">الاستيراد إلى الأرشيف<\/h2>\n<div style=\"font-size: 13px; color: #4A6B6C\">3 ملفات محددة · 4.1 م.ب<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"mfa-series\" style=\"font-size: 13px; font-weight: 700\">سلسلة السجلات الوجهة<\/label>\n<select id=\"mfa-series\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; background: #FFFFFF; color: #003234\"><option>IT-RE-12 · سياسات تقنية المعلومات<\/option><option>IT-RE-10 · سجل عقود تقنية المعلومات<\/option><\/select>\n<\/div>\n<label style=\"display: flex; gap: 10px; align-items: center; min-height: 44px\"><input type=\"checkbox\" checked style=\"width: 18px; height: 18px; accent-color: #005F4F\">التصنيف تلقائياً عند الوصول<\/label>\n<button type=\"button\" onClick=\"{{onImport}}\" style=\"height: 44px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">الاستيراد إلى الأرشيف · 3<\/button>\n<span style=\"font-size: 12px; color: #4A6B6C\">تصل الملفات إلى منطقة الإيداع، وتصبح سجلات بعد فهرستها والإعلان عنها كسجلات.<\/span>\n<a href=\"CaptureQueueAr.html\" style=\"font-size: 13px; font-weight: 700; text-decoration: none\">فتح منطقة الإيداع ←<\/a>\n<\/div>\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-weight: 700; margin-bottom: 8px\">عمليات النقل<\/span>\n<sc-for list=\"{{transfers}}\" as=\"t\" hint-placeholder-count=\"3\">\n<div style=\"padding: 10px 0; border-top: 1px solid #F0EEE2; display: flex; flex-direction: column; gap: 4px\">\n<div style=\"display: flex; justify-content: space-between; gap: 8px\"><span style=\"font-weight: 700\"><span dir=\"ltr\" style=\"font-family: Consolas, monospace\">{{t.id}}<\/span> · {{t.dir}}<\/span><span style=\"font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 6px; background: {{t.bg}}; color: {{t.fg}}\">{{t.status}}<\/span><\/div>\n<div style=\"font-size: 13px; color: #4A6B6C\"><span dir=\"ltr\">{{t.path}}<\/span> · {{t.items}}<\/div>\n<span style=\"height: 5px; border-radius: 3px; background: #E5E2CB; overflow: hidden; display: block\"><span style=\"display: block; height: 100%; width: {{t.w}}; background: #269D6A\"><\/span><\/span>\n<\/div>\n<\/sc-for>\n<\/div>\n<\/aside>\n<\/div>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{showTransfers}}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"tra-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 4px\">\n<h2 id=\"tra-h\" style=\"margin: 0 0 8px; font-size: 15px; font-weight: 700\">عمليات النقل · 3<\/h2>\n<sc-for list=\"{{transfers}}\" as=\"t\" hint-placeholder-count=\"3\">\n<div style=\"padding: 12px 0; border-top: 1px solid #F0EEE2; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px\"><span style=\"font-weight: 700\"><span dir=\"ltr\" style=\"font-family: Consolas, monospace\">{{t.id}}<\/span> · {{t.dir}}<\/span><span style=\"font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 6px; background: {{t.bg}}; color: {{t.fg}}\">{{t.status}}<\/span><\/div>\n<div style=\"font-size: 13px; color: #4A6B6C\"><span dir=\"ltr\">{{t.path}}<\/span> · {{t.items}}<\/div>\n<span style=\"height: 5px; border-radius: 3px; background: #E5E2CB; overflow: hidden; display: block\"><span style=\"display: block; height: 100%; width: {{t.w}}; background: #269D6A\"><\/span><\/span>\n<\/div>\n<\/sc-for>\n<a href=\"CaptureQueueAr.html\" style=\"margin-top: 8px; font-size: 13px; font-weight: 700; text-decoration: none\">فتح منطقة الإيداع ←<\/a>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { tab: 'browse', acct: 0, toast: null }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const tab = st.tab || 'browse';\n    const acct = st.acct || 0;\n    const f = (name, kind, mod, size, on) => ({ name, kind, mod, size, on: !!on, bg: on ? '#F4FAF7' : '#FFFFFF' });\n    const accounts = [\n      { ini: 'OD', name: 'OneDrive — عبير', status: 'متصل · قيد التصفح', stFg: '#005F4F', tile: '#005F4F' },\n      { ini: 'GD', name: 'Google Drive — مشترك تقنية المعلومات', status: 'متصل', stFg: '#005F4F', tile: '#3F4146' },\n      { ini: 'DB', name: 'Dropbox — شخصي', status: 'يحتاج إلى انتباه · سجّل الدخول مجدداً', stFg: '#9A1800', tile: '#63666E' },\n      { ini: 'SP', name: 'SharePoint — مكتبة سياسات تقنية المعلومات', status: 'متصل · أعمدة المصدر', stFg: '#005F4F', tile: '#00453F' },\n    ];\n    const tabIds = [['browse', 'تصفح المصادر'], ['transfers', 'عمليات النقل · 3']];\n    return {\n      toastOn: !!st.toast, toastText: st.toast || '',\n      tabs: tabIds.map(([id, label]) => ({ label, sel: tab === id ? 'true' : 'false', line: tab === id ? '#269D6A' : 'transparent', weight: tab === id ? 700 : 400, fg: tab === id ? '#003234' : '#3D5F60', pick: () => this.setState({ tab: id }) })),\n      showBrowse: tab === 'browse', showTransfers: tab === 'transfers',\n      acctName: accounts[acct].name,\n      onConnect: () => this.say('فُتحت صفحة تسجيل الدخول من Microsoft · وافق على منح الوصول لربط الحساب'),\n      onImport: () => this.say('أُرسلت 3 ملفات إلى منطقة الإيداع · TR-1045 · يجري التصنيف عند الوصول'),\n      accounts: accounts.map((a, i) => ({ ...a, sel: i === acct ? 'true' : 'false', border: i === acct ? '2px solid #269D6A' : '1px solid #E5E2CB', pick: () => this.setState({ acct: i }) })),\n      files: [\n        f('InfoSec Policy v4 draft.docx', 'مستند Word', '27 سبتمبر 2026', '1.2 م.ب', true),\n        f('Access Control Standard.pdf', 'PDF', '22 سبتمبر 2026', '840 ك.ب', true),\n        f('Emirates DC — SLA letter.pdf', 'PDF', '21 سبتمبر 2026', '2.1 م.ب', true),\n        f('Steering committee pack Sep.pptx', 'PowerPoint', '18 سبتمبر 2026', '6.4 م.ب'),\n        f('Acceptable Use Policy v3.docx', 'مستند Word', '02 مارس 2026', '310 ك.ب'),\n      ],\n      transfers: [\n        { id: 'TR-1042', dir: 'وارد', path: '/ADPF/Policies 2026 → IT-RE-1', items: '14 عنصراً', status: 'سجل معلن', bg: '#E2F1EA', fg: '#005F4F', w: '100%' },\n        { id: 'TR-1043', dir: 'وارد', path: '/DAS rollout → Drop-off', items: '3 عناصر', status: 'في منطقة الإيداع · قيد الفهرسة', bg: '#FAE3BE', fg: '#63420F', w: '70%' },\n        { id: 'TR-1044', dir: 'صادر', path: 'SS-IT-PY-02-R3 → OneDrive', items: 'عنصر واحد', status: 'قيد النقل · 62 %', bg: '#EEF0F3', fg: '#3F4146', w: '62%' },\n      ],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1100}}});
