<div id="dc-root"></div>
<script>
DCRun(window.DAS_COMPONENTS, {"name": "Main", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"background: #F4F4EE; color: #003234; font-family: 'Roboto',system-ui,sans-serif; font-size: 15px; line-height: 1.5; min-height: 100%; box-sizing: border-box; padding: 64px 5vw 80px\">\n<div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px\">\n\n<header style=\"display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid #DCE3E0; padding-bottom: 32px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 760px\">\n<span role=\"img\" aria-label=\"Abu Dhabi Pension Fund\" style=\"position: relative; display: block; flex: 0 0 auto; align-self: flex-start; width: 170px; height: 96px\"><img src=\"./assets/adpf-logo.png\" alt=\"\" style=\"position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain\"><\/span>\n<p style=\"margin: 8px 0 0; font-size: 14px; color: #4A6B6C\">DAS · Document Archiving System · UI redesign 2026<\/p>\n<h1 style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 48px; line-height: 1.1; letter-spacing: -0.01em\">Design language<\/h1>\n<p style=\"margin: 0; font-size: 17px; color: #4A6B6C; max-width: 640px\">A calm, record-keeper's workspace. A Jade rail holds navigation, the Beige ground keeps long working days easy on the eye, white cards carry the work, and Emerald marks what matters: key figures, progress and focus.<\/p>\n<\/div>\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap\">\n<span style=\"padding: 6px 12px; border-radius: 999px; background: #E2F1EA; color: #005F4F; font-size: 13px; font-weight: 700\">Brand guideline v2.0<\/span>\n<span style=\"padding: 6px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE3E0; font-size: 13px\">English · العربية (RTL)<\/span>\n<\/div>\n<\/header>\n\n<section style=\"display: flex; flex-direction: column; gap: 20px\">\n<h2 style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 26px\">Colour<\/h2>\n<p style=\"margin: 0; color: #4A6B6C; max-width: 720px\">Primary colours build the interface. Secondary colours (Apricot, Sand, Gray) only tint data labels and status, never backgrounds or body text. Red is reserved for negatives.<\/p>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px\">\n<sc-for list=\"{{families}}\" as=\"fam\" hint-placeholder-count=\"4\">\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #DCE3E0; overflow: hidden\">\n<sc-for list=\"{{fam.swatches}}\" as=\"sw\" hint-placeholder-count=\"4\">\n<div style=\"height: 56px; display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 14px; box-sizing: border-box; font-size: 12px; background: {{sw.hex}}; color: {{sw.ink}}\">\n<span style=\"font-weight: 700\">{{sw.name}}<\/span><span style=\"font-family: 'Roboto Mono',Consolas,monospace\">{{sw.hex}}<\/span>\n<\/div>\n<\/sc-for>\n<div style=\"padding: 12px 14px; font-size: 13px; color: #4A6B6C\">{{fam.use}}<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n<\/section>\n\n<section style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 24px\">\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #DCE3E0; padding: 28px; display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 26px\">Type<\/h2>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12px; color: #4A6B6C\">Headings · Roboto Medium 500<\/span>\n<span style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 36px; line-height: 1.15\">Records that keep their word<\/span>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12px; color: #4A6B6C\">Key figures · Roboto Bold 700<\/span>\n<span style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: #269D6A\">12,480<\/span>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 12px; color: #4A6B6C\">Body · Roboto 400 / 700 · codes in Roboto Mono<\/span>\n<span style=\"font-size: 15px\">Every document is filed under a series of the Fund's file plan, carries a confidentiality level and follows its retention schedule. <strong>Sentence case everywhere.<\/strong><\/span>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 4px\" dir=\"rtl\">\n<span style=\"font-size: 12px; color: #4A6B6C\">العربية · 29LT Bukra / Neue Frutiger World<\/span>\n<span style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 26px\">نظام أرشفة الوثائق<\/span>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-size: 12px; color: #4A6B6C; border-top: 1px solid #DCE3E0; padding-top: 14px\">\n<span>H1 32/40<\/span><span>H2 22/30<\/span><span>Body 15/24<\/span><span>Label 13/18<\/span>\n<\/div>\n<\/div>\n\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #DCE3E0; padding: 28px; display: flex; flex-direction: column; gap: 20px\">\n<h2 style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 26px\">Controls<\/h2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n<button type=\"button\" style=\"height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px\">Approve<\/button>\n<button type=\"button\" style=\"height: 44px; padding: 0 20px; border-radius: 8px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; font-size: 14px\">Return for changes<\/button>\n<button type=\"button\" style=\"height: 44px; padding: 0 16px; border-radius: 8px; border: 0; background: transparent; color: #005F4F; font: inherit; font-weight: 700; font-size: 14px\">View history<\/button>\n<button type=\"button\" style=\"height: 44px; padding: 0 20px; border-radius: 8px; border: 1px solid #D12101; background: #FFFFFF; color: #D12101; font: inherit; font-weight: 700; font-size: 14px\">Reject<\/button>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"ds-title\" style=\"font-size: 13px; font-weight: 700\">Document title<\/label>\n<input id=\"ds-title\" value=\"Board resolution 2026/14 — investment mandate\" style=\"height: 44px; border-radius: 8px; border: 1px solid #B2C4BE; padding: 0 14px; font: inherit; color: #003234; background: #FFFFFF\">\n<span style=\"font-size: 12px; color: #4A6B6C\">Shown on the record and in search results<\/span>\n<\/div>\n<div style=\"display: inline-flex; align-self: flex-start; background: #F4F4EE; border-radius: 10px; padding: 4px; gap: 4px\">\n<button type=\"button\" style=\"height: 36px; padding: 0 16px; border-radius: 8px; border: 0; background: #FFFFFF; color: #003234; font: inherit; font-size: 13px; font-weight: 700; box-shadow: 0 1px 2px rgba(0,50,52,.14)\">My tasks<\/button>\n<button type=\"button\" style=\"height: 36px; padding: 0 16px; border-radius: 8px; border: 0; background: transparent; color: #4A6B6C; font: inherit; font-size: 13px\">Team<\/button>\n<button type=\"button\" style=\"height: 36px; padding: 0 16px; border-radius: 8px; border: 0; background: transparent; color: #4A6B6C; font: inherit; font-size: 13px\">Delegated to me<\/button>\n<\/div>\n<\/div>\n<\/section>\n\n<section style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 24px\">\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #DCE3E0; padding: 28px; display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 26px\">Status and labels<\/h2>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-size: 12px; color: #4A6B6C\">Confidentiality<\/span>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; font-weight: 700\">\n<span style=\"padding: 4px 10px; border-radius: 999px; background: #E2F1EA; color: #005F4F\">Open<\/span>\n<span style=\"padding: 4px 10px; border-radius: 999px; background: #FAE3BE; color: #63420F\">Sensitive<\/span>\n<span style=\"padding: 4px 10px; border-radius: 999px; background: #FBDCCB; color: #682A0A\">Confidential<\/span>\n<span style=\"padding: 4px 10px; border-radius: 999px; background: #FAE5E0; color: #B01C01\">Secret<\/span>\n<\/div>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-size: 12px; color: #4A6B6C\">Priority and SLA<\/span>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; font-weight: 700; align-items: center\">\n<span style=\"padding: 4px 10px; border-radius: 6px; background: #FAE5E0; color: #B01C01\">High<\/span>\n<span style=\"padding: 4px 10px; border-radius: 6px; background: #EEF0F3; color: #3F4146\">Normal<\/span>\n<span style=\"padding: 4px 10px; border-radius: 6px; background: #E2F1EA; color: #005F4F\">Low<\/span>\n<span style=\"display: inline-flex; align-items: center; gap: 8px; font-weight: 400; color: #4A6B6C; margin-inline-start: 8px\">\n<span style=\"width: 72px; height: 6px; border-radius: 3px; background: #E5E2CB; overflow: hidden; display: block\"><span style=\"display: block; width: 62%; height: 100%; background: #269D6A\"><\/span><\/span>1 d 4 h left<\/span>\n<\/div>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-size: 12px; color: #4A6B6C\">Messages<\/span>\n<div style=\"padding: 12px 14px; border-radius: 8px; background: #FAE3BE; color: #63420F; font-size: 13px\">2 required fields are missing: Series, Document date<\/div>\n<div style=\"padding: 12px 14px; border-radius: 8px; background: #FCE4D7; color: #9A1800; font-size: 13px\">The SharePoint library could not be reached. Your upload is kept and will retry.<\/div>\n<\/div>\n<\/div>\n\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #DCE3E0; padding: 28px; display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 26px\">Principles<\/h2>\n<sc-for list=\"{{principles}}\" as=\"p\" hint-placeholder-count=\"5\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"flex: 0 0 28px; height: 28px; border-radius: 8px; background: #E2F1EA; color: #005F4F; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center\">{{p.n}}<\/span>\n<div><div style=\"font-weight: 700\">{{p.title}}<\/div><div style=\"color: #4A6B6C; font-size: 14px\">{{p.body}}<\/div><\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n<\/section>\n\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  renderVals() {\n    const w = '#FFFFFF', j = '#003234';\n    return {\n      families: [\n        { use: 'Jade · rail, headings, text, primary buttons (400)', swatches: [\n          { name: 'Jade 800', hex: '#003234', ink: w }, { name: 'Jade 600', hex: '#00453F', ink: w },\n          { name: 'Jade 400', hex: '#005F4F', ink: w }, { name: 'Jade 200', hex: '#7EA393', ink: j } ] },\n        { use: 'Emerald and Beige · key figures, progress; ground and tracks', swatches: [\n          { name: 'Emerald', hex: '#269D6A', ink: w }, { name: 'Beige 800', hex: '#B2B09D', ink: j },\n          { name: 'Beige 400', hex: '#E5E2CB', ink: j }, { name: 'Beige 200', hex: '#F4F4EE', ink: j } ] },\n        { use: 'Apricot and Sand · confidentiality and warning tints only', swatches: [\n          { name: 'Apricot 800', hex: '#682A0A', ink: w }, { name: 'Apricot 200', hex: '#F4935E', ink: j },\n          { name: 'Sand 800', hex: '#63420F', ink: w }, { name: 'Sand 200', hex: '#F3BF6D', ink: j } ] },\n        { use: 'Gray and Red · neutral labels; Red for negatives only', swatches: [\n          { name: 'Gray 800', hex: '#3F4146', ink: w }, { name: 'Gray 400', hex: '#A7A9B3', ink: j },\n          { name: 'Gray 200', hex: '#D9DAE3', ink: j }, { name: 'Red', hex: '#D12101', ink: w } ] },\n      ],\n      principles: [\n        { n: '1', title: 'Work first', body: 'Every screen opens on what needs the user next: tasks, deadlines, missing fields.' },\n        { n: '2', title: 'One accent', body: 'Emerald is used sparingly, so key figures and progress stand out at a glance.' },\n        { n: '3', title: 'Records are evidence', body: 'Codes, series, retention and audit trail are always one look away, never buried.' },\n        { n: '4', title: 'Bilingual by design', body: 'Layouts mirror for Arabic; logical spacing, icons that flip, the same type families.' },\n        { n: '5', title: 'Accessible', body: 'AA contrast, 44 px targets, keyboard paths and visible focus in Emerald.' },\n      ],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1900}}});
</script>
</body>
</html>
