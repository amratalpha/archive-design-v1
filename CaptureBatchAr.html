DCRun(window.DAS_COMPONENTS, {"name": "CaptureBatchAr", "template": "\n<helmet>\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div dir=\"rtl\" style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Neue Frutiger World','Segoe UI',system-ui,sans-serif; font-size: 14px; line-height: 1.6\">\n<dc-import name=\"Sidebar\" active=\"capture\" lang=\"ar\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"CaptureBatch\" crumb=\"الالتقاط / B-2201\" lang=\"ar\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<a href=\"CaptureQueueAr.html\" style=\"font-weight: 700; font-size: 13px; text-decoration: none\">→ العودة إلى قائمة الانتظار<\/a>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div><div style=\"font-size: 13px; color: #4A6B6C\"><span dir=\"ltr\">B-2201<\/span> · ملفاتي · <span dir=\"ltr\">Google Drive /DAS rollout (TR-1043)<\/span><\/div>\n<h1 style=\"margin: 4px 0 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 32px\">فهرسة دفعة · 3 ملفات<\/h1><\/div>\n<fieldset style=\"border: 0; margin: 0; padding: 0; display: flex; align-items: center; gap: 10px\">\n<legend style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">الإعلان بصفة<\/legend>\n<span style=\"font-size: 13px; color: #4A6B6C\">الإعلان بصفة<\/span>\n<span style=\"display: inline-flex; background: #E9E7D8; border-radius: 10px; padding: 4px; gap: 4px\">\n<label style=\"height: 38px; padding: 0 14px; border-radius: 8px; background: #FFFFFF; font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(0,50,52,.14)\"><input type=\"radio\" name=\"decl-ar\" checked style=\"accent-color: #005F4F\">سجلات منفردة<\/label>\n<label style=\"height: 38px; padding: 0 14px; border-radius: 8px; display: flex; align-items: center; gap: 8px; color: #3D5F60\"><input type=\"radio\" name=\"decl-ar\" style=\"accent-color: #005F4F\">ملف واحد (مجمّع)<\/label>\n<\/span>\n<\/fieldset>\n<\/div>\n\n<sc-if value=\"{{editing}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<div style=\"flex: 3 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<section aria-labelledby=\"sha-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px\">\n<h2 id=\"sha-h\" style=\"margin: 0 0 4px; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\">البيانات الوصفية المشتركة<\/h2>\n<div style=\"font-size: 12px; color: #4A6B6C; margin-bottom: 14px\">تنطبق على كل ملف في الدفعة. يمكن تجاوزها لكل ملف أدناه.<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px\">\n<sc-for list=\"{{shared}}\" as=\"f\" hint-placeholder-count=\"12\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"{{f.id}}\" style=\"font-size: 13px; font-weight: 700\">{{f.label}}<\/label>\n<input id=\"{{f.id}}\" value=\"{{f.value}}\" style=\"height: 42px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234; background: {{f.bg}}\"><\/div>\n<\/sc-for>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"pfa-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<h2 id=\"pfa-h\" style=\"margin: 0; padding: 16px 20px; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px; border-bottom: 1px solid #E5E2CB\">لكل ملف<\/h2>\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 820px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">#<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">الملف<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">العنوان بالإنجليزية<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">العنوان بالعربية<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">رقم المرجع<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">التاريخ<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 8px; border-bottom: 1px solid #E5E2CB\">نوع الوثيقة<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{files}}\" as=\"r\" hint-placeholder-count=\"3\">\n<tr>\n<td style=\"padding: 12px 20px; border-bottom: 1px solid #F0EEE2\">{{r.n}}<\/td>\n<td dir=\"ltr\" style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2; font-weight: 700; text-align: right\">{{r.file}}<\/td>\n<td dir=\"ltr\" style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2; text-align: right\">{{r.en}}<\/td>\n<td dir=\"rtl\" style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2; text-align: start\">{{r.ar}}<\/td>\n<td dir=\"ltr\" style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2; font-family: Consolas, monospace; text-align: right\">{{r.ref}}<\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2\">{{r.date}}<\/td>\n<td style=\"padding: 12px 20px 12px 8px; border-bottom: 1px solid #F0EEE2\">{{r.type}} <button type=\"button\" aria-expanded=\"{{r.open}}\" onClick=\"{{r.toggle}}\" style=\"font: inherit; font-size: 12px; margin-inline-start: 6px; padding: 0; border: 0; background: transparent; color: #005F4F; text-decoration: underline; cursor: pointer\">{{r.moreLabel}}<\/button><\/td>\n<\/tr>\n<tr style=\"display: {{r.detailDisp}}; background: #F9F9F5\"><td style=\"padding: 0 20px; border-bottom: 1px solid #F0EEE2\"><\/td><td colspan=\"6\" style=\"padding: 10px 20px 12px 8px; border-bottom: 1px solid #F0EEE2; font-size: 12px; color: #4A6B6C\">{{r.detail}}<\/td><\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<\/section>\n<\/div>\n\n<aside aria-labelledby=\"rega-h\" style=\"flex: 2 1 320px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<div><span style=\"font-size: 12px; color: #4A6B6C\">من سجل وثائق الإدارة<\/span>\n<h2 id=\"rega-h\" style=\"margin: 2px 0 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\"><span dir=\"ltr\">IA-RE-1<\/span> · تقارير التدقيق الداخلي<\/h2><\/div>\n<dl style=\"margin: 0; display: grid; grid-template-columns: 130px 1fr; gap: 10px 12px; font-size: 13px\">\n<sc-for list=\"{{register}}\" as=\"d\" hint-placeholder-count=\"8\">\n<dt style=\"color: #4A6B6C\">{{d.k}}<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.v}}<\/dd>\n<\/sc-for>\n<\/dl>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px\">\n<div style=\"background: #F4F4EE; border-radius: 10px; padding: 10px; text-align: center\"><div style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 700; font-size: 26px; color: #269D6A\">2<\/div><div style=\"font-size: 12px\">سنوات ورقية<\/div><\/div>\n<div style=\"background: #F4F4EE; border-radius: 10px; padding: 10px; text-align: center\"><div style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 700; font-size: 26px; color: #269D6A\">5<\/div><div style=\"font-size: 12px\">في الإدارة<\/div><\/div>\n<div style=\"background: #F4F4EE; border-radius: 10px; padding: 10px; text-align: center\"><div style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 700; font-size: 26px; color: #269D6A\">10<\/div><div style=\"font-size: 12px\">سنوات الأرشيف الإلكتروني<\/div><\/div>\n<\/div>\n<\/aside>\n<\/div>\n\n<div style=\"display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap\">\n<a href=\"CaptureQueueAr.html\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: transparent; color: #005F4F; font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">إلغاء<\/a>\n<button type=\"button\" onClick=\"{{onSave}}\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">حفظ كمسودة<\/button>\n<button type=\"button\" onClick=\"{{onConfirm}}\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">تأكيد الفهرسة وإرسال الدفعة<\/button>\n<\/div>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{done}}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"cb-done-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 28px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center\">\n<span style=\"width: 56px; height: 56px; border-radius: 14px; background: #E2F1EA; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#005F4F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg><\/span>\n<div style=\"flex: 1 1 360px; display: flex; flex-direction: column; gap: 4px\">\n<span style=\"align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #FAE3BE; color: #63420F\">3 سجلات قيد الاعتماد<\/span>\n<h2 id=\"cb-done-h\" style=\"margin: 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 22px\">أُرسلت الدفعة للاعتماد<\/h2>\n<p style=\"margin: 0; color: #4A6B6C\">حُجزت الرموز <span dir=\"ltr\">SS-IA-RE-112<\/span> إلى <span dir=\"ltr\">SS-IA-RE-114<\/span> · وُجِّهت الدفعة <span dir=\"ltr\">B-2201<\/span> إلى رئيسة التدقيق الداخلي للاعتماد.<\/p>\n<\/div>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<a href=\"CaptureQueueAr.html\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">العودة إلى قائمة الانتظار<\/a>\n<a href=\"ApprovalsAr.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">فتح الموافقات<\/a>\n<\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { open: {}, done: false, toast: null }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const open = st.open || {};\n    const det = ['18 صفحة · التعرّف الضوئي 0.98 · 2.4 م.ب · المقترح IA-RE-1 بثقة 0.84', '6 صفحات · مستند Word محوَّل إلى PDF/A-2b · 410 ك.ب · المقترح IA-RE-1 بثقة 0.81', '4 صفحات · التعرّف الضوئي 0.95 · 620 ك.ب · بديل مقترح GV-RE-3 بثقة 0.12'];\n    let n = 0;\n    const f = (label, value, locked) => ({ id: 'cba-' + (++n), label, value, bg: locked ? '#F4F4EE' : '#FFFFFF' });\n    return {\n      toastOn: !!st.toast, toastText: st.toast || '',\n      editing: !st.done, done: !!st.done,\n      onSave: () => this.say('حُفظت مسودة الدفعة B-2201'),\n      onConfirm: () => { this.setState({ done: true }); this.say('أُرسلت الدفعة B-2201 · 3 ملفات بانتظار الاعتماد'); },\n      shared: [\n        f('القطاع', 'SS · الخدمات المساندة'), f('الإدارة', 'IA · التدقيق الداخلي والمخاطر'), f('تاريخ الإصدار', '2026-09-30'),\n        f('مجموعة الوثائق', 'تدقيق إطلاق نظام أرشفة الوثائق'), f('اسم العملية', 'إعداد تقارير التدقيق'), f('الرمز الجديد', 'يُحجز عند الإعلان كسجل', true),\n        f('درجة السرية', 'سري'), f('الشكل المادي أو الرقمي', 'رقمي'), f('المنشئ · المالك', 'عبير أ. · رئيسة التدقيق الداخلي'),\n        f('سنوات الحفظ', '5', true), f('سنوات الاستبقاء في الأرشيف', '10', true), f('الإجراء النهائي', 'تقييم', true),\n      ],\n      files: [\n        { n: 1, file: 'Rollout audit — findings.pdf', en: 'DAS rollout audit — findings', ar: 'تدقيق إطلاق النظام — النتائج', ref: '2026/IA/112', date: '2026-09-30', type: 'تقرير' },\n        { n: 2, file: 'Management response.docx', en: 'Management response', ar: 'رد الإدارة', ref: '2026/IA/113', date: '2026-10-02', type: 'تقرير' },\n        { n: 3, file: 'Steering minutes.pdf', en: 'Steering committee minutes — September', ar: 'محضر اللجنة التوجيهية — سبتمبر', ref: '2026/IA/114', date: '2026-09-24', type: 'محضر اجتماع' },\n      ].map((r, i) => ({ ...r, open: open[i] ? 'true' : 'false', detailDisp: open[i] ? 'table-row' : 'none', detail: det[i], moreLabel: open[i] ? 'أقل' : 'المزيد…', toggle: () => this.setState({ open: { ...open, [i]: !open[i] } }) })),\n      register: [\n        { k: 'تعريف الوثيقة', v: 'تقارير التدقيق وردود الإدارة' }, { k: 'بيانات الفهرسة', v: 'العنوان، المرجع، التاريخ، الجهة المدقَّقة' },\n        { k: 'النظام', v: 'SharePoint · موقع التدقيق الداخلي' }, { k: 'الترميز', v: 'SS-IA-RE-###' }, { k: 'الموقع', v: 'الأرشيف الإلكتروني' },\n        { k: 'المسوّغ', v: 'ميثاق لجنة التدقيق §7' }, { k: 'العملية المرتبطة', v: 'إعداد تقارير التدقيق · السياسة IA-PY-01' },\n      ],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1200}}});
