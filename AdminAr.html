-03', rule: 'HOLD-01', status: 'تسجيل مزدوج', bg: ok[0], fg: ok[1] },\n        { when: '06 نوفمبر 2026 · 08:52', who: 'مزوّد الرموز في النظام', what: 'نبضة بث التدقيق', rule: 'SYS-00', status: 'مُرسل', bg: ok[0], fg: ok[1] },\n      ],\n    };\n    const st = this.state || {};\n    const section = st.section || 'wf', wfSel = st.wf || 0, mode = st.mode || 'rules', added = !!st.added;\n    const theme = st.theme || 'light', palette = st.palette || 'emerald', fontSel = st.font || 'brand';\n    const wfs = T.wf;\n    const cur = wfs[wfSel] || wfs[0];\n    const isDA = wfSel === 0;\n    const navBg = (on) => on ? '#005F4F' : 'transparent', navFg = (on) => on ? '#FFFFFF' : '#003234';\n    const seg = (list, val, key) => list.map(([id, label]) => ({ label, sel: val === id ? 'true' : 'false', bg: val === id ? '#FFFFFF' : 'transparent', weight: val === id ? 700 : 400, fg: val === id ? '#003234' : '#3D5F60', pick: () => this.setState({ [key]: id }) }));\n    const rules = added ? [...T.rules.slice(0, 4), T.r6, T.rules[4]] : T.rules;\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      wf: wfs.map(([name, v], i) => { const on = section === 'wf' && i === wfSel; return { name, v, cur: on ? 'page' : 'false', fg: navFg(on), bg: navBg(on), weight: on ? 700 : 400, pick: () => this.setState({ section: 'wf', wf: i }) }; }),\n      cfg: T.cfg.map(([id, label]) => { const on = section === id; return { label, cur: on ? 'page' : 'false', fg: navFg(on), bg: navBg(on), weight: on ? 700 : 400, pick: () => this.setState({ section: id }) }; }),\n      showWf: section === 'wf', showRet: section === 'ret', showRoles: section === 'roles', showAudit: section === 'audit', showSettingsHead: section === 'settings',\n      showAppearance: section === 'wf' || section === 'settings', isDA, notDA: !isDA, wfName: cur[0], wfV: cur[1], pubV: isDA ? 'v8' : 'v' + (parseInt(cur[1].slice(1), 10) + 1),\n      modes: seg(T.modes, mode, 'mode')
