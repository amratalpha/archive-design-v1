<script>
DCRun(window.DAS_COMPONENTS, {"name": "ClassificationDark", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #003234; color: #FFFFFF; font-family: 'Roboto',system-ui,sans-serif; font-size: 14px; line-height: 1.45\">\n<dc-import name=\"SidebarDark\" active=\"classification\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"TopbarDark\" page=\"Classification\" crumb=\"Classification\" persona=\"rashed\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div><div style=\"font-size: 13px; color: #BFD0CC\">Business classification scheme · v12 published · draft v13<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 32px\">Classification scheme<\/h1><\/div>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n<button type=\"button\" onClick=\"{{onHistory}}\" style=\"height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; color: #7DC4A6; font: inherit; font-weight: 700; cursor: pointer\">Version history<\/button>\n<button type=\"button\" onClick=\"{{onDiscard}}\" style=\"height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #4F8A7E; background: #00453F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">Discard draft<\/button>\n<button type=\"button\" onClick=\"{{onSave}}\" style=\"height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #4F8A7E; background: #00453F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">Save draft<\/button>\n<button type=\"button\" onClick=\"{{onPublish}}\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #67BA97; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">Publish v13<\/button>\n<\/div>\n<\/div>\n\n<div role=\"status\" style=\"padding: 12px 16px; border-radius: 10px; background: #4A3A17; color: #F3BF6D; font-size: 13px\">Draft threshold 0.75 differs from the published 0.70. 38 documents from the last 30 days would move to the exception queue.<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n<sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"5\">\n<dc-import name=\"StatTileDark\" label=\"{{k.label}}\" value=\"{{k.n}}\" sub=\"{{k.sub}}\" icon=\"{{k.icon}}\" tone=\"{{k.tone}}\" href=\"{{k.href}}\" hint-size=\"100%,146px\"><\/dc-import>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<nav aria-labelledby=\"ts-h\" style=\"flex: 1 1 260px; max-width: 320px; min-width: 0; background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><h2 id=\"ts-h\" style=\"margin: 0; font-size: 15px; font-weight: 700\">Term store<\/h2><button type=\"button\" aria-label=\"Add term\" onClick=\"{{onAddTerm}}\" style=\"width: 36px; height: 36px; border-radius: 8px; border: 1px solid #005F4F; background: #00453F; color: #7DC4A6; font-weight: 700; font-size: 18px; cursor: pointer\">+<\/button><\/div>\n<label for=\"cl-find\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Find term<\/label>\n<input id=\"cl-find\" placeholder=\"Find term…\" style=\"height: 40px; border-radius: 10px; border: 1px solid #2E6E64; padding: 0 12px; font: inherit; color: #FFFFFF\">\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px\">\n<sc-for list=\"{{terms}}\" as=\"t\" hint-placeholder-count=\"8\">\n<li><button type=\"button\" onClick=\"{{t.pick}}\" aria-current=\"{{t.cur}}\" style=\"width: 100%; border: 0; font: inherit; text-align: start; cursor: pointer; display: flex; gap: 8px; align-items: center; min-height: 34px; padding: 0 10px; padding-inline-start: {{t.pad}}; border-radius: 8px; text-decoration: none; color: {{t.fg}}; background: {{t.bg}}; font-weight: {{t.weight}}\"><span style=\"flex: 1\">{{t.label}}<\/span><span style=\"font-size: 11px; padding: 1px 6px; border-radius: 4px; background: {{t.stBg}}; color: {{t.stFg}}\">{{t.status}}<\/span><\/button><\/li>\n<\/sc-for>\n<\/ul>\n<\/nav>\n\n<section style=\"flex: 999 1 560px; min-width: 0; background: #00453F; border-radius: 12px; border: 1px solid #005F4F\">\n<div role=\"tablist\" aria-label=\"Scheme views\" style=\"display: flex; gap: 24px; padding: 0 20px; border-bottom: 1px solid #005F4F; overflow-x: auto\">\n<sc-for list=\"{{tabs}}\" as=\"v\" hint-placeholder-count=\"4\">\n<button type=\"button\" role=\"tab\" aria-selected=\"{{v.sel}}\" onClick=\"{{v.pick}}\" style=\"height: 48px; border: 0; border-bottom: 3px solid {{v.line}}; background: transparent; font: inherit; font-weight: {{v.weight}}; color: {{v.fg}}; white-space: nowrap; cursor: pointer\">{{v.label}}<\/button>\n<\/sc-for>\n<\/div>\n\n<sc-if value=\"{{showRules}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center\">\n<label for=\"cl-th\" style=\"font-weight: 700\">Confidence threshold<\/label>\n<input id=\"cl-th\" type=\"range\" min=\"0\" max=\"100\" value=\"75\" style=\"flex: 1 1 200px; accent-color: #269D6A\">\n<span style=\"font-family: 'Roboto',system-ui,sans-serif; font-size: 22px; color: #269D6A\">0.75<\/span>\n<\/div>\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 760px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #BFD0CC\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #005F4F\">When<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Signal<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Then classify as<\/th>\n<th scope=\"col\" style=\"text-align: end; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Weight<\/th>\n<th scope=\"col\" style=\"text-align: end; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Matched · 30 d<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 8px; border-bottom: 1px solid #005F4F\">Precision<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{rules}}\" as=\"r\" hint-placeholder-count=\"5\">\n<tr>\n<td style=\"padding: 12px 20px; border-bottom: 1px solid #0B5048; font-family: 'Roboto Mono',Consolas,monospace\">{{r.when}}<\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048\"><span style=\"padding: 2px 8px; border-radius: 6px; background: #1F5A54; color: #D9DAE3\">{{r.signal}}<\/span><\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048; font-weight: 700\">{{r.then}}<\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048; text-align: end\">{{r.weight}}<\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048; text-align: end\">{{r.matched}}<\/td>\n<td style=\"padding: 12px 20px 12px 8px; border-bottom: 1px solid #0B5048\"><span style=\"display: inline-flex; align-items: center; gap: 8px\"><span style=\"width: 70px; height: 6px; border-radius: 3px; background: #005F4F; overflow: hidden; display: block\"><span style=\"display: block; height: 100%; width: {{r.w}}; background: #269D6A\"><\/span><\/span>{{r.precision}}<\/span><\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<div style=\"padding: 14px 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; align-items: center\"><span style=\"font-size: 12px; color: #BFD0CC\">Scheme checks: 0 orphan processes · 2 terms without bound series · all labels bilingual<\/span><button type=\"button\" onClick=\"{{onAddRule}}\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #4F8A7E; background: #00453F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">+ Add rule<\/button><\/div>\n<\/sc-if>\n\n<sc-if value=\"{{showTerm}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 24px\">\n<sc-for list=\"{{termInfo}}\" as=\"d\" hint-placeholder-count=\"5\">\n<div><dt style=\"font-size: 12px; color: #BFD0CC\">{{d.k}}<\/dt><dd style=\"margin: 2px 0 0; font-weight: 700\">{{d.v}}<\/dd><\/div>\n<\/sc-for>\n<\/dl>\n<span style=\"font-size: 12px; color: #BFD0CC\">Label and status edits are kept in draft v13 and take effect only when it is published.<\/span>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{showExc}}\" hint-placeholder-val=\"{{ false }}\">\n<sc-if value=\"{{excEmpty}}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; padding: 24px 20px; color: #BFD0CC; font-size: 13px\">No open exceptions · every document is classified<\/p>\n<\/sc-if>\n<sc-if value=\"{{excAny}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 760px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #BFD0CC\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #005F4F\">Document<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Proposed classification<\/th>\n<th scope=\"col\" style=\"text-align: end; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Confidence<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 8px; border-bottom: 1px solid #005F4F\">Actions<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{exceptions}}\" as=\"x\" hint-placeholder-count=\"6\">\n<tr>\n<td style=\"padding: 12px 20px; border-bottom: 1px solid #0B5048\"><a href=\"DocumentDark.html\" style=\"font-weight: 700\">{{x.title}}<\/a><div style=\"font-family: 'Roboto Mono',Consolas,monospace; font-size: 12px; color: #BFD0CC\">{{x.code}}<\/div><\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048\">{{x.proposed}}<\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048; text-align: end; font-weight: 700; color: #F3BF6D\">{{x.conf}}<\/td>\n<td style=\"padding: 12px 20px 12px 8px; border-bottom: 1px solid #0B5048\"><span style=\"display: inline-flex; gap: 8px\"><button type=\"button\" onClick=\"{{x.accept}}\" style=\"height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: #67BA97; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">Accept<\/button><button type=\"button\" onClick=\"{{x.recl}}\" style=\"height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #4F8A7E; background: #00453F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">Reclassify<\/button><\/span><\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<\/sc-if>\n<\/sc-if>\n\n<sc-if value=\"{{showMap}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 640px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #BFD0CC\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #005F4F\">Process<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Record series<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 8px; border-bottom: 1px solid #005F4F\">Status<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{map}}\" as=\"m\" hint-placeholder-count=\"6\">\n<tr>\n<td style=\"padding: 12px 20px; border-bottom: 1px solid #0B5048\"><strong>{{m.proc}}<\/strong><\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048\">{{m.series}}<\/td>\n<td style=\"padding: 12px 20px 12px 8px; border-bottom: 1px solid #0B5048; font-weight: 700; color: {{m.fg}}\">{{m.state}}<\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<\/sc-if>\n<\/section>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #005F4F; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    this.state = { tab: 'rules', sel: 2, drafts: 0, exc: [\n        { code: 'SS-IT-CR-118', title: 'Software maintenance renewal 2026', proposed: 'FN-12 · Contracts', conf: '0.71' },\n        { code: 'SS-IT-CO-0871', title: 'Letter to vendor on SLA penalties', proposed: 'IT-RE-10 · IT contracts register', conf: '0.68' },\n        { code: 'SS-IT-ME-207', title: 'Change advisory board minutes — September', proposed: 'IT-RE-8 · Change advisory board', conf: '0.73' },\n        { code: 'SS-PG-TN-0412', title: 'Tender clarification, RFP 22/2026', proposed: 'FN-11 · Tenders', conf: '0.74' },\n        { code: 'SS-IT-SC-0093', title: 'Scanned delivery note (scanner SS-02)', proposed: 'IT-RE-1 · IT assets', conf: '0.52' },\n        { code: 'SS-PG-PO-1180', title: 'Purchase order amendment', proposed: 'PG-RE-04 · Purchase orders', conf: '0.69' },\n    ] };\n  }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const tab = st.tab || 'rules';\n    const sel = st.sel == null ? 2 : st.sel;\n    const exc = st.exc || [];\n    const S = { Active: ['#094C41', '#7DC4A6'], Draft: ['#4A3A17', '#F3BF6D'], Deprecated: ['#1F5A54', '#D9DAE3'] };\n    let ix = 0;\n    const t = (label, lvl, status, _c) => { const i = ix++; const cur = i === sel; return { label, status, lvl, i, cur: cur ? 'page' : 'false', pad: (10 + lvl * 14) + 'px', fg: cur ? '#FFFFFF' : '#FFFFFF', bg: cur ? '#005F4F' : 'transparent', weight: cur || lvl === 0 ? 700 : 400, stBg: cur ? 'rgba(255,255,255,.2)' : S[status][0], stFg: cur ? '#FFFFFF' : S[status][1] }; };\n    const terms = [\n        t('F01 Corporate governance · 1,980', 0, 'Active'), t('F02 Support services', 0, 'Active'),\n        t('F02.A01 Procurement and contracts', 1, 'Active', true), t('F02.A01.P01 Tendering', 2, 'Active'),\n        t('F02.A01.P02 Contract management', 2, 'Active'), t('F02.A01.P03 Vendor evaluation', 2, 'Draft'),\n        t('F09 Information technology', 0, 'Active'), t('F09.3.1 Ticket handling', 2, 'Active'), t('F09.4 Legacy hosting', 1, 'Deprecated'),\n    ];\n    const cur = terms[sel] || terms[2];\n    const levels = ['Function', 'Activity', 'Process'];\n    const none = 'No series bound';\n    const bound = ['DG-RE-1 · Resolutions, DG-RE-3 · Correspondence', 'IT-RE-1, IT-RE-7, IT-RE-10, PG-RE-04', 'FN-11, FN-12, PG-RE-04', 'FN-11 · Tenders', 'FN-12 · Contracts, IT-RE-10 · IT contracts register', '', 'IT-RE-1, IT-RE-7, IT-RE-8, IT-RE-12', 'IT-RE-7 · Incidents, requests and support', ''];\n    const rules = [\n        { when: 'tender, مناقصة, RFP', signal: 'Keyword', then: 'FN-11 · Tenders', weight: '0.6', matched: '412', precision: '0.96', w: '96%' },\n        { when: '^CT-\\\\d{4}-', signal: 'Pattern (regex)', then: 'FN-12 · Contracts', weight: '0.8', matched: '188', precision: '0.99', w: '99%' },\n        { when: 'scanner SS-02', signal: 'Source channel', then: 'IT-RE-1 · IT assets', weight: '0.3', matched: '64', precision: '0.81', w: '81%' },\n        { when: 'DOC_CLASS = PO', signal: 'ERP document class', then: 'PG-RE-04 · Purchase orders', weight: '0.7', matched: '1,104', precision: '0.98', w: '98%' },\n        { when: 'DAS text model v3', signal: 'Text model', then: 'IT-11 · best match', weight: '0.4', matched: '2,930', precision: '0.88', w: '88%' },\n    ];\n    for (let k = 0; k < (st.drafts || 0); k++) rules.push({ when: 'new keyword', signal: 'Keyword', then: 'Choose series · draft', weight: '0.5', matched: '—', precision: '—', w: '0%' });\n    const acc = x => 'Accepted · ' + x.code + ' → ' + x.proposed, recl = x => x.code + ' sent back for reclassification';\n    const drop = x => this.setState({ exc: (this.state.exc || []).filter(y => y.code !== x.code) });\n    return {\n      kpis: [\n        { label: 'Functions', n: '12', sub: 'Scheme v12 · published 2 Mar 2026', icon: 'layers', tone: 'default', href: '' },\n        { label: 'Activities', n: '68', sub: 'Across 12 functions', icon: 'folder', tone: 'default', href: '' },\n        { label: 'Processes', n: '241', sub: 'Across 68 activities', icon: 'tasks', tone: 'default', href: '' },\n        { label: 'Auto-classified · 30 d', n: '94 %', sub: 'Published threshold 0.70', icon: 'check', tone: 'default', href: '' },\n        { label: 'Exceptions open', n: String(exc.length), sub: 'Below threshold · awaiting review', icon: 'alert', tone: 'default', href: '' },\n      ],\n      terms: terms.map(x => ({ ...x, pick: () => this.setState({ sel: x.i }) })),\n      tabs: [['term', 'Term'], ['rules', 'Auto-classification rules'], ['exc', 'Exceptions · ' + exc.length], ['map', 'Process → series map']].map(([id, label]) => ({ label, sel: tab === id ? 'true' : 'false', line: tab === id ? '#269D6A' : 'transparent', weight: tab === id ? 700 : 400, fg: tab === id ? '#FFFFFF' : '#BFD0CC', pick: () => this.setState({ tab: id }) })),\n      showTerm: tab === 'term', showRules: tab === 'rules', showExc: tab === 'exc', showMap: tab === 'map',\n      termInfo: [{ k: 'Term', v: cur.label }, { k: 'Level', v: levels[cur.lvl] }, { k: 'Status', v: cur.status }, { k: 'Bound series', v: bound[cur.i] || none }, { k: 'Labels', v: 'Arabic · English' }],\n      rules,\n      exceptions: exc.map(x => ({ ...x, accept: () => { drop(x); this.say(acc(x)); }, recl: () => { drop(x); this.say(recl(x)); } })),\n      excEmpty: exc.length === 0, excAny: exc.length > 0,\n      map: [\n        { proc: 'F02.A01.P01 Tendering', series: 'FN-11 · Tenders', state: 'Bound', fg: '#7DC4A6' },\n        { proc: 'F02.A01.P02 Contract management', series: 'FN-12 · Contracts · IT-RE-10 · IT contracts register', state: 'Bound', fg: '#7DC4A6' },\n        { proc: 'F02.A01.P03 Vendor evaluation', series: '—', state: 'No series bound', fg: '#F09A8A' },\n        { proc: 'F02.A01 Purchase orders', series: 'PG-RE-04 · Purchase orders', state: 'Bound', fg: '#7DC4A6' },\n        { proc: 'F09.3.1 Ticket handling', series: 'IT-RE-7 · Incidents, requests and support', state: 'Bound', fg: '#7DC4A6' },\n        { proc: 'F09.4 Legacy hosting', series: '—', state: 'No series bound · deprecated', fg: '#F09A8A' },\n      ],\n      onHistory: () => this.say('v12 published 02 Mar 2026 · v13 draft in progress'),\n      onDiscard: () => { this.setState({ drafts: 0 }); this.say('Draft v13 discarded · v12 values restored'); },\n      onSave: () => this.say('Draft v13 saved'),\n      onPublish: () => this.say('v13 sent for publishing · takes effect on approval'),\n      onAddTerm: () => this.say('New draft term added under ' + cur.label),\n      onAddRule: () => { this.setState({ drafts: (st.drafts || 0) + 1, tab: 'rules' }); this.say('Draft rule added · set its signal and series'); },\n      toastOn: !!st.toast, toastText: st.toast || '',\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1100}}});
</script>
