DCRun(window.DAS_COMPONENTS, {"name": "CaptureBatchDark", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #003234; color: #FFFFFF; font-family: 'Roboto',system-ui,sans-serif; font-size: 14px; line-height: 1.45\">\n<dc-import name=\"SidebarDark\" active=\"capture\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"TopbarDark\" page=\"CaptureBatch\" crumb=\"Capture / B-2201\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<a href=\"CaptureQueueDark.html\" style=\"font-weight: 700; font-size: 13px; text-decoration: none\">← Back to queue<\/a>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div><div style=\"font-size: 13px; color: #BFD0CC\">B-2201 · My Files · Google Drive /DAS rollout (TR-1043)<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 32px\">Index batch · 3 files<\/h1><\/div>\n<fieldset style=\"border: 0; margin: 0; padding: 0; display: flex; align-items: center; gap: 10px\">\n<legend style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Declare as<\/legend>\n<span style=\"font-size: 13px; color: #BFD0CC\">Declare as<\/span>\n<span style=\"display: inline-flex; background: #003234; border-radius: 10px; padding: 4px; gap: 4px\">\n<label style=\"height: 38px; padding: 0 14px; border-radius: 8px; background: #00453F; font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(0,50,52,.14)\"><input type=\"radio\" name=\"decl\" checked=\"\" style=\"accent-color: #7DC4A6\">Individual records<\/label>\n<label style=\"height: 38px; padding: 0 14px; border-radius: 8px; display: flex; align-items: center; gap: 8px; color: #BFD0CC\"><input type=\"radio\" name=\"decl\" style=\"accent-color: #7DC4A6\">One dossier (grouped)<\/label>\n<\/span>\n<\/fieldset>\n<\/div>\n\n<sc-if value=\"{{editing}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<div style=\"flex: 3 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<section aria-labelledby=\"sh-h\" style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px\">\n<h2 id=\"sh-h\" style=\"margin: 0 0 4px; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">Shared metadata<\/h2>\n<div style=\"font-size: 12px; color: #BFD0CC; margin-bottom: 14px\">Applies to every file in the batch. Override per file below.<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px\">\n<sc-for list=\"{{shared}}\" as=\"f\" hint-placeholder-count=\"12\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"{{f.id}}\" style=\"font-size: 13px; font-weight: 700\">{{f.label}}<\/label>\n<input id=\"{{f.id}}\" value=\"{{f.value}}\" style=\"height: 42px; border-radius: 10px; border: 1px solid #2E6E64; padding: 0 12px; font: inherit; color: #FFFFFF; background: {{f.bg}}\"><\/div>\n<\/sc-for>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"pf-h\" style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F\">\n<h2 id=\"pf-h\" style=\"margin: 0; padding: 16px 20px; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px; border-bottom: 1px solid #005F4F\">Per file<\/h2>\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 820px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #BFD0CC\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #005F4F\">#<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #005F4F\">File<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Title EN<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Title AR<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Ref #<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #005F4F\">Date<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 8px; border-bottom: 1px solid #005F4F\">Document type<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{files}}\" as=\"r\" hint-placeholder-count=\"3\">\n<tr>\n<td style=\"padding: 12px 20px; border-bottom: 1px solid #0B5048\">{{r.n}}<\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048; font-weight: 700\">{{r.file}}<\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048\">{{r.en}}<\/td>\n<td dir=\"rtl\" style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048; text-align: start\">{{r.ar}}<\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048; font-family: 'Roboto Mono',Consolas,monospace\">{{r.ref}}<\/td>\n<td style=\"padding: 12px 8px; border-bottom: 1px solid #0B5048\">{{r.date}}<\/td>\n<td style=\"padding: 12px 20px 12px 8px; border-bottom: 1px solid #0B5048\">{{r.type}} <button type=\"button\" aria-expanded=\"{{r.open}}\" onClick=\"{{r.toggle}}\" style=\"font: inherit; font-size: 12px; margin-inline-start: 6px; padding: 0; border: 0; background: transparent; color: #7DC4A6; text-decoration: underline; cursor: pointer\">{{r.moreLabel}}<\/button><\/td>\n<\/tr>\n<tr style=\"display: {{r.detailDisp}}; background: #003B3C\"><td style=\"padding: 0 20px; border-bottom: 1px solid #0B5048\"><\/td><td colspan=\"6\" style=\"padding: 10px 20px 12px 8px; border-bottom: 1px solid #0B5048; font-size: 12px; color: #BFD0CC\">{{r.detail}}<\/td><\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<\/section>\n<\/div>\n\n<aside aria-labelledby=\"reg-h\" style=\"flex: 2 1 320px; min-width: 0; background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<div><span style=\"font-size: 12px; color: #BFD0CC\">From the division records register<\/span>\n<h2 id=\"reg-h\" style=\"margin: 2px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">IA-RE-1 · Internal audit reports<\/h2><\/div>\n<dl style=\"margin: 0; display: grid; grid-template-columns: 130px 1fr; gap: 10px 12px; font-size: 13px\">\n<sc-for list=\"{{register}}\" as=\"d\" hint-placeholder-count=\"8\">\n<dt style=\"color: #BFD0CC\">{{d.k}}<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.v}}<\/dd>\n<\/sc-for>\n<\/dl>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px\">\n<div style=\"background: #003234; border-radius: 10px; padding: 10px; text-align: center\"><div style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 700; font-size: 26px; color: #269D6A\">2<\/div><div style=\"font-size: 12px\">Paper yrs<\/div><\/div>\n<div style=\"background: #003234; border-radius: 10px; padding: 10px; text-align: center\"><div style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 700; font-size: 26px; color: #269D6A\">5<\/div><div style=\"font-size: 12px\">In division<\/div><\/div>\n<div style=\"background: #003234; border-radius: 10px; padding: 10px; text-align: center\"><div style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 700; font-size: 26px; color: #269D6A\">10<\/div><div style=\"font-size: 12px\">E-archive yrs<\/div><\/div>\n<\/div>\n<\/aside>\n<\/div>\n\n<div style=\"display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap\">\n<a href=\"CaptureQueueDark.html\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: transparent; color: #7DC4A6; font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">Cancel<\/a>\n<button type=\"button\" onClick=\"{{onSave}}\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #4F8A7E; background: #00453F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">Save draft<\/button>\n<button type=\"button\" onClick=\"{{onConfirm}}\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #67BA97; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">Confirm index and submit batch<\/button>\n<\/div>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{done}}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"cb-done-h\" style=\"background: #00453F; border-radius: 12px; border: 1px solid #005F4F; padding: 28px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center\">\n<span style=\"width: 56px; height: 56px; border-radius: 14px; background: #094C41; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7DC4A6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg><\/span>\n<div style=\"flex: 1 1 360px; display: flex; flex-direction: column; gap: 4px\">\n<span style=\"align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #4A3A17; color: #F3BF6D\">3 records pending approval<\/span>\n<h2 id=\"cb-done-h\" style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 22px\">Batch submitted for approval<\/h2>\n<p style=\"margin: 0; color: #BFD0CC\">Codes SS-IA-RE-112 to SS-IA-RE-114 reserved · batch B-2201 routed to the Head of Internal Audit for approval.<\/p>\n<\/div>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<a href=\"CaptureQueueDark.html\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #4F8A7E; background: #00453F; color: #FFFFFF; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">Back to queue<\/a>\n<a href=\"ApprovalsDark.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #67BA97; color: #003234; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">Open approvals<\/a>\n<\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #005F4F; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { open: {}, done: false, toast: null }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const open = st.open || {};\n    const det = ['18 pages · OCR 0.98 · 2.4 MB · proposal IA-RE-1 at 0.84', '6 pages · Word converted to PDF/A-2b · 410 KB · proposal IA-RE-1 at 0.81', '4 pages · OCR 0.95 · 620 KB · alternative GV-RE-3 at 0.12'];\n    let n = 0;\n    const f = (label, value, locked) => ({ id: 'cb-' + (++n), label, value, bg: locked ? '#003234' : '#00453F' });\n    return {\n      toastOn: !!st.toast, toastText: st.toast || '',\n      editing: !st.done, done: !!st.done,\n      onSave: () => this.say('Batch B-2201 draft saved'),\n      onConfirm: () => { this.setState({ done: true }); this.say('Batch B-2201 submitted · 3 files awaiting approval'); },\n      shared: [\n        f('Sector', 'SS · Support Services'), f('Division', 'IA · Internal Audit & Risk'), f('Date of issue', '2026-09-30'),\n        f('Document set', 'DAS rollout audit'), f('Process name', 'Audit reporting'), f('New code', 'Reserved on declare', true),\n        f('Confidentiality', 'Confidential'), f('Physical or digital form', 'Digital'), f('Creator · owner', 'Abeer A. · Head of IA'),\n        f('Preservation years', '5', true), f('Archive retention years', '10', true), f('Final action', 'Appraise', true),\n      ],\n      files: [\n        { n: 1, file: 'Rollout audit — findings.pdf', en: 'DAS rollout audit — findings', ar: 'تدقيق إطلاق النظام — النتائج', ref: '2026/IA/112', date: '2026-09-30', type: 'Report' },\n        { n: 2, file: 'Management response.docx', en: 'Management response', ar: 'رد الإدارة', ref: '2026/IA/113', date: '2026-10-02', type: 'Report' },\n        { n: 3, file: 'Steering minutes.pdf', en: 'Steering committee minutes — September', ar: 'محضر اللجنة التوجيهية — سبتمبر', ref: '2026/IA/114', date: '2026-09-24', type: 'Meeting minutes' },\n      ].map((r, i) => ({ ...r, open: open[i] ? 'true' : 'false', detailDisp: open[i] ? 'table-row' : 'none', detail: det[i], moreLabel: open[i] ? 'Less' : 'More…', toggle: () => this.setState({ open: { ...open, [i]: !open[i] } }) })),\n      register: [\n        { k: 'Document definition', v: 'Audit reports and management responses' }, { k: 'Index data', v: 'Title, ref., date, auditee' },\n        { k: 'System', v: 'SharePoint · IA site' }, { k: 'Coding', v: 'SS-IA-RE-###' }, { k: 'Location', v: 'E-archive' },\n        { k: 'Justification', v: 'Audit committee charter §7' }, { k: 'Linked process', v: 'Audit reporting · Policy IA-PY-01' },\n      ],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1200}}});
