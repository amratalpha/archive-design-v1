<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal holds · DAS prototype</title>
<style>body{margin:0}</style>
<script src="das-runtime.js"></script>
<script src="components.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script>
DCRun(window.DAS_COMPONENTS, {"name": "LegalHolds", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Roboto',system-ui,sans-serif; font-size: 14px; line-height: 1.45\">\n<dc-import name=\"Sidebar\" active=\"legalHolds\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"LegalHolds\" crumb=\"Legal holds\" persona=\"rashed\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div><div style=\"font-size: 13px; color: #4A6B6C\">Legal hold apply / release · restricted to DAS-LegalHold · dual-logged<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 32px\">Legal holds<\/h1><\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<div style=\"flex: 3 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<sc-for list=\"{{holds}}\" as=\"h\" hint-placeholder-count=\"3\">\n<article style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center\">\n<div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\"><span style=\"font-family: 'Roboto Mono',Consolas,monospace; font-weight: 700\">{{h.ref}}<\/span><span style=\"padding: 2px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; background: {{h.bg}}; color: {{h.fg}}\">{{h.status}}<\/span><\/div>\n<span style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 17px\">{{h.matter}}<\/span>\n<span style=\"font-size: 13px; color: #4A6B6C\">Scope {{h.scope}} · applied by {{h.by}}<\/span>\n<\/div>\n<div style=\"text-align: end\"><div style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 700; font-size: 30px; color: #269D6A\">{{h.items}}<\/div><div style=\"font-size: 12px; color: #4A6B6C\">items held<\/div><\/div>\n<sc-if value=\"{{h.isLink}}\" hint-placeholder-val=\"{{ false }}\"><a href=\"Document.html\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">{{h.cta}}<\/a><\/sc-if>\n<sc-if value=\"{{h.isBtn}}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" onClick=\"{{h.act}}\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\">{{h.cta}}<\/button><\/sc-if>\n<\/article>\n<\/sc-for>\n<\/div>\n\n<form aria-labelledby=\"nh-h\" style=\"flex: 2 1 340px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<h2 id=\"nh-h\" style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">New hold<\/h2>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"lh-m\" style=\"font-size: 13px; font-weight: 700\">Matter<\/label><input id=\"lh-m\" placeholder=\"e.g. Case 052/2026 — contract claim\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234\"><\/div>\n<fieldset style=\"border: 0; margin: 0; padding: 0\"><legend style=\"font-size: 13px; font-weight: 700; margin-bottom: 8px\">Scope type<\/legend>\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px\">\n<label style=\"display: flex; gap: 8px; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 8px; border: 2px solid #269D6A; background: #F4FAF7\"><input type=\"radio\" name=\"scope\" checked style=\"accent-color: #005F4F\">Record series<\/label>\n<label style=\"display: flex; gap: 8px; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid #DCE3E0\"><input type=\"radio\" name=\"scope\" style=\"accent-color: #005F4F\">Division<\/label>\n<label style=\"display: flex; gap: 8px; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid #DCE3E0\"><input type=\"radio\" name=\"scope\" style=\"accent-color: #005F4F\">Date range<\/label>\n<label style=\"display: flex; gap: 8px; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid #DCE3E0\"><input type=\"radio\" name=\"scope\" style=\"accent-color: #005F4F\">Named items<\/label>\n<\/div><\/fieldset>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"lh-s\" style=\"font-size: 13px; font-weight: 700\">Scope<\/label><input id=\"lh-s\" value=\"PG-RE-18, PG-RE-04\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234\"><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"lh-a\" style=\"font-size: 13px; font-weight: 700\">Authority / case reference<\/label><input id=\"lh-a\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; color: #003234\"><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"lh-2\" style=\"font-size: 13px; font-weight: 700\">Second signer<\/label><select id=\"lh-2\" style=\"height: 44px; border-radius: 10px; border: 1px solid #CCC9B4; padding: 0 12px; font: inherit; background: #FFFFFF; color: #003234\"><option>Noura K.<\/option><option>Omar R.<\/option><option>Huda S.<\/option><option>Faisal M.<\/option><\/select><\/div>\n<button type=\"button\" onClick=\"{{onApply}}\" style=\"height: 48px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\">Apply hold<\/button>\n<span style=\"font-size: 12px; color: #4A6B6C\">A hold takes effect when the second signer confirms. It suspends retention gates and disposition for every item in scope.<\/span>\n<\/form>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    this.state = { next: 2, holds: [\n          { ref: 'LH-2026-01', status: 'Pending second signer', bg: '#FAE3BE', fg: '#63420F', matter: 'Case 041/2026 — tender appeal', scope: 'PG-RE-18, PG-RE-04', by: 'Noura K.', items: '612', cta: 'Remind signer', kind: 'remind' },\n          { ref: 'LH-2025-03', status: 'Release pending', bg: '#FBDCCB', fg: '#682A0A', matter: 'Case 118/2025 — vendor dispute', scope: 'IT-RE-10 · 2019–2023', by: 'Noura K.', items: '2,410', cta: 'Send for release', kind: 'release' },\n          { ref: 'LH-2024-01', status: 'Released', bg: '#EEF0F3', fg: '#3F4146', matter: 'Internal investigation 7/2024', scope: 'HR-RE-1 · named items', by: 'Omar R.', items: '38', cta: 'View log', kind: 'log' },\n    ] };\n  }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  act(h) {\n    if (h.kind === 'remind') { this.say('Reminder sent to the second signer for ' + h.ref); return; }\n    if (h.kind === 'release') {\n      this.setState({ holds: this.state.holds.map(x => x.ref === h.ref ? { ...x, status: 'Release sent to second signer', bg: '#FAE3BE', fg: '#63420F', cta: 'Remind signer', kind: 'remind' } : x) });\n      this.say('Release of ' + h.ref + ' sent to the second signer');\n    }\n  }\n  apply() {\n    const st = this.state;\n    const ref = 'LH-2026-' + String(st.next).padStart(2, '0');\n    this.setState({ next: st.next + 1, holds: [{ ref, status: 'Pending second signer', bg: '#FAE3BE', fg: '#63420F', matter: 'Case 052/2026 — contract claim', scope: 'PG-RE-18, PG-RE-04', by: 'R. Al Shamsi', items: '—', cta: 'Remind signer', kind: 'remind' }].concat(st.holds) });\n    this.say('Hold ' + ref + ' sent to Noura K. for second signature');\n  }\n  renderVals() {\n    const st = this.state || {};\n    return {\n      holds: (st.holds || []).map(h => ({ ...h, isLink: h.kind === 'log', isBtn: h.kind !== 'log', act: () => this.act(h) })),\n      onApply: () => this.apply(),\n      toastOn: !!st.toast, toastText: st.toast || '',\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1000}}});
</script>
</body>
</html>
