\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; font-size: 13px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-weight: 700\">Theme<\/span><span style=\"display: inline-flex; background: #003234; border-radius: 10px; padding: 4px; gap: 4px; align-self: flex-start\"><sc-for list=\"{{themes}}\" as=\"o\" hint-placeholder-count=\"3\"><button type=\"button\" aria-pressed=\"{{o.sel}}\" onClick=\"{{o.pick}}\" style=\"padding: 6px 12px; border: 0; border-radius: 8px; font: inherit; background: {{o.bg}}; color: #FFFFFF; font-weight: {{o.weight}}; cursor: pointer\">{{o.label}}<\/button><\/sc-for><\/span><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-weight: 700\">Palette<\/span><span style=\"display: flex; gap: 8px\"><sc-for list=\"{{palettes}}\" as=\"o\" hint-placeholder-count=\"4\"><button type=\"button\" title=\"{{o.title}}\" aria-label=\"{{o.title}}\" aria-pressed=\"{{o.sel}}\" onClick=\"{{o.pick}}\" style=\"width: 28px; height: 28px; padding: 0; border: 0; border-radius: 14px; background: {{o.color}}; outline: {{o.outline}}; outline-offset: 2px; cursor: pointer\"><\/button><\/sc-for><\/span><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-weight: 700\">Font<\/span><span style=\"display: inline-flex; background: #003234; border-radius: 10px; padding: 4px; gap: 4px; align-self: flex-start\"><sc-for list=\"{{fonts}}\" as=\"o\" hint-placeholder-count=\"2\"><button type=\"button\" aria-pressed=\"{{o.sel}}\" onClick=\"{{o.pick}}\" style=\"padding: 6px 12px; border: 0; border-radius: 8px; font: inherit; background: {{o.bg}}; color: #FFFFFF; font-weight: {{o.weight}}; cursor: pointer\">{{o.label}}<\/button><\/sc-for><\/span><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\"><span style=\"font-weight: 700\">Accessibility<\/span><label style=\"display: flex; gap: 8px; align-items: center\"><input type=\"checkbox\" style=\"accent-color: #7DC4A6\">Reduce motion<\/label><label style=\"display: flex; gap: 8px; align-items: center\"><input type=\"checkbox\" checked style=\"accent-color: #7DC4A6\">Larger targets<\/label><\/div>\n<\/div>\n<\/section>\n<\/sc-if>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #005F4F; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { section: 'wf', wf: 0, mode: 'rules', added: false, theme: 'light', palette: 'emerald', font: 'brand' }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const ok = ['#094C41', '#7DC4A6'], warn = ['#4A3A17', '#F3BF6D'], bad = ['#4F1A10', '#F09A8A'];\n    const T = {\n      wf: [['Document approval', 'v7'], ['Classification exception', 'v3'], ['External share', 'v2'], ['Disposition', 'v4'], ['Transfer to National Archives', 'v1'], ['Retention plan change', 'v2'], ['Legal hold', 'v1']],\n      cfg: [['ret', 'Retention plan change'], ['roles', 'Roles and AD groups'], ['audit', 'Audit and SIEM'], ['settings', 'Settings and appearance']],\n      modes: [['rules', 'Rules'], ['canvas', 'Canvas'], ['simulate', 'Simulate']],\n      modeTitle: { rules: 'Routing rules · first match wins', canvas: 'Canvas · each rule drawn as its approval steps', simulate: 'Simulate · last 30 days replayed against draft v8' },\n      themes: [['light', 'Light'], ['dark', 'Dark'], ['system', 'System']], fonts: [['brand', 'Brand'], ['system', 'System']],\n      palettes: [['emerald', 'ADPF Emerald', '#269D6A'], ['jade', 'Jade', '#005F4F'], ['sand', 'Sand', '#976F30'], ['gray', 'Gray', '#63666E']],\n      tileK: ['Rules', 'Active instances', 'Median cycle', 'SLA breached · 30 d'], median: '11 h', tileSub: ['First match wins', 'Running on v7', 'SLA 16 h', 'Escalated to Sector Director'],\n      rules: [\n        { id: 'R1', when: 'Confidentiality is Secret', steps: ['Head', 'Owner', 'CISO'], mode: 'Serial', sla: '8 / 24 / 24 h', matched: '41' },\n        { id: 'R2', when: 'Type is Policy or Delegation · at least Sensitive', steps: ['Head', 'Owner'], mode: 'Serial', sla: '16 / 24 h', matched: '388' },\n        { id: 'R3', when: 'Contract · amount more than AED 500,000', steps: ['Head', 'Legal', 'Finance', 'Owner'], mode: 'Parallel · all', sla: '24 h · Sector Director', matched: '27' },\n        { id: 'R4', when: 'Classification confidence less than 0.75', steps: ['Records', 'Head'], mode: 'Serial', sla: '24 / 16 h', matched: '96' },\n        { id: 'R5', when: 'Anything else', steps: ['Head'], mode: 'Serial', sla: '16 h', matched: '732' },\n      ],\n      r6: { id: 'R6', when: 'Draft · set a condition', steps: ['Head'], mode: 'Serial', sla: '16 h', matched: '—' },\n      r6Added: 'R6 draft added above the catch-all rule', r6Already: 'R6 is already in the draft · set its condition first',\n      saved: 'Draft v8 saved', published: 'Document approval v8 published · new tasks follow v8, open ones finish on v7',\n      startedDraft: (n) => 'Draft started for ' + n, noDraft: (n) => n + ' has no draft to publish',\n      retSent: 'RPC-2026-07 sent for approval · Retention plan change workflow v2',\n      synced: 'Synced from Active Directory · 5 groups, 0 changes',\n      testEvent: 'Test event sent · SIEM acknowledged in 0.4 s',\n      settingsSaved: 'Appearance settings saved for all users',\n      retention: [\n        { series: 'IT-RE-10 · IT contracts register', now: '5 yrs active + 10 yrs archive · appraise', next: '5 yrs active + 15 yrs archive · appraise', why: 'Warranty claims run past 10 years', status: 'Legal review', bg: warn[0], fg: warn[1] },\n        { series: 'IT-RE-15 · IT projects', now: '3 yrs active + 7 yrs archive · destroy', next: '3 yrs active + 7 yrs archive · appraise', why: 'Keep major programmes as evidence', status: 'Draft', bg: ok[0], fg: ok[1] },\n        { series: 'FN-RE-08 · Finance projects', now: '3 yrs active + 7 yrs archive · destroy', next: 'No change · trigger moves to project close', why: 'Align with ERP close date', status: 'Draft', bg: ok[0], fg: ok[1] },\n      ],\n      roles: [\n        { role: 'Division staff', group: 'DAS-SS-IT-Staff', members: '64', rights: 'View', sync: '08:50' },\n        { role: 'Head of division', group: 'DAS-SS-IT-Heads', members: '3', rights: 'View · edit · approve · share', sync: '08:50' },\n        { role: 'Information owner', group: 'DAS-InfoOwners', members: '11', rights: 'View · approve · share · retention', sync: '08:50' },\n        { role: 'Records manager', group: 'DAS-Records', members: '4', rights: 'File plan · holds · disposition', sync: '08:50' },\n        { role: 'Administrator', group: 'DAS-Admins', members: '2', rights: 'Configuration · no content access', sync: '08:50' },\n      ],\n      alerts: [\n        { when: '27 Sep 2026 · 16:40', who: 'A. Al Ketbi', what: 'Download blocked · Confidential', rule: 'DLP-03', status: 'Sent', bg: bad[0], fg: bad[1] },\n        { when: '14 Mar 2025 · 10:02', who: 'Noura K.', what: 'Legal hold applied · LH-2025-03', rule: 'HOLD-01', status: 'Dual-logged', bg: ok[0], fg: ok[1] },\n        { when: '06 Nov 2026 · 08:52', who: 'DAS ID provider', what: 'Audit stream heartbeat', rule: 'SYS-00', status: 'Sent', bg: ok[0], fg: ok[1] },\n      ],\n    };\n    const st = this.state || {};\n    const section = st.section || 'wf', wfSel = st.wf || 0, mode = st.mode || 'rules', added = !!st.added;\n    const theme = st.theme || 'light', palette = st.palette || 'emerald', fontSel = st.font || 'brand';\n    const wfs = T.wf;\n    const cur = wfs[wfSel] || wfs[0];\n    const isDA = wfSel === 0;\n    const navBg = (on) => on ? '#005F4F' : 'transparent', navFg = (on) => on ? '#00453F' : '#005F4F';\n    const seg = (list, val, key) => list.map(([id, label]) => ({ label, sel: val === id ? 'true' : 'false', bg: val === id ? '#00453F' : 'transparent', weight: val === id ? 700 : 400, fg: val === id ? '#FFFFFF' : '#BFD0CC', pick: () => this.setState({ [key]: id }) }));\n    const rules = added ? [...T.rules.slice(0, 4), T.r6, T.rules[4]] : T.rules;\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      wf: wfs.map(([name, v], i) => { const on = section === 'wf' && i === wfSel; return { name, v, cur: on ? 'page' : 'false', fg: navFg(on), bg: navBg(on), weight: on ? 700 : 400, pick: () => this.setState({ section: 'wf', wf: i }) }; }),\n      cfg: T.cfg.map(([id, label]) => { const on = section === id; return { label, cur: on ? 'page' : 'false', fg: navFg(on), bg: navBg(on), weight: on ? 700 : 400, pick: () => this.setState({ section: id }) }; }),\n      showWf: section === 'wf', showRet: section === 'ret', showRoles: section === 'roles', showAudit: section === 'audit', showSettingsHead: section === 'settings',\n      showAppearance: section === 'wf' || section === 'settings', isDA, notDA: !isDA, wfName: cur[0], wfV: cur[1], pubV: isDA ? 'v8' : 'v' + (parseInt(cur[1].slice(1), 10) + 1),\n      modes: seg(T.modes, mode, 'mode'), rulesTitle: T.modeTitle[mode],\n      themes: seg(T.themes, theme, 'theme'), fonts: seg(T.fonts, fontSel, 'font'),\n      palettes: T.palettes.map(([id, title, color]) => ({ title, color, sel: palette === id ? 'true' : 'false', outline: palette === id ? '2px solid #005F4F' : '2px solid transparent', pick: () => this.setState({ palette: id }) })),\n      tiles: [\n        { label: T.tileK[0], n: added ? '6' : '5', sub: T.tileSub[0], icon: 'layers', tone: 'default', href: '' },\n        { label: T.tileK[1], n: '42', sub: T.tileSub[1], icon: 'tasks', tone: 'default', href: 'ApprovalsDark.html' },\n        { label: T.tileK[2], n: T.median, sub: T.tileSub[2], icon: 'clock', tone: 'default', href: '' },\n        { label: T.tileK[3], n: '3', sub: T.tileSub[3], icon: 'alert', tone: 'alert', href: 'ApprovalsDark.html' },\n      ],\n      rules,\n      onSave: () => this.say(isDA ? T.saved : T.startedDraft(cur[0])),\n      onPublish: () => this.say(isDA ? T.published : T.noDraft(cur[0])),\n      onStart: () => this.say(T.startedDraft(cur[0])),\n      onAddRule: () => { if (added) { this.say(T.r6Already); return; } this.setState({ added: true }); this.say(T.r6Added); },\n      onSubmitRet: () => this.say(T.retSent), onSync: () => this.say(T.synced), onTestEvent: () => this.say(T.testEvent), onSaveSettings: () => this.say(T.settingsSaved),\n      retention: T.retention, roles: T.roles, alerts: T.alerts,\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1200}}});
