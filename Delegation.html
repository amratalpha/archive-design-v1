<script>
DCRun(window.DAS_COMPONENTS, {"name": "Delegation", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Roboto',system-ui,sans-serif; font-size: 14px; line-height: 1.45\">\n<dc-import name=\"Sidebar\" active=\"delegation\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"Delegation\" crumb=\"Delegation\" persona=\"khalid\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div><div style=\"font-size: 13px; color: #4A6B6C\">Delegation of authority · DoA-2026<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 32px\">Delegation<\/h1><\/div>\n<button type=\"button\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{onNew}}\">+ New delegation<\/button>\n<\/div>\n\n<div role=\"tablist\" aria-label=\"Delegation views\" style=\"display: flex; gap: 24px; border-bottom: 1px solid #DCE3E0; overflow-x: auto\">\n<sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"4\">\n<button type=\"button\" role=\"tab\" aria-selected=\"{{t.sel}}\" onClick=\"{{t.pick}}\" style=\"height: 44px; border: 0; border-bottom: 3px solid {{t.line}}; background: transparent; font: inherit; font-weight: {{t.weight}}; color: {{t.fg}}; white-space: nowrap; cursor: pointer\">{{t.label}}<\/button>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<div style=\"flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<sc-if value=\"{{showMine}}\" hint-placeholder-val=\"{{ true }}\">\n<sc-for list=\"{{mine}}\" as=\"d\" hint-placeholder-count=\"2\">\n<article style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\"><span style=\"padding: 2px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; background: {{d.stBg}}; color: {{d.stFg}}\">{{d.status}}<\/span><span style=\"padding: 2px 10px; border-radius: 6px; font-size: 12px; background: #EEF0F3; color: #3F4146\">{{d.kind}}<\/span><span style=\"flex: 1\"><\/span><span style=\"font-size: 13px; color: #4A6B6C\">{{d.period}}<\/span><\/div>\n<div style=\"display: flex; gap: 14px; align-items: center\"><span style=\"width: 44px; height: 44px; border-radius: 22px; background: #E2F1EA; color: #005F4F; font-weight: 700; display: flex; align-items: center; justify-content: center\">{{d.ini}}<\/span><div><div style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">To {{d.to}}<\/div><div style=\"font-size: 13px; color: #4A6B6C\">{{d.reason}}<\/div><\/div><\/div>\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; background: #F9F9F5; border-radius: 10px; padding: 12px; font-size: 13px\">\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">Scope<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.scope}}<\/dd><\/div>\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">Max confidentiality<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.max}}<\/dd><\/div>\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">Amount limit<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.limit}}<\/dd><\/div>\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">Tasks routed<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.routed}}<\/dd><\/div>\n<\/dl>\n<div style=\"display: flex; gap: 8px; justify-content: flex-end\"><button type=\"button\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{d.edit}}\">Edit<\/button><button type=\"button\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #D12101; background: #FFFFFF; color: #B01C01; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{d.revoke}}\">Revoke<\/button><\/div>\n<\/article>\n<\/sc-for>\n<\/sc-if>\n\n<sc-if value=\"{{showToMe}}\" hint-placeholder-val=\"{{ false }}\">\n<sc-for list=\"{{toMe}}\" as=\"d\" hint-placeholder-count=\"1\">\n<article style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\"><span style=\"padding: 2px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; background: {{d.stBg}}; color: {{d.stFg}}\">{{d.status}}<\/span><span style=\"padding: 2px 10px; border-radius: 6px; font-size: 12px; background: #EEF0F3; color: #3F4146\">{{d.kind}}<\/span><span style=\"flex: 1\"><\/span><span style=\"font-size: 13px; color: #4A6B6C\">{{d.period}}<\/span><\/div>\n<div style=\"display: flex; gap: 14px; align-items: center\"><span style=\"width: 44px; height: 44px; border-radius: 22px; background: #E2F1EA; color: #005F4F; font-weight: 700; display: flex; align-items: center; justify-content: center\">{{d.ini}}<\/span><div><div style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">From {{d.from}}<\/div><div style=\"font-size: 13px; color: #4A6B6C\">{{d.reason}}<\/div><\/div><\/div>\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; background: #F9F9F5; border-radius: 10px; padding: 12px; font-size: 13px\">\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">Scope<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.scope}}<\/dd><\/div>\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">Max confidentiality<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.max}}<\/dd><\/div>\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">Amount limit<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.limit}}<\/dd><\/div>\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">Tasks routed<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.routed}}<\/dd><\/div>\n<\/dl>\n<div style=\"display: flex; gap: 8px; justify-content: flex-end\"><a href=\"Approvals.html\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">Open routed tasks<\/a><\/div>\n<\/article>\n<\/sc-for>\n<\/sc-if>\n\n<sc-if value=\"{{showLog}}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"dlog-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<h2 id=\"dlog-h\" style=\"margin: 0; padding: 16px 20px; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px; border-bottom: 1px solid #E5E2CB\">Delegation log<\/h2>\n<div style=\"overflow-x: auto\"><table style=\"width: 100%; border-collapse: collapse; min-width: 560px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\"><th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">When<\/th><th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Event<\/th><th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 8px; border-bottom: 1px solid #E5E2CB\">By<\/th><\/tr><\/thead>\n<tbody><sc-for list=\"{{log}}\" as=\"g\" hint-placeholder-count=\"4\"><tr><td style=\"padding: 12px 20px; border-bottom: 1px solid #F0EEE2; white-space: nowrap; color: #4A6B6C\">{{g.when}}<\/td><td style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2\">{{g.what}}<\/td><td style=\"padding: 12px 20px 12px 8px; border-bottom: 1px solid #F0EEE2; font-weight: 700\">{{g.who}}<\/td><\/tr><\/sc-for><\/tbody>\n<\/table><\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{showDoa}}\" hint-placeholder-val=\"{{ true }}\">\n<section aria-labelledby=\"doa-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<h2 id=\"doa-h\" style=\"margin: 0; padding: 16px 20px; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px; border-bottom: 1px solid #E5E2CB\">DoA matrix<\/h2>\n<div style=\"overflow-x: auto\"><table style=\"width: 100%; border-collapse: collapse; min-width: 680px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\"><th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">Role<\/th><th scope=\"col\" style=\"padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Document approval<\/th><th scope=\"col\" style=\"padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Share<\/th><th scope=\"col\" style=\"text-align: end; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Contracts (AED)<\/th><th scope=\"col\" style=\"padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">Disposition<\/th><th scope=\"col\" style=\"padding: 10px 20px 10px 8px; border-bottom: 1px solid #E5E2CB\">Can delegate<\/th><\/tr><\/thead>\n<tbody><sc-for list=\"{{doa}}\" as=\"m\" hint-placeholder-count=\"3\"><tr><td style=\"padding: 12px 20px; border-bottom: 1px solid #F0EEE2; font-weight: 700\">{{m.role}}<\/td><td style=\"text-align: center; border-bottom: 1px solid #F0EEE2; color: #005F4F; font-weight: 700\">✓<\/td><td style=\"text-align: center; border-bottom: 1px solid #F0EEE2; color: #005F4F; font-weight: 700\">✓<\/td><td style=\"text-align: end; padding: 12px 8px; border-bottom: 1px solid #F0EEE2; font-weight: 700\">{{m.limit}}<\/td><td style=\"text-align: center; border-bottom: 1px solid #F0EEE2\">{{m.disp}}<\/td><td style=\"text-align: center; padding-inline-end: 20px; border-bottom: 1px solid #F0EEE2\">{{m.can}}<\/td><\/tr><\/sc-for><\/tbody>\n<\/table><\/div>\n<\/section>\n<\/sc-if>\n<\/div>\n\n<aside aria-labelledby=\"auth-h\" style=\"flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"background: #003234; color: #FFFFFF; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n<h2 id=\"auth-h\" style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 18px\">Your authority<\/h2>\n<div style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 700; font-size: 34px; color: #6FD3A4\">AED 500,000<\/div>\n<div style=\"font-size: 13px; color: rgba(255,255,255,.86)\">Head of division · contracts up to this amount, document approval and sharing for IT.<\/div>\n<div style=\"font-size: 12px; color: rgba(255,255,255,.75)\">Secret is never delegable.<\/div>\n<\/div>\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-weight: 700\">Delegated to me<\/span>\n<div style=\"display: flex; gap: 12px; align-items: center; padding-top: 6px\"><span style=\"width: 40px; height: 40px; border-radius: 20px; background: #E2F1EA; color: #005F4F; font-weight: 700; display: flex; align-items: center; justify-content: center\">AM<\/span><div style=\"flex: 1\"><div style=\"font-weight: 700\">Ali M. · Sector Director<\/div><div style=\"font-size: 13px; color: #4A6B6C\">Travel · 2–9 Nov · 6 tasks routed<\/div><\/div><span style=\"padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: #E2F1EA; color: #005F4F\">Active<\/span><\/div>\n<\/div>\n<\/aside>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { tab: 'mine', revoked: {}, extraLog: [] }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const T = {\n      tabs: [['mine', 'My delegations · 2'], ['tome', 'Delegated to me · 1'], ['doa', 'DoA matrix'], ['log', 'Log']],\n      revoked: 'Revoked', now: 'Just now', you: 'You',\n      newMsg: 'New delegation started · choose a delegate and period',\n      editMsg: (to) => 'Delegation to ' + to + ' opened for editing',\n      cantEdit: 'A revoked delegation cannot be edited · create a new one',\n      already: (to) => 'Delegation to ' + to + ' is already revoked',\n      revMsg: (to) => 'Delegation to ' + to + ' revoked · pending tasks return to you',\n      revLog: (to) => 'Delegation to ' + to + ' revoked',\n      mine: [\n        { id: 'ks', status: 'Scheduled', stBg: '#FAE3BE', stFg: '#63420F', kind: 'Out of office', period: '14 Dec 2026 – 28 Dec 2026', ini: 'KS', to: 'Khalid S.', reason: 'Annual leave', scope: 'All approvals', max: 'Confidential', limit: '≤ 500,000', routed: '0' },\n        { id: 'sh', status: 'Active', stBg: '#E2F1EA', stFg: '#005F4F', kind: 'Standing', period: 'Since 01 Sep 2026', ini: 'SH', to: 'Sara H.', reason: 'External sharing requests for IT vendors', scope: 'Share', max: 'Sensitive', limit: '—', routed: '14' },\n      ],\n      toMe: [\n        { status: 'Active', stBg: '#E2F1EA', stFg: '#005F4F', kind: 'Out of office', period: '02 Nov 2026 – 09 Nov 2026', ini: 'AM', from: 'Ali M. · Sector Director', reason: 'Travel', scope: 'All approvals', max: 'Confidential', limit: '≤ 5,000,000', routed: '6' },\n      ],\n      doa: [\n        { role: 'Head of division', limit: '≤ 500,000', disp: '—', can: 'Yes' },\n        { role: 'Sector Director', limit: '≤ 5,000,000', disp: 'Vote', can: 'Yes' },\n        { role: 'Deputy Director General', limit: 'Unlimited', disp: 'Approve', can: 'Yes' },\n      ],\n      log: [\n        { when: '02 Nov 2026 · 08:00', what: 'Delegation from Ali M. started · Travel · 6 tasks routed', who: 'Workflow' },\n        { when: '28 Oct 2026 · 14:22', what: 'Out-of-office delegation to Khalid S. scheduled · 14–28 Dec', who: 'You' },\n        { when: '15 Oct 2026 · 11:05', what: 'Share request routed to Sara H. under standing delegation', who: 'Workflow' },\n        { when: '01 Sep 2026 · 09:30', what: 'Standing delegation to Sara H. created · Share, up to Sensitive', who: 'You' },\n      ],\n    };\n    const st = this.state || {};\n    const tab = st.tab || 'mine', revoked = st.revoked || {}, extraLog = st.extraLog || [];\n    const tabs = T.tabs.map(([id, label]) => ({ label, sel: tab === id ? 'true' : 'false', line: tab === id ? '#269D6A' : 'transparent', weight: tab === id ? 700 : 400, fg: tab === id ? '#003234' : '#3D5F60', pick: () => this.setState({ tab: id }) }));\n    const mine = T.mine.map(d => {\n      const off = !!revoked[d.id];\n      return { ...d, status: off ? T.revoked : d.status, stBg: off ? '#FBE4DF' : d.stBg, stFg: off ? '#B01C01' : d.stFg,\n        edit: () => this.say(off ? T.cantEdit : T.editMsg(d.to)),\n        revoke: () => {\n          if (off) { this.say(T.already(d.to)); return; }\n          this.setState({ revoked: { ...revoked, [d.id]: true }, extraLog: [{ when: T.now, what: T.revLog(d.to), who: T.you }, ...extraLog] });\n          this.say(T.revMsg(d.to));\n        } };\n    });\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      onNew: () => this.say(T.newMsg),\n      tabs, mine,\n      showMine: tab === 'mine', showToMe: tab === 'tome', showDoa: tab === 'mine' || tab === 'doa', showLog: tab === 'log',\n      toMe: T.toMe, doa: T.doa, log: [...extraLog, ...T.log],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1200}}});
</script>
