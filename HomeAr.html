DCRun(window.DAS_COMPONENTS, {"name": "HomeAr", "template": "\n<helmet>\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div dir=\"rtl\" style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Neue Frutiger World','Segoe UI',system-ui,sans-serif; font-size: 14px; line-height: 1.6\">\n<dc-import name=\"Sidebar\" active=\"home\" lang=\"ar\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"Home\" crumb=\"الرئيسية\" lang=\"ar\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 24px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div>\n<div style=\"font-size: 13px; color: #4A6B6C\">الجمعة، 6 نوفمبر 2026<\/div>\n<h1 style=\"margin: 4px 0 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 32px; line-height: 1.3\">صباح الخير، عبير<\/h1>\n<div style=\"margin-top: 4px; color: #4A6B6C\">لديك <strong style=\"color: #003234\">7 مهام<\/strong> بانتظارك، إحداها متأخرة.<\/div>\n<\/div>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<a href=\"SearchAr.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; text-decoration: none\">البحث في الأرشيف<\/a>\n<a href=\"CaptureQueueAr.html\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; background: #005F4F; color: #FFFFFF; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; text-decoration: none\">\n<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 16V4M7 9l5-5 5 5M4 20h16\"><\/path><\/svg>رفع أو مسح ضوئي<\/a>\n<\/div>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n<sc-for list=\"{{stats}}\" as=\"s\" hint-placeholder-count=\"4\">\n<dc-import name=\"StatTile\" label=\"{{s.label}}\" value=\"{{s.n}}\" sub=\"{{s.sub}}\" icon=\"{{s.icon}}\" tone=\"{{s.tone}}\" href=\"{{s.href}}\" lang=\"ar\" hint-size=\"100%,146px\"><\/dc-import>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n<section aria-labelledby=\"tasks-ar\" style=\"flex: 2 1 560px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 12px\"><h2 id=\"tasks-ar\" style=\"margin: 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 20px\">مهامي<\/h2><a href=\"ApprovalsAr.html\" style=\"font-weight: 700; font-size: 13px\">كل الموافقات ←<\/a><\/div>\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; min-width: 640px\">\n<thead><tr style=\"color: #4A6B6C; font-size: 12px\">\n<th scope=\"col\" style=\"text-align: start; padding: 10px 24px; border-bottom: 1px solid #E5E2CB\">الإجراء · الأولوية<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #E5E2CB\">الوثيقة<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 12px; border-bottom: 1px solid #E5E2CB\">من<\/th>\n<th scope=\"col\" style=\"text-align: start; padding: 10px 24px 10px 12px; border-bottom: 1px solid #E5E2CB\">مستوى الخدمة<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{tasks}}\" as=\"t\" hint-placeholder-count=\"4\">\n<tr>\n<td style=\"padding: 14px 24px; border-bottom: 1px solid #F0EEE2\"><div style=\"font-weight: 700\">{{t.action}}<\/div><span style=\"display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: {{t.pBg}}; color: {{t.pFg}}\">{{t.priority}}<\/span><\/td>\n<td style=\"padding: 14px 12px; border-bottom: 1px solid #F0EEE2\"><a href=\"TaskAr.html\" style=\"font-weight: 700; text-decoration: none\">{{t.title}}<\/a><div dir=\"ltr\" style=\"text-align: end; font-size: 12px; color: #4A6B6C; font-family: Consolas, monospace\">{{t.code}}<\/div><\/td>\n<td style=\"padding: 14px 12px; border-bottom: 1px solid #F0EEE2\">{{t.from}}<\/td>\n<td style=\"padding: 14px 24px 14px 12px; border-bottom: 1px solid #F0EEE2; white-space: nowrap\"><div style=\"font-weight: 700; color: {{t.slaFg}}\">{{t.sla}}<\/div><div style=\"width: 80px; height: 5px; border-radius: 3px; background: #E5E2CB; margin-top: 6px; overflow: hidden\"><div style=\"height: 100%; width: {{t.slaW}}; background: {{t.slaBar}}\"><\/div><\/div><\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n<\/section>\n\n<div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<section aria-labelledby=\"ch-ar\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px\">\n<h2 id=\"ch-ar\" style=\"margin: 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\">الالتقاط حسب القناة · اليوم<\/h2>\n<sc-for list=\"{{channels}}\" as=\"c\" hint-placeholder-count=\"5\">\n<div style=\"display: grid; grid-template-columns: 96px 1fr 44px; gap: 10px; align-items: center; font-size: 13px\">\n<span>{{c.name}}<\/span><span style=\"height: 10px; border-radius: 5px; background: #E5E2CB; overflow: hidden\"><span style=\"display: block; height: 100%; width: {{c.w}}; background: #269D6A; border-radius: 5px\"><\/span><\/span><span style=\"text-align: end; font-weight: 700\">{{c.n}}<\/span>\n<\/div>\n<\/sc-for>\n<\/section>\n<section style=\"background: #003234; color: #FFFFFF; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-size: 12px; color: #8FD9B5; font-weight: 700\">إشعار المنصة<\/span>\n<p style=\"margin: 0\">قُدّمت خطة الاستبقاء v2026.2 إلى الأرشيف الوطني في 14 سبتمبر. تتأثر 12 سلسلة.<\/p>\n<a href=\"AdminAr.html\" style=\"align-self: flex-start; color: #FFFFFF; font-weight: 700; font-size: 13px\">عرض التغيير ←<\/a>\n<\/section>\n<\/div>\n<\/div>\n\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  renderVals() {\n    const P = { 'عالية': ['#FAE5E0', '#B01C01'], 'عادية': ['#EEF0F3', '#3F4146'], 'منخفضة': ['#E2F1EA', '#005F4F'] };\n    const S = { ok: ['#005F4F', '#269D6A'], warn: ['#63420F', '#CE9842'], err: ['#B01C01', '#D12101'] };\n    const t = (action, title, code, from, priority, sla, st, w) => ({ action, title, code, from, priority, pBg: P[priority][0], pFg: P[priority][1], sla, slaFg: S[st][0], slaBar: S[st][1], slaW: w });\n    return {\n      stats: [\n        { label: 'بانتظار موافقتي', n: '7', sub: 'تظهر هنا تجاوزات مستوى الخدمة', href: 'ApprovalsAr.html', icon: 'tasks', tone: 'default' },\n        { label: 'في منطقة الإيداع · ليست سجلات بعد', n: '4', sub: 'دون حد ثقة التصنيف', href: 'CaptureQueueAr.html', icon: 'capture', tone: 'default' },\n        { label: 'ما أودعته إدارتي · 30 يوماً', n: '1,284', sub: '94 % مصنّفة تلقائياً', href: 'SearchAr.html', icon: 'archive', tone: 'default' },\n        { label: 'بوابات استبقاء مستحقة · 90 يوماً', n: '38', sub: 'البوابة 1 · البوابة 2', href: 'RecordsConsoleAr.html', icon: 'hourglass', tone: 'default' },\n      ],\n      tasks: [\n        t('اعتماد وثيقة', 'سياسة أمن المعلومات — الإصدار 4', 'SS-IT-PY-02-R4', 'عبير أ.', 'عالية', '3س 40د', 'err', '86%'),\n        t('اعتماد عقد', 'تجديد عقد صيانة الشبكة', 'SS-IT-CR-118', 'س. حسن', 'عادية', '1ي 6س', 'warn', '55%'),\n        t('اعتماد مشاركة خارجية', 'مشاركة خارجية · المورد X', 'SS-IT-RE-041', 'سارة ح.', 'عادية', '2ي 4س', 'ok', '30%'),\n
