<div id="dc-root"></div>
<script>
DCRun(window.DAS_COMPONENTS, {"name": "DelegationAr", "template": "\n<helmet>\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div dir=\"rtl\" style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4EE; color: #003234; font-family: 'Neue Frutiger World','Segoe UI',system-ui,sans-serif; font-size: 14px; line-height: 1.6\">\n<dc-import name=\"Sidebar\" active=\"delegation\" lang=\"ar\" hint-size=\"264px,100%\"><\/dc-import>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<dc-import name=\"Topbar\" page=\"Delegation\" crumb=\"التفويض\" lang=\"ar\" persona=\"khalid\" hint-size=\"100%,72px\"><\/dc-import>\n<main style=\"padding: 32px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n<div><div style=\"font-size: 13px; color: #4A6B6C\">تفويض الصلاحيات · <span dir=\"ltr\">DoA-2026<\/span><\/div>\n<h1 style=\"margin: 4px 0 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 32px\">التفويض<\/h1><\/div>\n<button type=\"button\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #005F4F; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{onNew}}\">+ تفويض جديد<\/button>\n<\/div>\n\n<div role=\"tablist\" aria-label=\"طرق عرض التفويض\" style=\"display: flex; gap: 24px; border-bottom: 1px solid #DCE3E0; overflow-x: auto\">\n<sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"4\">\n<button type=\"button\" role=\"tab\" aria-selected=\"{{t.sel}}\" onClick=\"{{t.pick}}\" style=\"height: 44px; border: 0; border-bottom: 3px solid {{t.line}}; background: transparent; font: inherit; font-weight: {{t.weight}}; color: {{t.fg}}; white-space: nowrap; cursor: pointer\">{{t.label}}<\/button>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<div style=\"flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<sc-if value=\"{{showMine}}\" hint-placeholder-val=\"{{ true }}\">\n<sc-for list=\"{{mine}}\" as=\"d\" hint-placeholder-count=\"2\">\n<article style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\"><span style=\"padding: 2px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; background: {{d.stBg}}; color: {{d.stFg}}\">{{d.status}}<\/span><span style=\"padding: 2px 10px; border-radius: 6px; font-size: 12px; background: #EEF0F3; color: #3F4146\">{{d.kind}}<\/span><span style=\"flex: 1\"><\/span><span style=\"font-size: 13px; color: #4A6B6C\">{{d.period}}<\/span><\/div>\n<div style=\"display: flex; gap: 14px; align-items: center\"><span style=\"width: 44px; height: 44px; border-radius: 22px; background: #E2F1EA; color: #005F4F; font-weight: 700; display: flex; align-items: center; justify-content: center\">{{d.ini}}<\/span><div><div style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\">إلى {{d.to}}<\/div><div style=\"font-size: 13px; color: #4A6B6C\">{{d.reason}}<\/div><\/div><\/div>\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; background: #F9F9F5; border-radius: 10px; padding: 12px; font-size: 13px\">\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">النطاق<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.scope}}<\/dd><\/div>\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">أعلى درجة سرية<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.max}}<\/dd><\/div>\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">حدّ المبلغ<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.limit}}<\/dd><\/div>\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">المهام المحوّلة<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.routed}}<\/dd><\/div>\n<\/dl>\n<div style=\"display: flex; gap: 8px; justify-content: flex-end\"><button type=\"button\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{d.edit}}\">تعديل<\/button><button type=\"button\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #D12101; background: #FFFFFF; color: #B01C01; font: inherit; font-weight: 700; cursor: pointer\" onClick=\"{{d.revoke}}\">إلغاء التفويض<\/button><\/div>\n<\/article>\n<\/sc-for>\n<\/sc-if>\n\n<sc-if value=\"{{showToMe}}\" hint-placeholder-val=\"{{ false }}\">\n<sc-for list=\"{{toMe}}\" as=\"d\" hint-placeholder-count=\"1\">\n<article style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\"><span style=\"padding: 2px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; background: {{d.stBg}}; color: {{d.stFg}}\">{{d.status}}<\/span><span style=\"padding: 2px 10px; border-radius: 6px; font-size: 12px; background: #EEF0F3; color: #3F4146\">{{d.kind}}<\/span><span style=\"flex: 1\"><\/span><span style=\"font-size: 13px; color: #4A6B6C\">{{d.period}}<\/span><\/div>\n<div style=\"display: flex; gap: 14px; align-items: center\"><span style=\"width: 44px; height: 44px; border-radius: 22px; background: #E2F1EA; color: #005F4F; font-weight: 700; display: flex; align-items: center; justify-content: center\">{{d.ini}}<\/span><div><div style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\">من {{d.from}}<\/div><div style=\"font-size: 13px; color: #4A6B6C\">{{d.reason}}<\/div><\/div><\/div>\n<dl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; background: #F9F9F5; border-radius: 10px; padding: 12px; font-size: 13px\">\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">النطاق<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.scope}}<\/dd><\/div>\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">أعلى درجة سرية<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.max}}<\/dd><\/div>\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">حدّ المبلغ<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.limit}}<\/dd><\/div>\n<div><dt style=\"font-size: 12px; color: #4A6B6C\">المهام المحوّلة<\/dt><dd style=\"margin: 0; font-weight: 700\">{{d.routed}}<\/dd><\/div>\n<\/dl>\n<div style=\"display: flex; gap: 8px; justify-content: flex-end\"><a href=\"ApprovalsAr.html\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #B2C4BE; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">فتح المهام المحوّلة<\/a><\/div>\n<\/article>\n<\/sc-for>\n<\/sc-if>\n\n<sc-if value=\"{{showLog}}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"dloga-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<h2 id=\"dloga-h\" style=\"margin: 0; padding: 16px 20px; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px; border-bottom: 1px solid #E5E2CB\">سجل التفويض<\/h2>\n<div style=\"overflow-x: auto\"><table style=\"width: 100%; border-collapse: collapse; min-width: 560px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\"><th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">الوقت<\/th><th scope=\"col\" style=\"text-align: start; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">الحدث<\/th><th scope=\"col\" style=\"text-align: start; padding: 10px 20px 10px 8px; border-bottom: 1px solid #E5E2CB\">بواسطة<\/th><\/tr><\/thead>\n<tbody><sc-for list=\"{{log}}\" as=\"g\" hint-placeholder-count=\"4\"><tr><td style=\"padding: 12px 20px; border-bottom: 1px solid #F0EEE2; white-space: nowrap; color: #4A6B6C\">{{g.when}}<\/td><td style=\"padding: 12px 8px; border-bottom: 1px solid #F0EEE2\">{{g.what}}<\/td><td style=\"padding: 12px 20px 12px 8px; border-bottom: 1px solid #F0EEE2; font-weight: 700\">{{g.who}}<\/td><\/tr><\/sc-for><\/tbody>\n<\/table><\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{showDoa}}\" hint-placeholder-val=\"{{ true }}\">\n<section aria-labelledby=\"doaa-h\" style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB\">\n<h2 id=\"doaa-h\" style=\"margin: 0; padding: 16px 20px; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px; border-bottom: 1px solid #E5E2CB\">مصفوفة تفويض الصلاحيات<\/h2>\n<div style=\"overflow-x: auto\"><table style=\"width: 100%; border-collapse: collapse; min-width: 680px; font-size: 13px\">\n<thead><tr style=\"font-size: 12px; color: #4A6B6C\"><th scope=\"col\" style=\"text-align: start; padding: 10px 20px; border-bottom: 1px solid #E5E2CB\">الدور<\/th><th scope=\"col\" style=\"padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">اعتماد الوثائق<\/th><th scope=\"col\" style=\"padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">المشاركة<\/th><th scope=\"col\" style=\"text-align: end; padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">العقود (درهم)<\/th><th scope=\"col\" style=\"padding: 10px 8px; border-bottom: 1px solid #E5E2CB\">الإتلاف<\/th><th scope=\"col\" style=\"padding: 10px 20px 10px 8px; border-bottom: 1px solid #E5E2CB\">يمكنه التفويض<\/th><\/tr><\/thead>\n<tbody><sc-for list=\"{{doa}}\" as=\"m\" hint-placeholder-count=\"3\"><tr><td style=\"padding: 12px 20px; border-bottom: 1px solid #F0EEE2; font-weight: 700\">{{m.role}}<\/td><td style=\"text-align: center; border-bottom: 1px solid #F0EEE2; color: #005F4F; font-weight: 700\">✓<\/td><td style=\"text-align: center; border-bottom: 1px solid #F0EEE2; color: #005F4F; font-weight: 700\">✓<\/td><td style=\"text-align: end; padding: 12px 8px; border-bottom: 1px solid #F0EEE2; font-weight: 700\">{{m.limit}}<\/td><td style=\"text-align: center; border-bottom: 1px solid #F0EEE2\">{{m.disp}}<\/td><td style=\"text-align: center; padding-inline-end: 20px; border-bottom: 1px solid #F0EEE2\">{{m.can}}<\/td><\/tr><\/sc-for><\/tbody>\n<\/table><\/div>\n<\/section>\n<\/sc-if>\n<\/div>\n\n<aside aria-labelledby=\"autha-h\" style=\"flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"background: #003234; color: #FFFFFF; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n<h2 id=\"autha-h\" style=\"margin: 0; font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 500; font-size: 18px\">صلاحياتك<\/h2>\n<div style=\"font-family: '29LT Bukra','Segoe UI',system-ui,sans-serif; font-weight: 700; font-size: 34px; color: #6FD3A4\">500,000 درهم<\/div>\n<div style=\"font-size: 13px; color: rgba(255,255,255,.86)\">رئيس الإدارة · العقود حتى هذا المبلغ، واعتماد الوثائق ومشاركتها لتقنية المعلومات.<\/div>\n<div style=\"font-size: 12px; color: rgba(255,255,255,.75)\">درجة «سري للغاية» غير قابلة للتفويض مطلقاً.<\/div>\n<\/div>\n<div style=\"background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E2CB; padding: 20px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-weight: 700\">مفوَّضة إليّ<\/span>\n<div style=\"display: flex; gap: 12px; align-items: center; padding-top: 6px\"><span style=\"width: 40px; height: 40px; border-radius: 20px; background: #E2F1EA; color: #005F4F; font-weight: 700; display: flex; align-items: center; justify-content: center\">ع م<\/span><div style=\"flex: 1\"><div style=\"font-weight: 700\">علي م. · مدير القطاع<\/div><div style=\"font-size: 13px; color: #4A6B6C\">سفر · 2–9 نوفمبر · 6 مهام محوّلة<\/div><\/div><span style=\"padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: #E2F1EA; color: #005F4F\">نشط<\/span><\/div>\n<\/div>\n<\/aside>\n<\/div>\n\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { tab: 'mine', revoked: {}, extraLog: [] }; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const T = {\n      tabs: [['mine', 'تفويضاتي · 2'], ['tome', 'مفوَّضة إليّ · 1'], ['doa', 'مصفوفة تفويض الصلاحيات'], ['log', 'السجل']],\n      revoked: 'ملغى', now: 'الآن', you: 'أنت',\n      newMsg: 'بدأ تفويض جديد · اختر المفوَّض إليه والفترة',\n      editMsg: (to) => 'فُتح التفويض إلى ' + to + ' للتعديل',\n      cantEdit: 'لا يمكن تعديل تفويض ملغى · أنشئ تفويضاً جديداً',\n      already: (to) => 'التفويض إلى ' + to + ' ملغى مسبقاً',\n      revMsg: (to) => 'أُلغي التفويض إلى ' + to + ' · تعود المهام المعلّقة إليك',\n      revLog: (to) => 'إلغاء التفويض إلى ' + to,\n      mine: [\n        { id: 'ks', status: 'مجدول', stBg: '#FAE3BE', stFg: '#63420F', kind: 'خارج المكتب', period: '14 ديسمبر 2026 – 28 ديسمبر 2026', ini: 'خ س', to: 'خالد س.', reason: 'إجازة سنوية', scope: 'جميع الموافقات', max: 'سري', limit: '≤ 500,000', routed: '0' },\n        { id: 'sh', status: 'نشط', stBg: '#E2F1EA', stFg: '#005F4F', kind: 'دائم', period: 'منذ 01 سبتمبر 2026', ini: 'س ح', to: 'سارة ح.', reason: 'طلبات المشاركة الخارجية لموردي تقنية المعلومات', scope: 'المشاركة', max: 'حساس', limit: '—', routed: '14' },\n      ],\n      toMe: [\n        { status: 'نشط', stBg: '#E2F1EA', stFg: '#005F4F', kind: 'خارج المكتب', period: '02 نوفمبر 2026 – 09 نوفمبر 2026', ini: 'ع م', from: 'علي م. · مدير القطاع', reason: 'سفر', scope: 'جميع الموافقات', max: 'سري', limit: '≤ 5,000,000', routed: '6' },\n      ],\n      doa: [\n        { role: 'رئيس الإدارة', limit: '≤ 500,000', disp: '—', can: 'نعم' },\n        { role: 'مدير القطاع', limit: '≤ 5,000,000', disp: 'تصويت', can: 'نعم' },\n        { role: 'نائب المدير العام', limit: 'غير محدود', disp: 'اعتماد', can: 'نعم' },\n      ],\n      log: [\n        { when: '02 نوفمبر 2026 · 08:00', what: 'بدء التفويض من علي م. · سفر · 6 مهام محوّلة', who: 'سير العمل' },\n        { when: '28 أكتوبر 2026 · 14:22', what: 'جدولة تفويض خارج المكتب إلى خالد س. · 14–28 ديسمبر', who: 'أنت' },\n        { when: '15 أكتوبر 2026 · 11:05', what: 'تحويل طلب مشاركة إلى سارة ح. بموجب التفويض الدائم', who: 'سير العمل' },\n        { when: '01 سبتمبر 2026 · 09:30', what: 'إنشاء تفويض دائم إلى سارة ح. · المشاركة حتى «حساس»', who: 'أنت' },\n      ],\n    };\n    const st = this.state || {};\n    const tab = st.tab || 'mine', revoked = st.revoked || {}, extraLog = st.extraLog || [];\n    const tabs = T.tabs.map(([id, label]) => ({ label, sel: tab === id ? 'true' : 'false', line: tab === id ? '#269D6A' : 'transparent', weight: tab === id ? 700 : 400, fg: tab === id ? '#003234' : '#3D5F60', pick: () => this.setState({ tab: id }) }));\n    const mine = T.mine.map(d => {\n      const off = !!revoked[d.id];\n      return { ...d, status: off ? T.revoked : d.status, stBg: off ? '#FBE4DF' : d.stBg, stFg: off ? '#B01C01' : d.stFg,\n        edit: () => this.say(off ? T.cantEdit : T.editMsg(d.to)),\n        revoke: () => {\n          if (off) { this.say(T.already(d.to)); return; }\n          this.setState({ revoked: { ...revoked, [d.id]: true }, extraLog: [{ when: T.now, what: T.revLog(d.to), who: T.you }, ...extraLog] });\n          this.say(T.revMsg(d.to));\n        } };\n    });\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      onNew: () => this.say(T.newMsg),\n      tabs, mine,\n      showMine: tab === 'mine', showToMe: tab === 'tome', showDoa: tab === 'mine' || tab === 'doa', showLog: tab === 'log',\n      toMe: T.toMe, doa: T.doa, log: [...extraLog, ...T.log],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 1200}}});
</script>
