DCRun(window.DAS_COMPONENTS, {"name": "SignIn", "template": "\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap\">\n<style>\nbody{margin:0}\na{color:#005F4F}a:hover{color:#00453F}\n<\/style>\n<\/helmet>\n<div style=\"min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EE; color: #003234; font-family: 'Roboto',system-ui,sans-serif; font-size: 15px\">\n<section style=\"flex: 1 1 520px; background: #003234; color: #FFFFFF; padding: 56px 6vw; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; position: relative; overflow: hidden\">\n<span role=\"img\" aria-label=\"Abu Dhabi Pension Fund\" style=\"position: relative; display: block; flex: 0 0 auto; align-self: flex-start; width: 195px; height: 110px\"><img src=\"./assets/adpf-logo-white.png\" alt=\"\" style=\"position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain\"><\/span>\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 520px; position: relative\">\n<span style=\"font-size: 14px; color: rgba(255,255,255,.8)\">DAS · Document Archiving System<\/span>\n<h1 style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 44px; line-height: 1.15\">Every record, filed right and found fast.<\/h1>\n<p style=\"margin: 0; font-size: 17px; color: rgba(255,255,255,.86)\">Capture, approve, file and keep the Fund's documents under one file plan, with retention and audit built in.<\/p>\n<div style=\"display: flex; gap: 36px; flex-wrap: wrap; margin-top: 12px\">\n<div><div style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 700; font-size: 40px; color: #6FD3A4\">v5<\/div><div style=\"font-size: 13px; color: rgba(255,255,255,.8)\">File plan<\/div><\/div>\n<div><div style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 700; font-size: 40px; color: #6FD3A4\">10<\/div><div style=\"font-size: 13px; color: rgba(255,255,255,.8)\">SharePoint sites<\/div><\/div>\n<div><div style=\"font-family: 'Roboto',system-ui,sans-serif; font-weight: 700; font-size: 40px; color: #6FD3A4\">EN · ع<\/div><div style=\"font-size: 13px; color: rgba(255,255,255,.8)\">Bilingual<\/div><\/div>\n<\/div>\n<\/div>\n<svg aria-hidden=\"true\" width=\"520\" height=\"520\" viewBox=\"0 0 520 520\" style=\"position: absolute; inset-inline-end: -160px; bottom: -160px; opacity: .14\"><circle cx=\"260\" cy=\"260\" r=\"250\" fill=\"none\" stroke=\"#7EA393\" stroke-width=\"2\"><\/circle><circle cx=\"260\" cy=\"260\" r=\"180\" fill=\"none\" stroke=\"#7EA393\" stroke-width=\"2\"><\/circle><circle cx=\"260\" cy=\"260\" r=\"110\" fill=\"none\" stroke=\"#269D6A\" stroke-width=\"2\"><\/circle><\/svg>\n<span style=\"font-size: 12px; color: rgba(255,255,255,.7)\">© 2026 Abu Dhabi Pension Fund · Internal use only<\/span>\n<\/section>\n\n<section style=\"flex: 1 1 480px; display: flex; align-items: center; justify-content: center; padding: 56px 24px; box-sizing: border-box\">\n<div style=\"width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 24px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<h2 style=\"margin: 0; font-family: 'Roboto',system-ui,sans-serif; font-weight: 500; font-size: 30px\">Sign in<\/h2>\n<a href=\"SignInAr.html\" lang=\"ar\" aria-label=\"العربية\" style=\"height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #CCC9B4; background: #FFFFFF; color: #003234; font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none\">العربية<\/a>\n<\/div>\n<p style=\"margin: 0; color: #4A6B6C\">Use your Fund account. Your access follows your sector, division and role.<\/p>\n<a href=\"Home.html\" style=\"height: 52px; border-radius: 10px; background: #005F4F; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 3h8.5v8.5H3zM12.5 3H21v8.5h-8.5zM3 12.5h8.5V21H3zM12.5 12.5H21V21h-8.5z\" fill=\"#FFFFFF\"><\/path><\/svg>Sign in with Microsoft<\/a>\n<div style=\"display: flex; align-items: center; gap: 12px; color: #4A6B6C; font-size: 13px\"><span style=\"flex: 1; height: 1px; background: #CCC9B4\"><\/span>Development personas · stub mode<span style=\"flex: 1; height: 1px; background: #CCC9B4\"><\/span><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<sc-for list=\"{{personas}}\" as=\"p\" hint-placeholder-count=\"4\">\n<a href=\"Home.html\" style=\"display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E5E2CB; text-decoration: none; color: #003234\">\n<span style=\"width: 40px; height: 40px; border-radius: 20px; background: #E2F1EA; color: #005F4F; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center\">{{p.ini}}<\/span>\n<span style=\"flex: 1; display: flex; flex-direction: column\"><span style=\"font-weight: 700\">{{p.name}}<\/span><span style=\"font-size: 13px; color: #4A6B6C\">{{p.roles}}<\/span><\/span>\n<span style=\"font-size: 12px; color: #4A6B6C; font-family: 'Roboto Mono',Consolas,monospace\">{{p.org}}<\/span>\n<\/a>\n<\/sc-for>\n<\/div>\n<p style=\"margin: 0; font-size: 13px; color: #4A6B6C\">Having trouble? Contact the IT service desk. <button type=\"button\" onClick=\"{{onA11y}}\" style=\"border: 0; padding: 0; background: transparent; font: inherit; color: #005F4F; text-decoration: underline; cursor: pointer\">Accessibility statement<\/button><\/p>\n<\/div>\n<\/section>\n<sc-if value=\"{{toastOn}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50; max-width: 420px; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: #003234; color: #FFFFFF; box-shadow: 0 12px 32px rgba(0,50,52,.22); font-size: 14px\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FD3A4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n<span style=\"flex: 1\">{{toastText}}<\/span>\n<\/div>\n<\/sc-if>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = this.state || {}; }\n  say(text) { clearTimeout(this._t); this.setState({ toast: text }); this._t = setTimeout(() => this.setState({ toast: null }), 2600); }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    return {\n      toastOn: !!(this.state && this.state.toast), toastText: (this.state && this.state.toast) || '',\n      onA11y: () => this.say('DAS targets WCAG 2.2 AA · report issues to the IT service desk'),\n      personas: [\n        { ini: 'AA', name: 'Abeer A.', roles: 'Staff · Project manager', org: 'SS · IT' },\n        { ini: 'KM', name: 'Khalid Al Mazrouei', roles: 'Head of division · Information owner', org: 'SS · IT' },\n        { ini: 'RS', name: 'R. Al Shamsi', roles: 'Staff · Records officer', org: 'SS · RA' },\n        { ini: 'AK', name: 'A. Al Ketbi', roles: 'Staff', org: 'SS · IT' },\n      ],\n    };\n  }\n}\n", "props": {"$preview": {"width": 1440, "height": 900}}});
